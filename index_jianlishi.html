            { id: 26038, chapter: 26, group: 'exam', text: '在信息系统软件开发过程中，（ ）阶段确定了软件设计的约束和软件同其他系统的接口。', options: ['A、商务合同', 'B、设计开发', 'C、项目计划', 'D、需求分析'], answer: 'D', explanation: '知识点：软件设计、需求分析、开发过程。需求分析阶段确定软件设计的约束和同其他系统的接口。' },
            { id: 26039, chapter: 26, group: 'exam', text: '监理单位与承建单位按照下列(42)的方式开展工作。', options: ['A、监理单位按工程建设合同开展监理工作，承建单位按监理合同接受监理', 'B、监理单位按监理合同开展监理工作，承建单位按工程建设合同接受监理', 'C、监理单位按监理合同开展监理工作，承建单位按监理合同和工程建设合同接受监理', 'D、监理单位和承建单位均按监理合同和工程建设合同开展监理或接受监理'], answer: 'B', explanation: '知识点：承建单位、监理单位。监理单位依据监理合同开展工作，承建单位依据工程建设合同接受监理。' },
            { id: 26040, chapter: 26, group: 'exam', text: '信息化工程中，监理规划应在签订委托监理合同后及(43)进行编制。', options: ['A、实施组织设计批准后', 'B、初步设计文件批准后', 'C、工程实施开始前', 'D、收到实施设计文件后'], answer: 'C', explanation: '知识点：监理规划。监理规划应在签订委托监理合同后、工程实施开始前编制。' },
            { id: 26041, chapter: 26, group: 'exam', text: '在面向对象的开发方法中，()是指在某个类的层次关联中不同的类共享属性和方法的一种机制。', options: ['A、消息', 'B、继承', 'C、多态', 'D、封装'], answer: 'B', explanation: '知识点：面向对象方法。不同类之间共享属性和方法的机制是继承。' },
            { id: 26042, chapter: 26, group: 'exam', text: '在工程(57)阶段，监理工程师应协助建设单位正确编制工程结算。', options: ['A、验收', 'B、启动', 'C、设计', 'D、实施'], answer: 'A', explanation: '知识点：建设单位。工程结算应在验收阶段协助建设单位正确编制。' },
            { id: 26043, chapter: 26, group: 'exam', text: '现行的《信息化工程监理规范》是（ ）。', options: ['A、GB/T 19668.1-2014', 'B、GB/T 19668.1-2017', 'C、GB/T 19668.1-2016', 'D、GB/T 19668.1-2015'], answer: 'A', explanation: '知识点：监理相关法规。现行的《信息化工程监理规范》为GB/T 19668.1-2014。' },
            { id: 26044, chapter: 26, group: 'exam', text: '由于承建单位的原因使监理单位增加了监理服务时间，此项工作应属于(38)。', options: ['A、额外工作', 'B、附加工作', 'C、正常工作', 'D、意外工作'], answer: 'B', explanation: '知识点：影响进度的因素。因监理单位以外原因(如承建单位原因)增加的监理服务时间属于附加工作。' },
            { id: 26045, chapter: 26, group: 'exam', text: '云服务中的公共云使得多个客户可共享一个服务提供商的系统资源。我们平常使用的网上相册，属于公共云中的（ ）类别。', options: ['A、DaaS', 'B、SaaS', 'C、PaaS', 'D、IaaS'], answer: 'B', explanation: '知识点：信息网络系统。网上相册属于面向最终用户的软件即服务(SaaS)。' },
            { id: 26046, chapter: 26, group: 'exam', text: '信息系统项目管理的14要素中立项管理和（ ）是由建设单位重点实施的。', options: ['A、沟通协调管理', 'B、人员管理', 'C、评估与验收管理', 'D、知识产权管理'], answer: 'C', explanation: '知识点：建设单位、项目管理知识体系。立项管理和评估与验收管理由建设单位重点实施。' },
            { id: 26047, chapter: 26, group: 'exam', text: '一个实施合同的当事人在合同中未选择协议管辖，实施合同发生纠纷后，实施企业应当向(62)人民法院提出诉讼申请。', options: ['A、合同签订地', 'B、承建单位所在地', 'C、工程项目所在地', 'D、建设单位所在地'], answer: 'C', explanation: '知识点：合同争议。实施合同纠纷适用专属管辖，由工程项目所在地人民法院管辖。' },
            { id: 26048, chapter: 26, group: 'exam', text: '将IP地址转换为物理地址的协议是(7)。', options: ['A、TCP', 'B、ARP', 'C、ICMP', 'D、DNS'], answer: 'B', explanation: '知识点：网际层、IP地址。ARP(地址解析协议)将IP地址转换为物理(MAC)地址。' },
            { id: 26049, chapter: 26, group: 'exam', text: '某信息系统建设项目进入开发阶段，由于数据分析模型的开发人员能力欠缺，相关系统的开发任务未能按时完成。这种情况是由于（）造成的。', options: ['A、技术不成熟', 'B、质量控制不到位', 'C、需求频繁变更', 'D、资源投入不足'], answer: 'D', explanation: '知识点：信息系统建设。开发人员能力欠缺导致任务延误，属于资源(人力资源)投入不足。' },
            { id: 26050, chapter: 26, group: 'exam', text: '某市正在建设智慧城市信息港工程，采用了城域网交换技术（ ），使用双总线体系结构，可支持200Mb/s的传输速率。', options: ['A、DQDB', 'B、FDDI', 'C、MPLS', 'D、TCP/IP'], answer: 'A', explanation: '知识点：城域网。DQDB采用双总线体系结构，是典型的城域网交换技术。' },
            { id: 26051, chapter: 26, group: 'exam', text: '从事信息化工程监理活动应有一套健全的管理制度和先进的管理方法，这是工程监理（）的体现。', options: ['A、公正性', 'B、独立性', 'C、科学性', 'D、客观性'], answer: 'C', explanation: '知识点：监理的概念。健全的管理制度和先进的管理方法体现监理的科学性。' },
            { id: 26052, chapter: 26, group: 'exam', text: '下述各项中，（ ）是监理实施细则的内容。', options: ['A、监理项目部的人员配备', 'B、工程项目概况', 'C、监理的控制要点及目标', 'D、监理项目部的组织结构'], answer: 'C', explanation: '知识点：监理实施细则。监理实施细则的核心内容是各专业的监理控制要点及目标。' },
            { id: 26053, chapter: 26, group: 'exam', text: '在变更申请中，应包括的内容主要有(59)。①变更的原因②变更的依据③变更所引起的资金变化④变更所引起的进度变化⑤变更的内容', options: ['A、①②③④⑤', 'B、①②⑤', 'C、①③④⑤', 'D、①③④'], answer: 'A', explanation: '知识点：变更控制的内容。变更申请应包括变更的原因、依据、内容以及引起的资金和进度变化。' },
            { id: 26054, chapter: 26, group: 'exam', text: '关于过程质量控制的实施要点，不正确的是：（ ）。', options: ['A、采用最新最先进设备时应设置质量控制点', 'B、对后续工程实施质量和安全有重大影响的工序应设置质量控制点', 'C、承建单位综合布线完成、网络通电测试合格后，通知监理单位进行测试检查', 'D、凡质量、技术方面有法律效力的凭证，只能由总监理工程师一人签署'], answer: 'D', explanation: '知识点：质量控制概论。有法律效力的凭证可由总监理工程师或其授权的监理工程师签署，“只能由总监一人签署”不正确。' },
            { id: 26055, chapter: 26, group: 'exam', text: '支持较高传输速率的无线网络协议是(11)。', options: ['A、802.11n', 'B、802.11a', 'C、802.11g', 'D、802.11b'], answer: 'A', explanation: '知识点：传输速率、网络协议。802.11n速率最高(可达300Mb/s及以上)。' },
            { id: 26056, chapter: 26, group: 'exam', text: '应用层DNS协议主要用于实现(10)的网络服务功能。', options: ['A、网络硬件地址到IP地址的映射', 'B、进程地址到IP地址的映射', 'C、网络设备名到IP地址的映射', 'D、用户名到进程地址的映射'], answer: 'C', explanation: '知识点：DNS、应用层。DNS实现网络设备名(域名)到IP地址的映射。' },
            { id: 26057, chapter: 26, group: 'exam', text: '()不属于工程变更控制的基本原则。', options: ['A、公布变更信息', 'B、选择成本最优的变更方案', 'C、任何变更都要得到三方确认', 'D、三方都有权提出变更'], answer: 'B', explanation: '知识点：变更控制基本原则。变更控制的基本原则不包括“选择成本最优的变更方案”。' },
            { id: 26058, chapter: 26, group: 'exam', text: '知识产权保护的监理应该坚持全过程的管理，管理措施不包括（ ）。', options: ['A、树立为建设单位和承建单位维权的意识', 'B、监督承建单位实施知识产权管理制度', 'C、监督建设单位制定知识产权管理制度', 'D、实施知识产权保护的监理措施'], answer: 'A', explanation: '知识点：知识产权保护的监理。知识产权保护管理措施包括监督制度建设与实施、实施保护措施等，“树立维权意识”不属于其管理措施。' },
            { id: 26059, chapter: 26, group: 'exam', text: '大数据具有“volume”、“variety”、“value”、“velocity”等特点，其中“volume”是指(1)。', options: ['A、数据相关性高', 'B、价值密度低', 'C、数据类型繁多', 'D、数据体量巨大'], answer: 'D', explanation: '知识点：大数据。volume指数据体量巨大。' },
            { id: 26060, chapter: 26, group: 'exam', text: '软件维护包含更正性维护、适应性维护、预防性维护、完善性维护。()属于完善性维护。', options: ['A、改进交付后产品的性能和可维护性', 'B、在软件产品中的潜在错误成为实际错误前进行完善', 'C、使软件产品能够在变化后的环境中继续使用', 'D、为改善性能而作的修改'], answer: 'A', explanation: '知识点：软件维护。完善性维护是改进交付后产品的性能和可维护性。' },
            { id: 26061, chapter: 26, group: 'exam', text: '一般来说，可作为信息系统建设合同组成部分的材料不包括(42)。', options: ['A、履约保证金', 'B、投标文件', 'C、实施方案', 'D、招标文件'], answer: 'A', explanation: '知识点：信息系统建设。投标文件、招标文件、实施方案等可作为合同组成部分，履约保证金是担保形式而非合同组成材料。' },
            { id: 26062, chapter: 26, group: 'exam', text: '(34)是从用户使用系统的角度描述系统功能的图形表达方法。', options: ['A、对象图', 'B、用例图', 'C、类图', 'D、序列图'], answer: 'B', explanation: '知识点：UML的图形。用例图从用户使用系统的角度描述系统功能。' },
            { id: 26063, chapter: 26, group: 'exam', text: '监理人员在需求变更过程中，不正确的做法是：（ ）。', options: ['A、要求变更申请获批后尽快执行，不必修改项目整体计划', 'B、要求必须用变更申请单提出变更', 'C、审批变更申请前，监理工程师必须与总监理工程师商议', 'D、要求变更必须获得项目各方责任人的书面批准'], answer: 'A', explanation: '知识点：变更控制。变更获批执行后应及时修改项目整体计划，“不必修改”不正确。' },
            { id: 26064, chapter: 26, group: 'exam', text: '( )仅适用于项目工作量不大且能精确计算、工期较短、风险不大的项目。', options: ['A、总价合同', 'B、单价合同', 'C、成本加酬金合同', 'D、可调价格合同'], answer: 'A', explanation: '知识点：以项目的价款为标准划分。总价合同适用于工作量不大且能精确计算、工期短、风险小的项目。' },
            { id: 26065, chapter: 26, group: 'exam', text: '在订购80箱五类双绞线合同的执行过程中，供货方在合同约定的时间交付了60箱五类双绞线并就剩余20箱五类双绞线向采购方发出了继续发货通知，但在合同约定期限内采购方对此发货通知未给予任何答复，则针对这20箱五类双绞线，(61)。', options: ['A、供货方发运后，采购方应接收并及时支付合同约定的货款', 'B、供货方不应再继续发运', 'C、供货方发运后，采购方有权拒收', 'D、供货方发运后，采购方应接收并及时支付扣除违约金后的货款'], answer: 'A', explanation: '知识点：合同违约。采购方在约定期限内对继续发货通知未答复，视为同意发货，供货方发运后采购方应接收并支付约定货款。' },
            { id: 26066, chapter: 26, group: 'exam', text: '按照GB/T 16260《软件工程产品质量》标准，软件质量不包括（ ）。', options: ['A、内部质量', 'B、使用质量', 'C、外部质量', 'D、服务质量'], answer: 'D', explanation: '知识点：质量特性、软件工程产品质量。GB/T 16260中软件质量包括内部质量、外部质量和使用质量。' },
            { id: 26067, chapter: 26, group: 'exam', text: '(12)不属于移动计算的特点。', options: ['A、网络条件多样性', 'B、网络持续连接性', 'C、便利性', 'D、移动性'], answer: 'B', explanation: '移动计算的特点包括移动性、网络条件多样性、频繁断接性等，网络持续连接性不属于其特点。' },
            { id: 26068, chapter: 26, group: 'exam', text: '信息系统工程建设过程是人的智力劳动过程，下列说法不正确的是（ ）。', options: ['A、监理单位要审查承建单位的过程质量控制体系，减少个人随意性', 'B、承建单位要建立有效的文档管理体系，减小人员流动带来的损失', 'C、监理单位要保证对承建单位项目组人事权的控制，否则无法控制质量', 'D、智力劳动受个人的影响很大，要控制质量，首先要控制人'], answer: 'C', explanation: '知识点：信息系统工程。监理单位无权也无法控制承建单位项目组的人事权，该说法不正确。' },
            { id: 26069, chapter: 26, group: 'exam', text: '局域网布线常用的双绞线中不包括(8)。', options: ['A、4类双绞线', 'B、3类双绞线', 'C、5类双绞线', 'D、1类双绞线'], answer: 'D', explanation: '知识点：局域网、双绞线。局域网布线常用3类、4类、5类等双绞线，1类双绞线不用于局域网布线。' },
            { id: 26070, chapter: 26, group: 'exam', text: '有关建设单位、承建单位、监理单位三方进度控制的描述，不正确的是:( )。', options: ['A、承建单位填写《项目进度计划报审表》，报送建设单位审核', 'B、监理工程师审查进度计划的关键路径，并进行分析', 'C、承建单位定期汇报《工程实施进度动态表》', 'D、进度计划有重要的修改意见时承建单位应重新申报'], answer: 'A', explanation: '知识点：进度控制。《项目进度计划报审表》应报送监理单位审查，而非直接报建设单位审核。' },
            { id: 26071, chapter: 26, group: 'exam', text: 'Most of the host operating system provides a way to automated configure the IP information needed by a host. Automated configuration methods such as (71) are required to solve the problem.', options: ['A、PPT', 'B、DHCP', 'C、IPSec', 'D、SOAP'], answer: 'B', explanation: '知识点：专业英语。自动配置主机IP信息的方法是DHCP(动态主机配置协议)。' },
            { id: 26072, chapter: 26, group: 'exam', text: 'Which factors must be most considered when developing acceptance criteria? (72)', options: ['A、User availability', 'B、Ability to benchmark system', 'C、Match with requirements', 'D、Schedule of system delivery'], answer: 'C', explanation: '知识点：专业英语。制定验收标准时最需考虑的因素是与需求相匹配(Match with requirements)。' },
            { id: 26073, chapter: 26, group: 'exam', text: 'Many useful tools techniques are used in developing schedule. (73) is a schedule network analysis technique that modifies the project schedule to account for limited resource.', options: ['A、Resource leveling', 'B、Critical chain method', 'C、Schedule compression', 'D、PERT'], answer: 'A', explanation: '知识点：专业英语。为考虑有限资源而调整项目进度的进度网络分析技术是资源平衡(Resource leveling)。' },
            { id: 26074, chapter: 26, group: 'exam', text: 'In all projects, needs must be tempered by schedule, cost and resource constraints. Project success depends primarily on (74).', options: ['A、Customer satisfactions', 'B、Customer compromises in defining its needs', 'C、The quality of the schedule and cost control analysis', 'D、Exceeding customer requirements through gold-plating'], answer: 'A', explanation: '知识点：专业英语。项目成功主要取决于客户满意度(Customer satisfaction)。' },
            { id: 26075, chapter: 26, group: 'exam', text: '(75) is one of the quality planning outputs.', options: ['A、Quality checklist', 'B、Product specification', 'C、Scope base line', 'D、Cost of quality'], answer: 'A', explanation: '知识点：专业英语。质量检查表(Quality checklist)是质量计划编制的输出之一。' }
        ];
        // ★★★ 2025年上半年 信息系统监理师 上午试卷 综合知识（75题）★★★
        const CHAPTER_27 = [
            { id: 27001, chapter: 27, group: 'exam', text: '以下关于监理专题会议的叙述中，不正确的是：（70）。', options: ['A、监理专题会议包括技术讨论会、紧急事件协调会等', 'B、监理专题会议的会议纪要由承建单位的项目经理记录、整理和签认后发给项目有关方面', 'C、专题会议是为解决专门问题而召开的会议，由总监理工程师或授权的监理工程师主持', 'D、监理单位通常依据现场进度情况，定期或不定期召开不同层级的现场协调会议，解决工作过程中的相互配合问题'], answer: 'B', explanation: '知识点：监理会议。专题会议纪要应由监理方记录、整理和签认，而非承建单位项目经理。' },
            { id: 27002, chapter: 27, group: 'exam', text: '对合同违约理解正确的是(63)。', options: ['A、不适当履行合同义务不属于违约', 'B、违约不必承担赔偿责任', 'C、违约责任方只能是合同当事人一方', 'D、违约责任方可以是合同当事人一方或双方'], answer: 'D', explanation: '知识点：合同违约。不适当履行属于违约，违约须承担赔偿责任，责任方可以是一方或双方。' },
            { id: 27003, chapter: 27, group: 'exam', text: '工程监理总结报告属于(67)。', options: ['A、监理回复类文件', 'B、监理实施类文档', 'C、总控类文档', 'D、监理内部文件'], answer: 'C', explanation: '知识点：信息管理概述。工程监理总结报告属于总控类文档。' },
            { id: 27004, chapter: 27, group: 'exam', text: '(2)是系统建模的替代方法，是可选的系统设计方法，经常用于系统开发项目中，特别是用户难以陈述或者可视化业务需求时。', options: ['A、结构化功能需求', 'B、建立原型', 'C、数据建模', 'D、设计用例'], answer: 'B', explanation: '知识点：快速原型法、系统建模。用户难以陈述需求时常用建立原型的方法。' },
            { id: 27005, chapter: 27, group: 'exam', text: '(24)是监理工程师的法律责任的表现行为。', options: ['A、违纪行为', 'B、违背职业道德的行为', 'C、违规行为', 'D、违约行为'], answer: 'D', explanation: '知识点：法律责任、监理工程师。监理工程师法律责任的表现行为主要是违法行为和违约行为。' },
            { id: 27006, chapter: 27, group: 'exam', text: '属于监理机构工作职责的是(36)。', options: ['A、裁定工程索赔方案', 'B、提出工程变更申请', 'C、确定工程分包单位', 'D、确定工程标底'], answer: 'B', explanation: '知识点：监理机构的组织形式。监理机构可以提出工程变更申请(建议)；裁定索赔、确定分包单位和标底均不属于其职责。' },
            { id: 27007, chapter: 27, group: 'exam', text: '信息系统项目管理中的质量管理构成的要素不包括(36)。', options: ['A、质量保证', 'B、质量计划编制', 'C、质量控制', 'D、质量评估'], answer: 'D', explanation: '知识点：质量管理。质量管理由质量计划编制、质量保证、质量控制构成，不包括质量评估。' },
            { id: 27008, chapter: 27, group: 'exam', text: '某智能化建筑的管路设计采用了明敷槽道方式。下列施工操作，不正确的是：（ ）。', options: ['A、电缆竖井中安装的槽道保护高度为1.5米', 'B、无孔托盘式槽道距离地面的高度为2.2米', 'C、在吊顶内敷设槽道时，槽道顶部距顶棚的距离为0.3米', 'D、为了防尘、防潮，槽道采取了通风措施加以保护'], answer: 'D', explanation: '知识点：建筑、智能化。防尘防潮应采取封闭等防护措施，采取通风措施反而会引入灰尘潮气，该做法不正确。' },
            { id: 27009, chapter: 27, group: 'exam', text: '监理单位在信息系统工程中“四控三管一协调”不包括(37)。', options: ['A、合同管理', 'B、投资控制', 'C、文档管理', 'D、计划与执行管理'], answer: 'D', explanation: '知识点：监理单位、监理的概念。四控为质量、进度、投资、变更控制，三管为合同、信息(文档)、安全管理，不包括计划与执行管理。' },
            { id: 27010, chapter: 27, group: 'exam', text: '项目实施期间，承建单位向监理工程师提出变更部分工程设计的建议。监理单位接受建议后，与承建单位协商并经其同意将此部分工作委托其他设计单位完成。变更设计方案经过监理工程师审核后用于实施，但实施中发现修改的设计方案存在重大缺陷。就变更程序而言，应由(62)承担责任。', options: ['A、监理单位', 'B、其他设计单位', 'C、建设单位', 'D、承建单位'], answer: 'D', explanation: '知识点：承建单位、监理单位、审核。变更由承建单位提出并同意委托第三方完成，承建单位作为合同责任方应承担责任。' },
            { id: 27011, chapter: 27, group: 'exam', text: '在信息系统工程实施阶段，监理进度控制的工作内容不包括(53)。', options: ['A、完善工程项目控制计划', 'B、审核承建单位的实施进度计划', 'C、协助建设单位编制项目的工作计划', 'D、审核承建单位的进度报告'], answer: 'A', explanation: '知识点：实施阶段、进度控制。完善工程项目控制计划属于前期/计划阶段工作，不属于实施阶段监理进度控制内容。' },
            { id: 27012, chapter: 27, group: 'exam', text: '多媒体网络服务中的()服务可应用于手机的视频通话。', options: ['A、信息点播', 'B、信息广播', 'C、VOIP', 'D、视频会议'], answer: 'D', explanation: '知识点：网络的分类、视频。手机视频通话属于视频会议类服务。' },
            { id: 27013, chapter: 27, group: 'exam', text: '信息系统安全体系应当由(64)共同构成。', options: ['A、人员体系、组织机构体系和管理体系', 'B、技术体系、人员体系和组织机构体系', 'C、技术体系、组织机构体系和管理体系', 'D、技术体系、人员体系和管理体系'], answer: 'C', explanation: '知识点：安全体系。信息系统安全体系由技术体系、组织机构体系和管理体系共同构成。' },
            { id: 27014, chapter: 27, group: 'exam', text: '以下关于监理专题会议的叙述中，不正确的是：（70）。', options: ['A、监理专题会议的会议纪要由承建单位的项目经理记录、整理和签认后发给项目有关方面', 'B、监理专题会议包括技术讨论会、紧急事件协调会等', 'C、专题会议是为解决专门问题而召开的会议，由总监理工程师或授权的监理工程师主持', 'D、监理单位通常依据现场进度情况，定期或不定期召开不同层级的现场协调会议，解决工作过程中的相互配合问题'], answer: 'A', explanation: '知识点：监理会议。专题会议纪要应由监理方记录、整理和签认，而非承建单位项目经理。' },
            { id: 27015, chapter: 27, group: 'exam', text: '在应用软件建设项目的质量管理过程中，（ ）是进行项目质量管理的主要依据。', options: ['A、设计说明书', 'B、业务需求', 'C、项目合同', 'D、用户需求'], answer: 'C', explanation: '知识点：合同管理、项目质量管理。项目合同是进行项目质量管理的主要依据。' },
            { id: 27016, chapter: 27, group: 'exam', text: '工程项目实施阶段出现(57)情况时，总监理工程师有权下达停工令。①擅自变更设计及开发方案而自行实施、开发②未经技术资质审查的人员进入现场实施、开发③隐蔽作业未经现场监理人员查验自行封闭、掩盖④将W点确定为软件开发关键工序，约定时间监理工程师未到现场检查而进行该W点的实施', options: ['A、②④', 'B、①③④', 'C、①②③', 'D、①②③④'], answer: 'C', explanation: '知识点：实施阶段、总监理工程师。①②③均可下达停工令；W点为见证点，监理未到时承建单位可越过该点继续实施，不属于停工情形。' },
            { id: 27017, chapter: 27, group: 'exam', text: '若一个网络系统中有150个信息点，按照EIA/TIA568标准进行结构化布线，则布线工程需要准备RJ45头的总量是(20)个。', options: ['A、690', 'B、780', 'C、600', 'D、618'], answer: 'A', explanation: '知识点：综合布线系统。每个信息点需4个RJ45头，另加15%备损：150×4×1.15=690个。' },
            { id: 27018, chapter: 27, group: 'exam', text: '以下不属于沟通协调一般原则的是(69)。', options: ['A、公平、公正、独立原则', 'B、守法原则', 'C、诚信原则', 'D、对等原则'], answer: 'D', explanation: '知识点：组织协调。沟通协调一般原则包括公平公正独立、守法、诚信、及时等，不包括对等原则。' },
            { id: 27019, chapter: 27, group: 'exam', text: '在信息系统建设项目监理的整个过程中，监理工程师必须对有关知识产权的内容进行检查、监督、保护。监理工程师的如下做法，不正确的是：（ ）。', options: ['A、重点保护承建单位的知识产权权益', 'B、监督相关单位及时进行软件著作权登记', 'C、注意保护外购软件的知识产权', 'D、注意保护待开发软件的知识产权'], answer: 'A', explanation: '知识点：知识产权保护的监理。监理应平等保护建设单位和承建单位的知识产权权益，“重点保护承建单位”不正确。' },
            { id: 27020, chapter: 27, group: 'exam', text: '以下不属于沟通协调一般原则的是(69)。', options: ['A、公平、公正、独立原则', 'B、对等原则', 'C、守法原则', 'D、诚信原则'], answer: 'B', explanation: '知识点：组织协调。沟通协调一般原则包括公平公正独立、守法、诚信、及时等，不包括对等原则。' },
            { id: 27021, chapter: 27, group: 'exam', text: '某集成项目因关键设备供应不及时，延误了项目进度，监理单位应()开展组织协调工作。', options: ['A、召开监理例会', 'B、编写监理工作联系单', 'C、出具监理报告', 'D、召开监理专题会议'], answer: 'D', explanation: '知识点：监理单位、监理会议。针对关键设备供应延误这一专门问题，应召开监理专题会议进行协调。' },
            { id: 27022, chapter: 27, group: 'exam', text: 'TCP/IP体系结构中的TCP和IP所提供的服务分别为(5)。', options: ['A、传输层服务和网络层服务', 'B、链路层服务和网络层服务', 'C、网络层服务和传输层服务', 'D、传输层服务和应用层服务'], answer: 'A', explanation: '知识点：TCP/IP体系结构。TCP提供传输层服务，IP提供网络层服务。' },
            { id: 27023, chapter: 27, group: 'exam', text: '下列选项中不适用于判断和评价程序复杂度的是(27)。', options: ['A、系统用户数', 'B、程序有无注释', 'C、执行路径数', 'D、算法的难易程度'], answer: 'A', explanation: '知识点：软件与软件工程知识。系统用户数与程序本身的复杂度无关。' },
            { id: 27024, chapter: 27, group: 'exam', text: '与客户机/服务器(Client/Server)架构相比，浏览器/服务器(Browser/Server)架构的最大优点是(29)。', options: ['A、将应用一分为二，允许网络分布操作', 'B、适用于分布式系统，支持多层应用架构', 'C、部署和维护方便、易于扩展', 'D、具有强大的数据操作和事务处理能力，模型思想简单，易于人们理解和接受'], answer: 'C', explanation: '知识点：浏览器。B/S架构的最大优点是客户端零维护，部署和维护方便、易于扩展。' },
            { id: 27025, chapter: 27, group: 'exam', text: '信息系统工程监理的工作顺序正确的是：()。①选择监理单位②三方会议③签订监理合同④组建监理项目组⑤编制监理计划⑥实施监理业务⑦提交最终监理文档⑧参与工程验收', options: ['A、①③②④⑤⑥⑧⑦', 'B、①③②④⑤⑥⑦⑧', 'C、①②③④⑤⑥⑦⑧', 'D、①②③④⑤⑦⑥⑧'], answer: 'A', explanation: '知识点：监理单位。正确顺序：选择监理单位→签订监理合同→三方会议→组建项目组→编制监理计划→实施监理→参与工程验收→提交最终监理文档。' },
            { id: 27026, chapter: 27, group: 'exam', text: '大型局域网通常划分为核心层、汇聚层和接入层。以下关于各个网络层次的描述中，不正确的是(12)。', options: ['A、接入层可以使用集线器代替交换机', 'B、核心层承担访问控制列表检查', 'C、接入层提供局域网络接入功能', 'D、汇聚层定义了网络的访问策略'], answer: 'B', explanation: '知识点：局域网。访问控制列表检查通常在汇聚层实施，核心层负责高速数据交换，不承担ACL检查。' },
            { id: 27027, chapter: 27, group: 'exam', text: '某磁盘阵列共有14块硬盘，采用RAID5技术时的磁盘利用率是(21)。', options: ['A、70%', 'B、50%', 'C、93%', 'D、100%'], answer: 'C', explanation: '知识点：RAID。RAID5利用率为(n-1)/n=13/14≈93%。' },
            { id: 27028, chapter: 27, group: 'exam', text: '在软件开发的生命周期方法中，对模块的功能进行描述是(3)阶段的任务。', options: ['A、概要设计', 'B、编码设计', 'C、详细设计', 'D、需求分析'], answer: 'A', explanation: '知识点：概要设计。概要设计阶段完成模块划分并描述各模块的功能。' },
            { id: 27029, chapter: 27, group: 'exam', text: '项目对任务进行分解时，各工作单元之间的依赖关系包括强制依赖关系、弹性依赖关系和（ ）。', options: ['A、外部依赖关系', 'B、中心依赖关系', 'C、虚拟依赖关系', 'D、内部依赖关系'], answer: 'A', explanation: '知识点：进度管理。工作单元间的依赖关系包括强制依赖、弹性依赖和外部依赖关系。' },
            { id: 27030, chapter: 27, group: 'exam', text: '根据折射率的分布情况，光纤可分为(23)。', options: ['A、单模光纤和多模光纤', 'B、短波长光纤和长波长光纤', 'C、保偏光纤和晶体光纤', 'D、跳变式光纤和渐变式光纤'], answer: 'D', explanation: '知识点：光纤。按折射率分布，光纤分为跳变式(阶跃)光纤和渐变式光纤。' },
            { id: 27031, chapter: 27, group: 'exam', text: '在交换机测试过程中，需要建立VLAN进行测试的是(14)。①VLAN配置测试②访问控制列表测试③冗余切换测试', options: ['A、①③', 'B、①②③', 'C、②③', 'D、①②'], answer: 'B', explanation: '知识点：交换机测试。VLAN配置测试、ACL测试和冗余切换测试均需建立VLAN后进行。' },
            { id: 27032, chapter: 27, group: 'exam', text: '监理单位的组织协调工作涉及与建设单位、承建单位等多方关系，它贯穿于信息系统工程建设的全过程。()不属于监理工程师在组织协调过程应坚持的原则。', options: ['A、诚信、守法', 'B、及时', 'C、公平、公正、独立', 'D、科学'], answer: 'D', explanation: '知识点：组织协调。组织协调原则包括公平公正独立、守法诚信、及时等，不包括科学原则。' },
            { id: 27033, chapter: 27, group: 'exam', text: '设计变更、洽商记录必须经(60)书面签认后，承建单位方可执行。', options: ['A、监理单位', 'B、分包单位', 'C、上级单位', 'D、建设单位'], answer: 'D', explanation: '知识点：承建单位。设计变更、洽商记录必须经建设单位书面签认后，承建单位方可执行。' },
            { id: 27034, chapter: 27, group: 'exam', text: '（ ）不属于监理活动。', options: ['A、信息系统工程进度控制', 'B、信息系统工程质量控制', 'C、信息系统工程变更控制', 'D、信息系统工程风险控制'], answer: 'D', explanation: '知识点：监理活动。监理活动包括质量、进度、投资、变更控制及合同、信息管理等，风险控制不属于监理活动。' },
            { id: 27035, chapter: 27, group: 'exam', text: '一般情况下，工程变更建议书应在预计可能变更的时间(59)天之前提出。', options: ['A、15', 'B、14', 'C、7', 'D、10'], answer: 'B', explanation: '知识点：变更控制。工程变更建议书应在预计可能变更的时间之前14天提出。' },
            { id: 27036, chapter: 27, group: 'exam', text: '（ ）不是在软件开发过程中产生的文档。', options: ['A、试运行总结报告', 'B、软件测试计划', 'C、用户手册', 'D、软件需求说明书'], answer: 'A', explanation: '知识点：文档的编制。试运行总结报告是项目试运行阶段产生的文档，不属于软件开发过程文档。' },
            { id: 27037, chapter: 27, group: 'exam', text: '关于软件项目需求分析的描述，不正确的是（ ）。', options: ['A、需求分析阶段成果包括确认测试计划、集成测试计划等', 'B、需求分析的目标是深入描述软件的功能和性能', 'C、需求分析阶段研究的对象是软件项目的用户要求', 'D、只有确切描述的软件需求才能成为软件设计的基础'], answer: 'A', explanation: '知识点：需求分析。集成测试计划属于设计/测试阶段成果，不属于需求分析阶段成果。' },
            { id: 27038, chapter: 27, group: 'exam', text: '隐蔽工程中，关于电气配线工程质量监控要点有如下表述，其中不准确的是(21)。', options: ['A、导线连接应采用绝缘压接帽新工艺，铜线接头处要搪锡处理，导线接头处只用黑色胶带缠绕数圈，做好粘接', 'B、注意电线绝缘层的颜色控制：A相为黄色、B相为绿色、C相为红色、PE为双色，且同一建筑物内的线色应该一致', 'C、导线在管内不应有接头或扭结，接头应设在过线盒内', 'D、施工中须高度重视插座、螺口灯头、零线与相线接线，注意采用左零右火和上零下火上接地的作法'], answer: 'A', explanation: '知识点：综合布线工程、监控。导线接头只缠绕黑色胶带不符合工艺要求，应采用绝缘处理规范做法，A项表述不准确。' },
            { id: 27039, chapter: 27, group: 'exam', text: '对象实现了数据和操作的结合，使数据和操作(35)于对象的统一体中。', options: ['A、模块性', 'B、继承性', 'C、多态性', 'D、封装性'], answer: 'D', explanation: '知识点：面向对象技术。数据和操作封装于对象的统一体中，体现封装性。' },
            { id: 27040, chapter: 27, group: 'exam', text: '监理工程师发现机房工程承建单位自行()时，应下达停工令。', options: ['A、更改设计和替换材料', 'B、调整施工进度计划', 'C、调换施工设备', 'D、改变装修工艺'], answer: 'A', explanation: '知识点：机房工程、总监理工程师。承建单位擅自更改设计和替换材料时，应下达停工令。' },
            { id: 27041, chapter: 27, group: 'exam', text: '(28)不是云计算的服务类型。', options: ['A、IaaS', 'B、NaaS', 'C、SaaS', 'D、PaaS'], answer: 'B', explanation: '知识点：云计算。云计算服务类型为IaaS、PaaS、SaaS，NaaS不属于其标准服务类型。' },
            { id: 27042, chapter: 27, group: 'exam', text: '()磁盘阵列存储有校验数据，可提供数据容错能力。', options: ['A、RAID5', 'B、RAID1', 'C、RAID0', 'D、RAID2'], answer: 'A', explanation: '知识点：磁盘阵列。RAID5通过分布式奇偶校验提供数据容错能力。' },
            { id: 27043, chapter: 27, group: 'exam', text: '访问限制是重要的网络安全防范措施。（ ）不属于访问限制的方法。', options: ['A、入侵检测', 'B、密码', 'C、用户口令', 'D、访问权限设置'], answer: 'A', explanation: '知识点：入侵检测、网络安全。密码、口令、访问权限设置属于访问限制方法，入侵检测属于安全监测手段。' },
            { id: 27044, chapter: 27, group: 'exam', text: '在现场监理工作中，监理不具有的权力是(39)。', options: ['A、施工组织计划确定权', 'B、承建单位工作量鉴定权', 'C、支付申请确认权', 'D、分包单位否决权'], answer: 'A', explanation: '知识点：监理的概念。施工组织计划由承建单位编制确定，监理只有审查权而无确定权。' },
            { id: 27045, chapter: 27, group: 'exam', text: '根据《国家电子政务工程项目档案管理暂行办法》，文档《测试方案、方案评审意见、测试记录、测试报告》的保管期限为(68)。', options: ['A、10年', 'B、20年', 'C、永久', 'D、30年'], answer: 'C', explanation: '知识点：电子政务档案。测试方案、评审意见、测试记录、测试报告的保管期限为永久。' },
            { id: 27046, chapter: 27, group: 'exam', text: '所有已评审通过的文件，如果在实际开发过程中承建单位需要变更某项内容，需经监理对其提出的变更内容和变更方案进行评审，并提出监理意见，经（ ）确认后方可实施。', options: ['A、上述三方', 'B、建设单位', 'C、承建单位', 'D、监理单位'], answer: 'B', explanation: '知识点：变更控制的步骤。变更内容和方案经监理评审提出意见后，须经建设单位确认后方可实施。' },
            { id: 27047, chapter: 27, group: 'exam', text: '(10)被定义为防火墙外部接口与Internet路由器的内部接口之间的网段，起到把敏感的内部网络与其他网络隔离开来，同时又为相关用户提供服务的目的。', options: ['A、核心交换区', 'B、非军事化区', 'C、域名访问区', 'D、数据存储区'], answer: 'B', explanation: '知识点：防火墙、路由器。该网段即DMZ(非军事化区)。' },
            { id: 27048, chapter: 27, group: 'exam', text: '监理工程师在为期一年的信息网络系统建设项目中，发现计划工期为4个月的综合布线系统2个月就完成了。此时，监理工程师应首先进行的工作是：（ ）。', options: ['A、采取进度调整措施，让后续工作跟上新的进度变化', 'B、表扬项目经理', 'C、分析偏差原因及对后续工作和工期的影响', 'D、调整项目进度计划'], answer: 'C', explanation: '知识点：进度偏差分析。发现进度偏差后，应首先分析偏差产生的原因及其对后续工作和工期的影响。' },
            { id: 27049, chapter: 27, group: 'exam', text: '在各种系统开发方法中，系统可重用性、扩充性、维护性较好的开发方法是()。', options: ['A、增长法', 'B、原型法', 'C、面向对象的方法', 'D、生命周期法'], answer: 'C', explanation: '知识点：面向对象方法。面向对象方法的可重用性、扩充性、维护性较好。' },
            { id: 27050, chapter: 27, group: 'exam', text: '某公司每个工作区须要安装2个信息插座，并且要求该公司局域网不仅能够支持语音/数据的应用，而且应支持图像、影像、影视、视频会议等。该公司需选择(14)。', options: ['A、综合型综合布线系统', 'B、电视电话布线系统', 'C、增强型综合布线系统', 'D、基本型综合布线系统'], answer: 'A', explanation: '知识点：综合布线系统。每个工作区2个以上信息插座且支持多媒体业务的应选用综合型综合布线系统。' },
            { id: 27051, chapter: 27, group: 'exam', text: '监理企业的质量方针应由企业(60)颁布。', options: ['A、技术主管', 'B、管理者代表', 'C、最高领导者', 'D、质量主管'], answer: 'C', explanation: '知识点：质量管理体系文件。质量方针应由企业最高领导者颁布。' },
            { id: 27052, chapter: 27, group: 'exam', text: '信息系统工程成本预算工具不包括()。', options: ['A、参数模型预算法', 'B、类比预算法', 'C、电子数据表格', 'D、自上而下估计法'], answer: 'D', explanation: '知识点：成本预算。成本预算工具包括参数模型预算法、类比预算法、电子数据表格等；自上而下估计法属于成本估算方法。' },
            { id: 27053, chapter: 27, group: 'exam', text: '(46)不是总监理工程师代表可以行使的职责。', options: ['A、参与工程质量事故的调查', 'B、调换不称职的监理人员', 'C、负责项目日常监理工作', 'D、主持编写并签发监理周报'], answer: 'B', explanation: '知识点：总监理工程师代表。调换不称职的监理人员是总监理工程师的职责，总代不得行使。' },
            { id: 27054, chapter: 27, group: 'exam', text: '某网络计划，工作A后有三项紧后工作，这三项工作最早开始时间分别是第24天、第26天、第29天，最迟开始时间分别为第27天、第28天和第29天，工作A的最早开始时间为第16天，其持续时间为4天，则工作A的自由时差是（ ）天。', options: ['A、7', 'B、9', 'C、4', 'D、6'], answer: 'C', explanation: '知识点：关键路径、时差。自由时差=紧后工作最早开始时间的最小值-本工作最早完成时间=24-(16+4)=4天。' },
            { id: 27055, chapter: 27, group: 'exam', text: '一个软件系统应具有什么样的功能，这是在(29)阶段决定的。', options: ['A、需求分析', 'B、总体设计', 'C、详细设计', 'D、程序设计'], answer: 'A', explanation: '知识点：需求分析。软件系统应具有的功能在需求分析阶段决定。' },
            { id: 27056, chapter: 27, group: 'exam', text: '在现金流入量基本确定的情况下，能够较好体现资金机会成本的分析指标是(56)。', options: ['A、净现值', 'B、内含报酬率', 'C、现值指数', 'D、敏感性'], answer: 'B', explanation: '知识点：内含报酬率。内含报酬率能够较好体现资金的机会成本。' },
            { id: 27057, chapter: 27, group: 'exam', text: '虚拟化资源是指一些可以实现一定操作具有一定功能，但其本身是(11)的资源，如计算池、存储池等，通过软件技术可实现相关的虚拟化功能包括虚拟环境、虚拟系统、虚拟平台。', options: ['A、虚拟', 'B、物理', 'C、实体', 'D、真实'], answer: 'B', explanation: '知识点：虚拟存储器。虚拟化资源本身是物理资源，通过软件技术实现虚拟化功能。' },
            { id: 27058, chapter: 27, group: 'exam', text: '信息系统网络环境平台分为机房建设和综合布线系统，机房建设所涉及的系统不包括（ ）。', options: ['A、防雷接地系统', 'B、电气系统', 'C、环境监控系统', 'D、楼宇自动化系统'], answer: 'D', explanation: '知识点：机房工程。机房建设包括防雷接地、电气、环境监控等系统，楼宇自动化系统不属于机房建设。' },
            { id: 27059, chapter: 27, group: 'exam', text: '(57)不是信息系统工程竣工结算的审核内容。', options: ['A、审核项目成本计划的编制是否合理', 'B、审核项目成本计划的执行情况', 'C、审核项目竣工说明书是否全面系统', 'D、审核项目的各项费用支出是否合理'], answer: 'A', explanation: '知识点：审核。竣工结算审核针对成本计划执行情况、竣工说明书和费用支出等，不审核成本计划编制的合理性。' },
            { id: 27060, chapter: 27, group: 'exam', text: '设置质量控制点时应遵守的一般原则不包括：()。', options: ['A、突出重点', 'B、易于控制', 'C、易于纠偏', 'D、保持稳定性'], answer: 'D', explanation: '知识点：质量控制点设置的原则。设置质量控制点的原则包括突出重点、易于控制、易于纠偏等，不包括保持稳定性。' },
            { id: 27061, chapter: 27, group: 'exam', text: '使计算机系统各个部件、相关的软件和数据协调、高效工作的是（ ）。', options: ['A、应用软件', 'B、中间件', 'C、管理软件', 'D、系统软件'], answer: 'D', explanation: '知识点：软件与软件工程知识。系统软件使计算机各部件、软件和数据协调高效工作。' },
            { id: 27062, chapter: 27, group: 'exam', text: '建设单位选定监理单位后，应当与其签订监理合同，监理合同内容主要包括()。①监理业务内容②建设单位的权利和义务③承建单位的违约责任④监理费用的计取和支付方式⑤监理单位的违约责任⑥承建单位的义务', options: ['A、②③④⑥', 'B、①②③④', 'C、①②④⑤', 'D、①③④⑥'], answer: 'C', explanation: '知识点：监理合同。监理合同内容包括监理业务内容、建设单位权利义务、监理费用计取和支付方式、监理单位违约责任等，不涉及承建单位。' },
            { id: 27063, chapter: 27, group: 'exam', text: '总监理工程师参与编制监理大纲有利于(46)。', options: ['A、监理实施细则的编制', 'B、被业主认可', 'C、监理规划的编制', 'D、承揽到监理业务'], answer: 'D', explanation: '知识点：监理大纲、总监理工程师。总监参与编制监理大纲有利于承揽到监理业务。' },
            { id: 27064, chapter: 27, group: 'exam', text: '（ ）需要运行程序，并能在运行过程中跟踪程序的执行路径。', options: ['A、黑盒测试', 'B、代码审查', 'C、静态分析', 'D、白盒测试'], answer: 'D', explanation: '知识点：白盒法。白盒测试需要运行程序并跟踪程序的执行路径。' },
            { id: 27065, chapter: 27, group: 'exam', text: '监理规划中监理的范围、内容与目标可以不包括：（ ）。', options: ['A、描述整个信息系统工程项目大体情况', 'B、说明监理工作具体做什么', 'C、表明监理项目部的工作在工程的什么范围之内进行', 'D、列出监理工作在本项目中要达到的效果'], answer: 'A', explanation: '知识点：监理规划。描述项目大体情况属于工程项目概况部分，不属于监理范围、内容与目标的范畴。' },
            { id: 27066, chapter: 27, group: 'exam', text: '综合布线工程实施过程中发生了严重的质量事故，此时总监理工程师首先应进行的工作是签发《工程暂停令》，并要求施工单位采取(49)的措施。', options: ['A、抓紧整改，早日复工', 'B、对事故责任人加强监督', 'C、防止事故信息不正常披露', 'D、防止事故扩大并保护好现场'], answer: 'D', explanation: '知识点：质量问题的处理。发生严重质量事故后应首先防止事故扩大并保护好现场。' },
            { id: 27067, chapter: 27, group: 'exam', text: '信息系统工程是指信息化工程建设中的信息网络系统、信息资源系统、()的新建、升级、改造工程。', options: ['A、信息通信系统', 'B、信息存储系统', 'C、信息应用系统', 'D、信息管理系统'], answer: 'C', explanation: '知识点：信息系统概述。信息系统工程包括信息网络系统、信息资源系统和信息应用系统。' },
            { id: 27068, chapter: 27, group: 'exam', text: '系统总线通常采用(5)的方式传送数据。', options: ['A、串行', 'B、分时', 'C、并行', 'D、分频'], answer: 'C', explanation: '知识点：系统总线。系统总线通常采用并行方式传送数据。' },
            { id: 27069, chapter: 27, group: 'exam', text: '在质量控制中的统计分析中，如果直方图分布比较集中，且位于公差范围之内，平均值在中间，分布范围两端距公差上、下限较远，这种情况说明（ ）。', options: ['A、过程是正常的和稳定的', 'B、过程基本上是稳定的和正常的', 'C、过程基本正常，但不稳定', 'D、过程是正常的和稳定的，但不经济'], answer: 'D', explanation: '知识点：直方图。分布过于集中、距公差上下限较远说明过程正常稳定但精度过高，不经济。' },
            { id: 27070, chapter: 27, group: 'exam', text: '关于监理单位权利和义务的描述，不正确的是()。', options: ['A、项目工期延误，监理单位应承担相应的经济责任', 'B、监理单位不得承包信息系统工程', 'C、监理单位不得以任何形式侵害承建单位的知识产权', 'D、监理单位应按照监理合同取得监理收入'], answer: 'A', explanation: '知识点：监理单位权利和义务。工期延误的直接责任由承建单位承担，监理单位仅对监理过失承担责任，“项目工期延误监理单位应承担相应经济责任”表述不正确。' },
            { id: 27071, chapter: 27, group: 'exam', text: '( ) describes how the information about the items of the project will be recorded and updated so that the product, service, or result of the project remains consistent and operative.', options: ['A、Risk management plan', 'B、Configuration management plan', 'C、Schedule management plan', 'D、Change management plan'], answer: 'B', explanation: '知识点：专业英语。描述项目产品信息如何记录和更新以保持一致性和有效性的文件是配置管理计划。' },
            { id: 27072, chapter: 27, group: 'exam', text: 'Plan Quality Management is the process of identifying() and standards for the project and its deliverables.', options: ['A、quality requirements', 'B、contract requirements', 'C、collection requirements', 'D、resource requirements'], answer: 'A', explanation: '知识点：专业英语。规划质量管理是识别项目及其可交付成果的质量要求和质量标准的过程。' },
            { id: 27073, chapter: 27, group: 'exam', text: 'A formally chartered group responsible for reviewing, evaluating, approving, delaying or rejecting changes to the project, and for recording and communicating such decisions. It is the ().', options: ['A、Change Control System', 'B、Change Control Board', 'C、Change Control Tool', 'D、Change Management Plan'], answer: 'B', explanation: '知识点：专业英语。正式批准成立、负责审查评估批准或否决项目变更的团体是变更控制委员会(CCB)。' },
            { id: 27074, chapter: 27, group: 'exam', text: 'The project charter provides the preapproved financial resources from which the detailed project costs are developed. It is the input of()。', options: ['A、Control Costs', 'B、Determine Budget', 'C、Plan Cost Management', 'D、Estimate Costs'], answer: 'B', explanation: '知识点：专业英语。项目章程提供预批准的财务资源，是制定预算(Determine Budget)过程的输入。' },
            { id: 27075, chapter: 27, group: 'exam', text: '() is a financial analysis tool that used to determine the benefits provided by a project against its costs.', options: ['A、Cost Performance Index', 'B、Cost Management Plan', 'C、Cost of Quality', 'D、Cost Benefit Analysis'], answer: 'D', explanation: '知识点：专业英语。比较项目收益与成本的分析工具是成本效益分析(Cost Benefit Analysis)。' }
        ];
        // ★★★ 2026年上半年 信息系统监理师 上午试卷 综合知识（75题）★★★
        const CHAPTER_28 = [
            { id: 28001, chapter: 28, group: 'exam', text: '监理工程师应监督建设单位采用的防范火灾安全管理设施不包括（ ）。', options: ['A、烟雾探测器', 'B、抗静电喷雾器', 'C、手提式灭火器', 'D、火灾警报器'], answer: 'B', explanation: '知识点：建设单位、安全管理。抗静电喷雾器不属于防范火灾的安全管理设施。' },
            { id: 28002, chapter: 28, group: 'exam', text: '依据《国家电子政务工程建设项目档案管理暂行办法》，监理周（月）报归档后保管期限是（67）。', options: ['A、30年', 'B、20年', 'C、永久', 'D、10年'], answer: 'D', explanation: '知识点：电子政务档案。监理周(月)报的保管期限为10年。' },
            { id: 28003, chapter: 28, group: 'exam', text: '监理单位不得与被监理项目的()存在隶属关系和利益关系，不得作为其投资者或合伙经营者。', options: ['A、查询单位', 'B、承建单位', 'C、建设单位', 'D、投资单位'], answer: 'B', explanation: '知识点：监理单位。监理单位不得与被监理项目的承建单位存在隶属关系和利益关系，体现监理独立性。' },
            { id: 28004, chapter: 28, group: 'exam', text: '下列工具或方法中，()不能用于风险识别。', options: ['A、流程图', 'B、甘特图', 'C、鱼刺图', 'D、访谈'], answer: 'B', explanation: '知识点：甘特图、风险识别。甘特图是进度计划工具，不能用于风险识别。' },
            { id: 28005, chapter: 28, group: 'exam', text: '下列情况中，工程变更申请不合理的是(58)。', options: ['A、监理方在监理过程中发现前期设计缺陷，提出设计变更申请', 'B、承建方在实施过程中因不可抗力，提出进度变更申请', 'C、建设方在实施过程中发生机构改革，提出需求变更申请', 'D、建设方在建设过程中发现合同约定的采购产品降价，提出成本变更申请'], answer: 'D', explanation: '知识点：变更控制的内容。市场采购产品降价属于市场风险，不构成合理的工程变更申请。' },
            { id: 28006, chapter: 28, group: 'exam', text: '分时操作系统通常采用(12)策略为用户服务。', options: ['A、时间片加权分配', 'B、时间片轮转', 'C、短作业优先', 'D、可靠性和灵活性'], answer: 'B', explanation: '知识点：操作系统。分时操作系统通常采用时间片轮转策略为用户服务。' },
            { id: 28007, chapter: 28, group: 'exam', text: '对磁介质进行报废处理，（4）是应采用的最安全措施。', options: ['A、专用强磁工具清除', 'B、集中保管', 'C、直接丢弃', 'D、砸碎丢弃'], answer: 'A', explanation: '知识点：信息安全。磁介质报废最安全的措施是用专用强磁工具(消磁机)清除数据。' },
            { id: 28008, chapter: 28, group: 'exam', text: '（）属于监理实施细则的内容。', options: ['A、工程质量等级', 'B、项目预计总投资额', 'C、工程专业的特点', 'D、监理机构的组织形式'], answer: 'C', explanation: '知识点：监理实施细则。监理实施细则的内容包括专业工程的特点、监理流程、控制要点与方法措施等。' },
            { id: 28009, chapter: 28, group: 'exam', text: '（）属于监理回复（批复）类文件。', options: ['A、监理规划', 'B、备忘录', 'C、专题监理意见', 'D、监理日志'], answer: 'C', explanation: '知识点：信息管理概述。专题监理意见属于监理回复(批复)类文件。' },
            { id: 28010, chapter: 28, group: 'exam', text: '信息系统生命周期一般包括系统分析，系统设计，系统实施和（ ）等几个阶段。', options: ['A、系统测试', 'B、系统研发', 'C、系统维护', 'D、系统集成'], answer: 'C', explanation: '知识点：系统生命周期。信息系统生命周期包括系统分析、系统设计、系统实施和系统维护等阶段。' },
            { id: 28011, chapter: 28, group: 'exam', text: '双绞线的电气特性“NEXT”表示(20)。', options: ['A、衰减', 'B、远端串扰', 'C、衰减串扰比', 'D、近端串扰'], answer: 'D', explanation: '知识点：双绞线电气特性。NEXT(Near End Cross Talk)表示近端串扰。' },
            { id: 28012, chapter: 28, group: 'exam', text: '某银行信息支撑系统采取()的数据备份策略，每天定时备份上次备份后变化过的数据信息。', options: ['A、差分备份', 'B、增量备份', 'C、全备份', 'D、备份介质轮换'], answer: 'B', explanation: '知识点：数据备份。备份上次备份后变化过的数据属于增量备份。' },
            { id: 28013, chapter: 28, group: 'exam', text: '监理单位应对承建单位提供的各类设计、实施方案进行审查并采取监理措施，对此进行的质量控制重点不包括(47)。', options: ['A、关键部位的测试方案', 'B、质量保证计划', 'C、技术性能报告', 'D、总体设计方案'], answer: 'C', explanation: '知识点：设计阶段、质量控制。质量控制重点包括总体设计方案、质量保证计划、关键部位测试方案等，不包括技术性能报告。' },
            { id: 28014, chapter: 28, group: 'exam', text: '作为一个大型信息系统建设项目的项目经理，应当具备（）的能力。①知人善任②应急处置③推过揽功④善于运用所掌握的权力', options: ['A、②③④', 'B、①②③', 'C、①③④', 'D、①②④'], answer: 'D', explanation: '知识点：项目经理。“推过揽功”不是项目经理应具备的能力，①②④正确。' },
            { id: 28015, chapter: 28, group: 'exam', text: '第二代计算机网络由通信子网和资源子网组成，通信子网包括(9)。', options: ['A、数据链路层、网络层、应用层', 'B、物理层、数据链路层、传输层', 'C、数据链路层、会话层、网络层', 'D、物理层、数据链路层、网络层'], answer: 'D', explanation: '知识点：OSI参考模型。通信子网由物理层、数据链路层和网络层组成。' },
            { id: 28016, chapter: 28, group: 'exam', text: '仲裁委员会的仲裁裁决做出以后，当事人应当履行。当一方当事人不履行仲裁裁决时，另一方当事人可以依照民事诉讼法的有关规定向(62)申请执行。', options: ['A、调解委员会', 'B、人民法院', 'C、当地人民政府', 'D、仲裁委员会'], answer: 'B', explanation: '知识点：仲裁法。一方不履行仲裁裁决时，另一方可向人民法院申请执行。' },
            { id: 28017, chapter: 28, group: 'exam', text: '以下信息系统工程建设中的问题，属于质量控制方面的是(38)。①系统测试不过关，bug过多，测试范围覆盖不全面②项目实施业务需求调研不充分，不全面③项目资金使用不合理，超出预算④项目实施范围变更⑤项目实施过程中业务需求不确定', options: ['A、②④', 'B、①②⑤', 'C、①④', 'D、②⑤'], answer: 'B', explanation: '知识点：质量控制。①测试质量问题、②需求调研不充分、⑤业务需求不确定均属于质量控制方面的问题。' },
            { id: 28018, chapter: 28, group: 'exam', text: 'MPLS(Multi-protocol Label Switching，多协议标签交换技术)是新一代广域网传输技术。以下关于MPLS特点的叙述中，正确的是( )。', options: ['A、MPLS不支持大规模层次化的网络拓扑结构，不具备良好的网络扩展性', 'B、MPLS不支持ATM的传输交换方式', 'C、MPLS支持流量工程、QoS和大规模的虚拟专用网', 'D、MPLS的标签合并机制支持不同数据流的分拆传输'], answer: 'C', explanation: '知识点：广域网、MPLS。MPLS支持流量工程、QoS和大规模的虚拟专用网(VPN)。' },
            { id: 28019, chapter: 28, group: 'exam', text: '变更控制的工作程序正确的顺序是(58)。①监控变更实施②接受变更申请③变更情况分析④确定变更方法⑤评估变更效果⑥进行变更初审', options: ['A、②③⑥④①⑤', 'B、②⑥③④①⑤', 'C、③②⑥④①⑤', 'D、③⑥②④①⑤'], answer: 'B', explanation: '知识点：变更控制的步骤。正确顺序：接受变更申请→变更初审→变更情况分析→确定变更方法→监控变更实施→评估变更效果。' },
            { id: 28020, chapter: 28, group: 'exam', text: '以下关于变更的描述，不正确的是（ ）。', options: ['A、工程变更建议书主要包括：变更的原因及依据、变更的内容及范围、变更引起的合同总价和工期增加或减少等', 'B、变更申请单位向监理工程师提出变更要求，提交书面工程变更建议书', 'C、监理机构有权根据项目实际情况，驳回变更申请', 'D、工程变更建议书应在预计可能变更的时间之前一周提出'], answer: 'D', explanation: '知识点：变更控制概述。工程变更建议书应在预计可能变更的时间之前14天提出，“一周”不正确。' },
            { id: 28021, chapter: 28, group: 'exam', text: '监理工程师在实施阶段进度控制中所做的工作不包括：（ ）。', options: ['A、检查工程准备情况，如满足工程实施条件，签署开工通知', 'B、审查承建单位的进度控制报告，监督承建单位做好施工进度控制', 'C、研究制定预防工期索赔措施，做好处理工期索赔工作', 'D、审查承建单位的施工进度计划，确认满足项目控制进度计划的要求'], answer: 'C', explanation: '知识点：实施阶段、进度控制。研究制定预防工期索赔措施属于合同管理范畴，不属于实施阶段进度控制工作。' },
            { id: 28022, chapter: 28, group: 'exam', text: '以下关于监理大纲的叙述中，不正确的是（ ）。', options: ['A、编制监理大纲的目的是，要使建设单位信服，采用本监理单位制定的监理方案，能够圆满实现建设单位的投资目标和建设意图，进而赢得竞争投标的胜利', 'B、监理大纲的内容包括为什么，做什么以及怎么做', 'C、监理大纲是在建设单位选择合适的监理单位时，监理单位为了获得监理任务，在项目监理招标阶段编制的文件', 'D、监理大纲的作用，是为监理单位的经营目标服务的，起着承接监理任务的作用'], answer: 'B', explanation: '知识点：监理大纲。“为什么、做什么、怎么做”是监理规划的内容定位，不是监理大纲的内容，B项不正确。' },
            { id: 28023, chapter: 28, group: 'exam', text: '()是用来实现局域网与广域网之间互联的网络设备。', options: ['A、网桥或路由器', 'B、网桥或网关', 'C、中继器或网桥', 'D、路由器或网关'], answer: 'D', explanation: '知识点：路由器、网络设备。实现局域网与广域网互联的网络设备是路由器或网关。' },
            { id: 28024, chapter: 28, group: 'exam', text: '《信息技术服务运行维护第一部分通用要求》中，运维服务能力模型包括人员、资源、技术、过程4个关键要素。()属于资源要素。', options: ['A、知识库', 'B、技术研发', 'C、岗位结构', 'D、配置管理'], answer: 'A', explanation: '知识点：运维服务能力模型。资源要素包括知识库、备品备件库、服务工具等；技术研发属于技术要素，岗位结构属于人员要素，配置管理属于过程要素。' },
            { id: 28025, chapter: 28, group: 'exam', text: '编制监理实施细则的依据包括(46)。①监理投标文件②已批准的监理规划③与专业工程相关的标准、设计文件和技术资料④信息工程建设的相关法律、法规及项目审批文件⑤实施组织设计', options: ['A、②③⑤', 'B、②④⑤', 'C、②③④', 'D、①②③'], answer: 'A', explanation: '知识点：监理实施细则。编制依据包括已批准的监理规划、与专业工程相关的标准设计文件和技术资料、实施组织设计。' },
            { id: 28026, chapter: 28, group: 'exam', text: '实施系统灾难恢复时，( )系统的恢复时间最长，成本最低。', options: ['A、全自动恢复', 'B、半自动恢复', 'C、手动恢复', 'D、数据备份'], answer: 'C', explanation: '知识点：灾难恢复。手动恢复系统恢复时间最长，成本最低。' },
            { id: 28027, chapter: 28, group: 'exam', text: '关于信息系统工程监理工作的描述，不正确的是：()。', options: ['A、信息系统工程监理比建筑工程监理更频繁面对变更问题', 'B、信息系统工程可视性强，推荐采用现场监理的手段', 'C、信息系统工程监理必须覆盖系统设计，因此对监理人员有技术要求', 'D、信息系统工程监理业务的承担者不能是信息系统集成商'], answer: 'B', explanation: '知识点：监理基础。信息系统工程可视性差(而非强)，不适宜主要采用现场监理手段，B项不正确。' },
            { id: 28028, chapter: 28, group: 'exam', text: '数据流程图(DFD)是描述系统数据流程的工具。在数据流程图中用(27)表示处理过程。', options: ['A、带圆角的长方形', 'B、正方形', 'C、长方形', 'D、圆或椭圆'], answer: 'A', explanation: '知识点：数据流程图。DFD中处理过程用带圆角的长方形表示，外部实体用正方形，数据存储用开口矩形。' },
            { id: 28029, chapter: 28, group: 'exam', text: '信息系统工程成本估算的工具和方法不包括(56)。', options: ['A、参数建模', 'B、挣值分析', 'C、类比估计', 'D、累加估计'], answer: 'B', explanation: '知识点：成本估算。挣值分析是成本监控(控制)工具，不属于成本估算方法。' },
            { id: 28030, chapter: 28, group: 'exam', text: '软件生存周期一般划分为六个阶段，包括软件项目计划、需求分析、软件设计、程序编码、软件测试以及(3)。', options: ['A、计划验证', 'B、运行维护', 'C、风险分析和定义', 'D、软件验收'], answer: 'B', explanation: '知识点：软件生存周期。六个阶段为项目计划、需求分析、软件设计、程序编码、软件测试和运行维护。' },
            { id: 28031, chapter: 28, group: 'exam', text: '某信息化工程合同的当事人在合同中未选择协议管辖，实施合同发生纠纷后，承建单位应当向（ ）人民法院提出诉讼申请。', options: ['A、工程所在地', 'B、建设单位所在地', 'C、合同签订地', 'D、承建单位所在地'], answer: 'A', explanation: '知识点：合同争议。实施合同纠纷适用专属管辖，由工程所在地人民法院管辖。' },
            { id: 28032, chapter: 28, group: 'exam', text: '在软件生命周期中，需求分析是软件设计的基础。需求分析阶段研究的对象是软件项目的(21)。', options: ['A、设计约束', 'B、用户要求', 'C、规模', 'D、质量要素'], answer: 'B', explanation: '知识点：需求分析。需求分析阶段研究的对象是软件项目的用户要求。' },
            { id: 28033, chapter: 28, group: 'exam', text: '电子政务项目文件归档的含义是(58)。', options: ['A、建设、施工、监理、设计等单位将本单位在工程建设过程中形成的文件向本单位档案机构移交', 'B、设计、施工、监理等单位将本单位在工程建设过程中形成的工程文件向建设单位移交，建设单位汇总后向当地档案管理部门移交', 'C、文件形成单位完成其工作后，将形成的文件整理立卷后，按规定移交当地档案管理部门', 'D、设计、施工、监理等单位将本单位在工程建设过程中形成的文件向电子政务项目实施机构移交'], answer: 'D', explanation: '知识点：电子政务项目文件。归档是指各参建单位将形成的文件向电子政务项目实施机构(建设单位)移交。' },
            { id: 28034, chapter: 28, group: 'exam', text: '工程项目竣工决算由(57)负责汇总编制。', options: ['A、建设单位', 'B、设计单位', 'C、监理单位', 'D、总包单位'], answer: 'A', explanation: '知识点：建设单位。竣工决算由建设单位负责汇总编制。' },
            { id: 28035, chapter: 28, group: 'exam', text: '《中华人民共和国保守国家秘密法》第二章规定了国家秘密的范围和密级，国家秘密的密级分为：（ ）。', options: ['A、“普密”、“商密”两个级别', 'B、“绝密”、“机密”、“秘密”三个级别', 'C、“低级”和“高级”两个级别', 'D、“一密”、“二密”、“三密”、“四密”四个级别'], answer: 'B', explanation: '知识点：国家秘密。国家秘密的密级分为绝密、机密、秘密三个级别。' },
            { id: 28036, chapter: 28, group: 'exam', text: '在信息网络系统的建设中，核心交换机选型时的主要技术指标需包括（ ）。①可扩展性②易于安装③网络可靠性④端口的不可扩容性⑤中继带宽的可扩容性', options: ['A、①③⑤', 'B、①②③', 'C、②④⑤', 'D、③④⑤'], answer: 'A', explanation: '知识点：交换机主要技术指标。核心交换机选型应关注可扩展性、网络可靠性和中继带宽可扩容性。' },
            { id: 28037, chapter: 28, group: 'exam', text: '在信息工程中，监理单位工作过程中会形成很多类文档，其中(64)是总体类文件。', options: ['A、监理日志', 'B、设备开箱检验报告', 'C、监理总结报告', 'D、监理月报'], answer: 'C', explanation: '知识点：监理文档分类。监理总结报告属于总体类文件；监理日志属于内部文件，监理月报属于综合性文件。' },
            { id: 28038, chapter: 28, group: 'exam', text: '信息系统工程竣工验收之后，项目的工程竣工结算由（ ）汇总编制。', options: ['A、参建单位', 'B、承建单位', 'C、监理单位', 'D、建设单位'], answer: 'D', explanation: '知识点：信息系统工程。竣工验收后工程竣工结算由建设单位汇总编制。' },
            { id: 28039, chapter: 28, group: 'exam', text: '以下不属于网络安全技术的是（ ）。', options: ['A、网络性能检测技术', 'B、数据加密技术，例如DES、RSA加密算法', 'C、物理隔离技术，如隔离网闸', 'D、防火墙技术'], answer: 'A', explanation: '知识点：网络安全技术。网络性能检测属于性能管理技术，不属于网络安全技术。' },
            { id: 28040, chapter: 28, group: 'exam', text: '隐蔽工程施工完毕，应由承建单位的(45)，符合要求后，由承建单位通知监理工程师检查验收。', options: ['A、专业技术人员检查', 'B、专职质检员进行专检', 'C、相关人员自检、互检、专检', 'D、作业技术人员进行自检'], answer: 'C', explanation: '知识点：隐蔽工程的检验。隐蔽工程施工完毕应由承建单位相关人员自检、互检、专检后通知监理验收。' },
            { id: 28041, chapter: 28, group: 'exam', text: '协助建设单位改善信息工程项目目标控制的工作流程是监理单位对信息工程目标控制采取的（ ）措施。', options: ['A、经济', 'B、组织', 'C、合同', 'D、技术'], answer: 'B', explanation: '知识点：组织措施。改善目标控制的工作流程属于组织措施。' },
            { id: 28042, chapter: 28, group: 'exam', text: '在职能式组织结构中，现场监理工程师发现项目技术问题后，首先应该向(69)报告。', options: ['A、所在职能部门领导', 'B、所在项目业主单位领导', 'C、所在公司领导', 'D、所在项目组领导'], answer: 'A', explanation: '知识点：监理工程师、组织结构。职能式组织结构中，监理工程师首先向所在职能部门领导报告。' },
            { id: 28043, chapter: 28, group: 'exam', text: '关于分包合同的禁止性规定应该包括(61)。①禁止转包②禁止将项目分包给不具备相应资质条件的单位③禁止再分包④禁止将主体结构分包', options: ['A、①②④', 'B、①②③', 'C、①②③④', 'D、①③④'], answer: 'C', explanation: '知识点：分包。禁止转包、禁止分包给无资质单位、禁止再分包、禁止主体结构分包，均属于分包合同的禁止性规定。' },
            { id: 28044, chapter: 28, group: 'exam', text: '从既节省投资又保障性能角度考虑，(5)可以采用入门级服务器。', options: ['A、办公自动化系统(OA)服务器', 'B、网络游戏服务器', 'C、视频会议服务器', 'D、打印服务器'], answer: 'D', explanation: '知识点：信息网络系统。打印服务器负载较小，可采用入门级服务器。' },
            { id: 28045, chapter: 28, group: 'exam', text: '消防联动设备的直流工作电压应符合GB156规定，优先采用(33)。', options: ['A、AC18V', 'B、AC24V', 'C、DC24V', 'D、DC18V'], answer: 'C', explanation: '知识点：测试的设备。消防联动设备的直流工作电压优先采用DC24V。' },
            { id: 28046, chapter: 28, group: 'exam', text: '关于项目质量管理的叙述，（38）是错误的。', options: ['A、变更请求也是质量保证的输入之一', 'B、质量保证是一项管理职能，包括所有为保证项目能够满足相关的质量标准而建立的有计划的、系统的活动', 'C、项目质量管理必须针对项目的管理过程和项目产品', 'D、项目质量管理过程包括质量计划编制，建立质量体系，执行质量保证'], answer: 'D', explanation: '知识点：项目质量管理。项目质量管理过程包括质量计划编制、质量保证和质量控制，“建立质量体系”不属于其过程，D项错误。' },
            { id: 28047, chapter: 28, group: 'exam', text: '某单位服务器的操作系统由原来的Windows更换成了Linux，需要对服务器上的原有应用系统进行()。', options: ['A、适应性维护', 'B、纠错性维护', 'C、完善性维护', 'D、预防性维护'], answer: 'A', explanation: '知识点：软件维护。为适应操作系统环境变化而进行的维护属于适应性维护。' },
            { id: 28048, chapter: 28, group: 'exam', text: 'VLAN在现代组网技术中占有重要地位，若一个局域网由多个VLAN组成，下列说法不正确的是(16)。', options: ['A、VLAN中的一个站点可以和另一个VLAN中的站点直接通信', 'B、当站点在一个VLAN中广播时，其他VLAN中的站点不能收到', 'C、VLAN可以通过MAC地址、交换机端口等进行定义', 'D、当站点从一个VLAN转移到另一个VLAN时，可以不改变物理连接'], answer: 'A', explanation: '知识点：局域网。不同VLAN之间的站点不能直接通信，需通过三层设备转发。' },
            { id: 28049, chapter: 28, group: 'exam', text: '在进行软件配置管理工作中，可以设立配置控制委员会协助项目经理进行软件配置管理，（34）属于配置控制委员会的职责。', options: ['A、建立、更改基线的设置，审核变更申请', 'B、批准、发布配置管理计划', 'C、执行版本控制和变更控制方案', 'D、决定项目起始基线和软件开发工作里程碑'], answer: 'A', explanation: '知识点：软件配置管理。配置控制委员会(CCB)的职责包括建立和更改基线设置、审核变更申请等。' },
            { id: 28050, chapter: 28, group: 'exam', text: '数据流程图(DFD)是描述系统数据流程的工具。在数据流程图中用(27)表示处理过程。', options: ['A、带圆角的长方形', 'B、正方形', 'C、圆或椭圆', 'D、长方形'], answer: 'A', explanation: '知识点：数据流程图。DFD中处理过程用带圆角的长方形表示。' },
            { id: 28051, chapter: 28, group: 'exam', text: '在实施项目需求规格说明书的外部评审时，监理工程师应（ ）。', options: ['A、组织预评审', 'B、参与评审', 'C、组织评审', 'D、参与预评审'], answer: 'B', explanation: '知识点：监理工程师、评审。需求规格说明书的外部评审由建设单位组织，监理工程师应参与评审。' },
            { id: 28052, chapter: 28, group: 'exam', text: '某项目采用先估计各个独立工作的费用，然后再汇总估计出整个项目的总费用，这种估算方法是（ ）。', options: ['A、参数建模', 'B、类比估计', 'C、工具计算', 'D、从下向上估计'], answer: 'D', explanation: '知识点：成本估算。先估计各独立工作费用再汇总的方法是从下向上(自下而上)估计法。' },
            { id: 28053, chapter: 28, group: 'exam', text: '监理单位在项目组织协调过程中，有关会议的描述错误的是()。', options: ['A、监理专题会议的会议纪要可由总监理工程师授权的监理工程师签认', 'B、监理例会由总监理工程师组织与主持', 'C、应该在会后24小时内公布会议成果', 'D、监理专题会议可由总监理工程师授权的监理工程师主持'], answer: 'C', explanation: '知识点：监理会议。会议成果应及时整理形成会议纪要并经签认后发送，“会后24小时内公布”无依据，表述错误。' },
            { id: 28054, chapter: 28, group: 'exam', text: '以下关于软件质量因素的叙述，正确的是(28)。', options: ['A、安全性是指防止系统被非法入侵的能力，属于管理问题的范畴', 'B、正确性是第一重要的软件质量属性', 'C、性能通常是指软件的运行速度', 'D、兼容性是指软件不经修改或稍加修改就可以运行于不同软硬件环境（CPU、OS和编译器）的能力'], answer: 'D', explanation: '知识点：质量特性。兼容性指软件不经修改或稍加修改即可运行于不同软硬件环境的能力。' },
            { id: 28055, chapter: 28, group: 'exam', text: '在使用路由器R的TCP/IP网络中，两主机通过一路由器R互联，提供主机A应用和主机B应用之间通信的层是(7)。', options: ['A、网层', 'B、应用层', 'C、IP层', 'D、传输层'], answer: 'D', explanation: '知识点：TCP/IP体系结构。提供主机应用之间端到端通信的是传输层(TCP)。' },
            { id: 28056, chapter: 28, group: 'exam', text: '以下关于监理文档管理的叙述中，（ ）是不正确的。', options: ['A、文档策略是监理单位主持制订的', 'B、文档的格式应统一', 'C、工程监理档案只能按时间顺序归档', 'D、监理单位在项目开发前应确定何时产生何种文档'], answer: 'C', explanation: '知识点：文档管理。工程监理档案可按分类、分阶段等多种方式归档，“只能按时间顺序归档”不正确。' },
            { id: 28057, chapter: 28, group: 'exam', text: '关于管道安装隐蔽工程监理的要求，不正确的是：（ ）。', options: ['A、过线盒、箱处须用支架或管卡加固', 'B、暗管宜采用金属管，预埋在墙体中间的暗管内径不宜超50mm', 'C、在路径上每根暗管的转弯角可以有“S”弯，不应有“Z”弯出现', 'D、明敷管路连接应采用丝扣连接或压扣式管连接，暗埋管应采用焊接'], answer: 'C', explanation: '知识点：综合布线工程、管道。暗管转弯应避免出现“S”弯和“Z”弯，C项表述不正确。' },
            { id: 28058, chapter: 28, group: 'exam', text: '对规模等级大和安全等级高的软件项目必须进行外部评审。关于外部评审的描述，不正确的是：()。', options: ['A、评审委员会应由业主单位、承建单位和软件专家组成', 'B、建设单位需要至少提前10天提出外部评审申请', 'C、评审分专家组审查和评委会评审两步完成', 'D、评审委员会应由7人及以上(单数)的专家组成'], answer: 'B', explanation: '知识点：评审。建设单位应提前30天提出外部评审申请，“提前10天”不正确。' },
            { id: 28059, chapter: 28, group: 'exam', text: '在信息化工程实施过程中，由于承建单位自身原因而造成实际进度拖后，建设单位、监理单位和承建单位协调后批准承建单位修改后的实施进度计划意味着(53)。', options: ['A、确认在合理状态下施工', 'B、解除了承建单位的责任', 'C、修改了合同工期', 'D、批准了工程延期'], answer: 'A', explanation: '知识点：进度计划评审。批准修改后的进度计划只是确认承建单位在新计划下合理施工，既不解除承建单位责任，也不等于批准工程延期或修改合同工期。' },
            { id: 28060, chapter: 28, group: 'exam', text: '以下关于进度控制的基本程序和主要措施的叙述中，不正确的是：（52）。', options: ['A、从工程准备阶段开始直至竣工验收的全过程中，无法对施工进度进行主动预控，因此需要监理工程师对承建单位实际进度情况进行跟踪监督并及时回馈', 'B、实施进度控制的基本措施包括组织措施、技术措施、合同措施、信息管理措施等，应根据实际执行情况采取相应的措施', 'C、监理工程师可以采用实际值与计划值进行比较的方法对进度进行检查和评价，运用行政方法、经济手段以及管理技术对工程进度加以影响和制约', 'D、发现工程进度严重偏离计划时，监理工程师启动工程进度计划调整过程对进度计划实施调整，并提供阶段性进度报告、进度月报等进度报告'], answer: 'A', explanation: '知识点：进度控制的措施。进度控制可以对施工进度进行主动预控，“无法主动预控”说法不正确。' },
            { id: 28061, chapter: 28, group: 'exam', text: '在软件质量因素中，软件在异常条件下仍能运行的能力称为软件的(28)。', options: ['A、可用性', 'B、安全性', 'C、健壮性', 'D、可靠性'], answer: 'C', explanation: '知识点：质量特性。软件在异常条件下仍能运行的能力称为健壮性。' },
            { id: 28062, chapter: 28, group: 'exam', text: '以下叙述符合信息系统监理师职业道德要求的是(25)。', options: ['A、监理人员去项目现场检查工作，交通费用应由承建单位承担', 'B、监理单位不能作为承建单位的投资方', 'C、在处理建设单位与承建单位的矛盾和纠纷时，现场监理人员首先应维护建设单位的利益', 'D、经过总监理工程师的认可，监理员可以接受承建单位的宴请'], answer: 'B', explanation: '知识点：职业道德。监理单位不能作为承建单位的投资方，符合监理独立性和职业道德要求。' },

        // ================================================================

        // ================================================================

        function loadChapterData(chapterId) {
            if (loadedChapters[chapterId]) {
                return loadedChapters[chapterId];
            }
            const data = ALL_CHAPTER_DATA[chapterId] || [];
            loadedChapters[chapterId] = data;
            return data;
        }

        function getQuestionsByChapter(chapterId) {
            if (!isActivated) {
                return [];
            }
            const full = loadChapterData(chapterId);
            return full;
        }

        function getChapterCount(chapterId) {
            const meta = CHAPTER_META[chapterId];
            if (!meta) return 0;
            if (!isActivated) return 0;
            return meta.count;
        }

        function isChapterLocked(chapterId) {
            if (!isActivated) return true;
            return false;
        }

        // ================================================================
        // ★★★ 本地存储 ★★★
        // ================================================================

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    wrongBook = data.wrongBook || [];
                    userAnswers = data.userAnswers || {};
                }
            } catch (e) {}
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    wrongBook: wrongBook,
                    userAnswers: userAnswers
                }));
            } catch (e) {}
        }

        function savePhoneToLocal(phone) {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    data.phone = phone;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } else {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        wrongBook: wrongBook,
                        userAnswers: userAnswers,
                        phone: phone
                    }));
                }
            } catch (e) {}
        }

        function getStoredPhone() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    return data.phone || '';
                }
            } catch (e) {}
            return '';
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getQuestionById(id) {
            for (const ch in ALL_CHAPTER_DATA) {
                const q = ALL_CHAPTER_DATA[ch].find(q => q.id === id);
                if (q) return q;
            }
            return null;
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast';
            if (type === 'success') toast.classList.add('success');
            if (type === 'error') toast.classList.add('error');
            toast.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
        }

        function getChapterProgress(chapterId) {
            const qs = getQuestionsByChapter(chapterId);
            const total = qs.length;
            const done = qs.filter(q => userAnswers[q.id] !== undefined && userAnswers[q.id] !== '').length;
            return { total, done, pct: total > 0 ? Math.round((done / total) * 100) : 0 };
        }

        function getChapterWrongCount(chapterId) {
            return wrongBook.filter(w => {
                const q = getQuestionById(w.id);
                return q && q.chapter === chapterId;
            }).length;
        }

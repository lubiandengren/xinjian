            { id: 18005, chapter: 18, group: 'theory', text: '风险识别的主要成果是什么？', options: ['A、项目管理计划', 'B、风险登记册', 'C、项目范围说明书', 'D、成本估算报告'], answer: 'B', explanation: '讲义中明确风险识别的产出是“风险登记册”，这是风险识别过程的核心成果。' },
            { id: 18006, chapter: 18, group: 'theory', text: '以下哪项不是风险识别的技术与方法？', options: ['A、头脑风暴法', 'B、德尔菲法', 'C、风险核对表', 'D、蒙特卡罗模拟'], answer: 'D', explanation: '讲义中列出的风险识别技术包括头脑风暴、德尔菲、情景分析、风险核对表等，蒙特卡罗模拟属于风险定量分析技术。' },
            { id: 18007, chapter: 18, group: 'theory', text: '最初风险登记册中不包含以下哪项内容？', options: ['A、风险事件', 'B、风险源', 'C、风险应对措施的具体实施细节', 'D、风险状态'], answer: 'C', explanation: '讲义中列出的最初风险登记册内容包括风险事件、风险源、风险影响、风险措施、风险状态、责任人，但风险措施是指“可能或潜在的应对措施”，不是具体的实施细节。' },
            { id: 18008, chapter: 18, group: 'theory', text: '风险定性分析的主要目的是什么？', options: ['A、计算风险造成的具体损失金额', 'B、排定风险的相对优先级', 'C、制定详细的风险应对计划', 'D、分配风险应对的预算'], answer: 'B', explanation: '讲义中明确风险定性分析的成果是“排定相对的优先级关系”，这是定性分析的核心目的。' },
            { id: 18009, chapter: 18, group: 'theory', text: '以下哪项是风险定量分析的技术？', options: ['A、专家判断', 'B、故障树分析', 'C、决策树法', 'D、层次分析'], answer: 'C', explanation: '讲义中明确风险定量分析的技术与方法包括“决策树法、蒙特卡罗模拟、敏感性分析等”。' },
            { id: 18010, chapter: 18, group: 'theory', text: '风险定量分析的成果不包括以下哪项？', options: ['A、概率分析', 'B、量化风险优先级清单', 'C、风险应对的具体执行计划', 'D、风险应对建议'], answer: 'C', explanation: '讲义中列出的风险定量分析成果包括概率分析、量化风险优先级清单、风险应对建议，但不包括具体的执行计划。' },
            { id: 18011, chapter: 18, group: 'theory', text: '在风险应对策略中，“不再实施可能导致风险的活动”属于哪种策略？', options: ['A、转移', 'B、减轻', 'C、回避', 'D、接受'], answer: 'C', explanation: '讲义中明确回避策略是“不再实施可能导致风险的活动，以完全消除威胁”。' },
            { id: 18012, chapter: 18, group: 'theory', text: '把某项风险的消极影响连同应对责任转移给第三方属于哪种风险应对策略？', options: ['A、回避', 'B、转移', 'C、减轻', 'D、开拓'], answer: 'B', explanation: '讲义中明确转移策略是“把某项风险的消极影响连同应对责任转移给第三方”。' },
            { id: 18013, chapter: 18, group: 'theory', text: '风险接受策略的特点是什么？', options: ['A、可以完全消除项目的全部威胁', 'B、只能用于积极风险', 'C、可以是被动或主动的', 'D、必须分配给第三方执行'], answer: 'C', explanation: '讲义中明确风险接受策略“可以是被动或主动的”，并指出因为几乎不可能消除全部威胁而需要采用此策略。' },
            { id: 18014, chapter: 18, group: 'theory', text: '在积极风险应对策略中，“消除与某个积极风险不确定性，确保机会肯定出现”属于哪种策略？', options: ['A、开拓', 'B、分享', 'C、增强', 'D、利用'], answer: 'A', explanation: '讲义中明确开拓策略是“消除与某个积极风险不确定性，确保机会肯定出现”。' },
            { id: 18015, chapter: 18, group: 'theory', text: '风险监控的主要依据不包括以下哪项？', options: ['A、项目管理计划', 'B、风险登记册', 'C、项目绩效信息', 'D、项目最终验收报告'], answer: 'D', explanation: '讲义中列出的风险监控依据包括项目管理计划、风险登记册、项目绩效信息和其他项目文档，项目最终验收报告不属于风险监控的主要依据。' },
            { id: 18016, chapter: 18, group: 'theory', text: '在风险监控过程中，“用于评估风险管理的有效性”的技术是？', options: ['A、审查', 'B、审计', 'C、访谈', 'D、检查表'], answer: 'B', explanation: '讲义中明确“审计：用于评估风险管理的有效性”。' },
            { id: 18017, chapter: 18, group: 'theory', text: '德尔菲法的根本特征是什么？', options: ['A、专家集体讨论', 'B、专家单独匿名表达观点', 'C、使用问卷调查', 'D、进行现场观察'], answer: 'B', explanation: '讲义中明确德尔菲法的根本特征是“专家单独、匿名表达各自的观点”。' },
            { id: 18018, chapter: 18, group: 'theory', text: '“如果……怎样……”的分析方法通常用于哪种风险评估方法？', options: ['A、头脑风暴法', 'B、德尔菲法', 'C、情景分析', 'D、检查表'], answer: 'C', explanation: '讲义中明确情景分析是“类似‘如果……怎样……’的分析方法”。' },
            { id: 18019, chapter: 18, group: 'theory', text: '风险概率影响矩阵(P-I矩阵)主要用于哪些过程？', options: ['A、仅风险识别', 'B、仅风险分析', 'C、风险分析和风险应对', 'D、仅风险监控'], answer: 'C', explanation: '讲义中明确“P-I矩阵可用于风险分析和风险应对过程”。' },
            { id: 18020, chapter: 18, group: 'theory', text: '故障树分析的主要作用是什么？', options: ['A、识别项目优势', 'B、对故障的潜在原因进行定性分析', 'C、计算项目投资回报率', 'D、评估团队绩效'], answer: 'B', explanation: '讲义中明确故障树分析“可以用来对故障的潜在原因及途径进行定性分析”。' },
            { id: 18021, chapter: 18, group: 'theory', text: 'SWOT分析除了用来识别风险，还可以用来考察什么？', options: ['A、项目的投资收益率', 'B、团队的工作效率', 'C、优势抵消威胁的程度', 'D、技术的先进程度'], answer: 'C', explanation: '讲义中明确SWOT分析“也可以用来考察项目的优势可以抵消威胁的程度，以及机会可以克服劣势的程度”。' },
            { id: 18022, chapter: 18, group: 'theory', text: '决策树分析主要用于什么目的？', options: ['A、识别风险因素', 'B、获得最优方案', 'C、评估风险概率', 'D、分配风险责任'], answer: 'B', explanation: '讲义中明确决策树分析是“进行比较，从而获得最优方案的风险型决策方法”。' },
            { id: 18023, chapter: 18, group: 'theory', text: '蒙特卡罗模拟又称为什么？', options: ['A、定性分析法', 'B、随机模拟法', 'C、专家判断法', 'D、矩阵分析法'], answer: 'B', explanation: '讲义中明确“蒙特卡罗模拟又称随机模拟法”。' },
            { id: 18024, chapter: 18, group: 'theory', text: '敏感性分析能够帮助风险管理人员实现什么目标？', options: ['A、识别所有潜在风险', 'B、精准确定风险的影响程度', 'C、完全消除风险', 'D、分配风险预算'], answer: 'B', explanation: '讲义中明确“敏感性分析可以实现风险影响后果的量化”，“能够帮助风险管理人员精准地确定风险的影响程度”。' },
            { id: 18025, chapter: 18, group: 'theory', text: '在风险应对策略中，通过增加机会的发生概率来促使机会发生的策略是？', options: ['A、开拓', 'B、分享', 'C、增强', 'D、接受'], answer: 'C', explanation: '讲义中明确增强策略是“通过增加机会的发生概率，促使机会的发生”。' },
            { id: 18026, chapter: 18, group: 'theory', text: '“合同内容不清晰、条款不明确”主要会导致以下哪种风险？', options: ['A、技术风险', 'B、管理风险', 'C、合同风险', 'D、外部环境风险'], answer: 'C', explanation: '讲义中明确将“合同内容不清晰、条款不明确”列为合同风险的具体表现。' },
            { id: 18027, chapter: 18, group: 'theory', text: '在风险规划的依据中，“组织对风险的态度和承受力信息”属于哪类资产？', options: ['A、项目管理计划', 'B、组织过程资产', 'C、项目干系人信息', 'D、风险登记册'], answer: 'B', explanation: '讲义中明确“组织过程资产”包含组织对风险的态度和承受力信息。' },
            { id: 18028, chapter: 18, group: 'theory', text: '风险管理计划中的“沟通计划”主要目的是什么？', options: ['A、估算风险管理所需资金', 'B、确定风险管理角色', 'C、建立风险沟通的机制和内容', 'D、记录风险事件的状态'], answer: 'C', explanation: '讲义中指出沟通计划用于“建立沟通机制，确定沟通的内容、渠道及方式”。' },
            { id: 18029, chapter: 18, group: 'theory', text: '风险识别过程中，使用“风险分解结构”属于哪种类型的分析方法？', options: ['A、专家判断', 'B、图表分析', 'C、数学模拟', 'D、决策树'], answer: 'B', explanation: '讲义中将“风险分解结构”列为“图表分析”技术的一种。' },
            { id: 18030, chapter: 18, group: 'theory', text: '在最初风险登记册中，记录“每个风险的潜在风险负责人”是指哪个要素？', options: ['A、风险事件', 'B、风险源', 'C、风险状态', 'D、责任人'], answer: 'D', explanation: '讲义中明确“责任人。记录每个风险的潜在风险负责人”。' },
            { id: 18031, chapter: 18, group: 'theory', text: '风险定性分析时，除了风险发生概率，还需要重点考虑哪个因素？', options: ['A、风险应对预算', 'B、风险影响程度', 'C、风险监控频率', 'D、风险报告格式'], answer: 'B', explanation: '讲义指出风险定性分析是“综合考虑每个风险的发生概率及其影响”，从而排定优先级。' },
            { id: 18032, chapter: 18, group: 'theory', text: '以下哪项是风险定量分析的典型输出？', options: ['A、风险登记册的更新', 'B、项目范围说明书的修改', 'C、组织过程资产的变更', 'D、项目干系人名单的调整'], answer: 'A', explanation: '讲义中明确风险定量分析的成果是“更新风险登记册”。' },
            { id: 18033, chapter: 18, group: 'theory', text: '关于风险应对策略，“因为几乎不可能消除项目的全部威胁”而采用的策略是？', options: ['A、回避', 'B、转移', 'C、接受', 'D、开拓'], answer: 'C', explanation: '讲义中明确指出“因为几乎不可能消除项目的全部威胁，所以就需要采用风险接受策略”。' },
            { id: 18034, chapter: 18, group: 'theory', text: '在积极风险应对策略中，“把应对机会的部分或全部责任分配给第三方”属于哪种策略？', options: ['A、开拓', 'B、分享', 'C、增强', 'D、接受'], answer: 'B', explanation: '讲义中明确“分享。把应对机会的部分或者全部责任分配给第三方”。' },
            { id: 18035, chapter: 18, group: 'theory', text: '风险监控过程中，“用于识别出新的项目风险”的技术是？', options: ['A、审计', 'B、审查', 'C、访谈', 'D、检查表'], answer: 'B', explanation: '讲义中明确“审查：用于识别出新的项目风险”。' },
            { id: 18036, chapter: 18, group: 'theory', text: '关于头脑风暴法，以下描述正确的是？', options: ['A、专家必须匿名表达观点', 'B、适用于细节讨论和发现问题', 'C、仅用于风险识别阶段', 'D、必须基于大量历史数据'], answer: 'B', explanation: '讲义指出头脑风暴法既可用于“旨在发现问题的高层次讨论”，也可用于“更细致的评审或细节讨论”。' },
            { id: 18037, chapter: 18, group: 'theory', text: '结构化半结构化访谈在风险管理中的主要作用是？', options: ['A、量化风险影响', 'B、识别风险或评估现有应对措施效果', 'C、分配风险应对预算', 'D、计算风险发生概率'], answer: 'B', explanation: '讲义中明确该访谈用于“识别风险或评估现有风险应对措施的效果”。' },
            { id: 18038, chapter: 18, group: 'theory', text: '检查表方法的主要特点是什么？', options: ['A、基于复杂的数学模型', 'B、以“是/否”进行回答', 'C、需要专家匿名参与', 'D、用于定量计算风险概率'], answer: 'B', explanation: '讲义中指出检查表是“以‘是/否’进行回答”的风险控制清单。' },
            { id: 18039, chapter: 18, group: 'theory', text: '风险概率影响矩阵(P-I矩阵)的绘制维度包括？', options: ['A、风险发生概率和风险影响程度', 'B、风险识别时间和风险应对成本', 'C、风险责任人和风险监控频率', 'D、风险类别和风险来源'], answer: 'A', explanation: '讲义中明确P-I矩阵是依据“对项目的影响程度和发生的可能性维度”来绘制的。' },
            { id: 18040, chapter: 18, group: 'theory', text: '故障树分析在掌握基本事项概率数据后，还可以进行什么分析？', options: ['A、定性计算重大事件发生概率', 'B、定量计算重大事件发生概率', 'C、识别新的风险机会', 'D、评估团队风险态度'], answer: 'B', explanation: '讲义中指出故障树分析可在掌握数据后“定量计算重大事件的发生概率”。' },
            { id: 18041, chapter: 18, group: 'theory', text: 'SWOT分析中的“T”代表什么？', options: ['A、技术(Technology)', 'B、威胁(Threat)', 'C、时间(Time)', 'D、任务(Task)'], answer: 'B', explanation: '讲义中明确SWOT分析包括优势、劣势、机会、威胁，其中“T”代表威胁(Threat)。' },
            { id: 18042, chapter: 18, group: 'theory', text: '决策树分析是一种什么类型的决策方法？', options: ['A、确定型决策', 'B、风险型决策', 'C、不确定型决策', 'D、直觉型决策'], answer: 'B', explanation: '讲义中明确决策树分析是“获得最优方案的风险型决策方法”。' },
            { id: 18043, chapter: 18, group: 'theory', text: '蒙特卡罗模拟的应用范围不包括以下哪项？', options: ['A、财务预测', 'B、投资效益评估', 'C、项目成本及进度预测', 'D、制定详细的项目章程'], answer: 'D', explanation: '讲义中列出了蒙特卡罗模拟的应用范围，包括财务预测、投资效益、成本进度预测等，但未提及用于制定项目章程。' },
            { id: 18044, chapter: 18, group: 'theory', text: '敏感性分析的主要优势是什么？', options: ['A、能够识别所有风险', 'B、能够量化风险影响后果', 'C、能够完全消除风险', 'D、能够分配风险责任'], answer: 'B', explanation: '讲义中明确“敏感性分析可以实现风险影响后果的量化”。' },
            { id: 18045, chapter: 18, group: 'theory', text: '风险应对输出的“更新风险登记册”通常不包括以下哪项？', options: ['A、已识别的风险清单', 'B、已实施的应对措施效果', 'C、风险责任人的变更', 'D、项目最终的验收标准'], answer: 'D', explanation: '讲义中指出风险应对输出包括更新风险登记册和可能的项目管理计划更新，项目最终验收标准不属于风险登记册的典型更新内容。' }
        ];
        // ★★★ 第19节 标准化与监理服务能力（40题）★★★
        const CHAPTER_19 = [
            { id: 19001, chapter: 19, group: 'theory', text: '按照适用范围划分，由国际标准化组织(ISO)制定并公布的标准属于？', options: ['A、国家标准', 'B、行业标准', 'C、国际标准', 'D、企业标准'], answer: 'C', explanation: '讲义中明确“国际标准：国际标准化组织(ISO)、国际电工委员会(IEC)和国际电信联盟(TU)以及ISO确认并公布的其他标准。”' },
            { id: 19002, chapter: 19, group: 'theory', text: '对没有国家标准而又需要在全国某个行业范围内统一技术要求所制定的标准是？', options: ['A、团体标准', 'B、行业标准', 'C、地方标准', 'D、企业标准'], answer: 'B', explanation: '讲义中明确“行业标准：对没有国家标准而又需要在全国某个行业范围内统一技术要求所制定的标准。”' },
            { id: 19003, chapter: 19, group: 'theory', text: '由社会团体按照一定程序制定并发布，由会员企业自愿采用的标准是？', options: ['A、国家标准', 'B、行业标准', 'C、团体标准', 'D、地方标准'], answer: 'C', explanation: '讲义中明确“团体标准：由社会团体按照一定的标准制定程序制定并发布，由会员企业自愿采用的标准。”' },
            { id: 19004, chapter: 19, group: 'theory', text: '按照标准涉及的对象类型划分，规定产品应满足的要求以确保其适用性的标准是？', options: ['A、术语标准', 'B、产品标准', 'C、过程标准', 'D、服务标准'], answer: 'B', explanation: '讲义中明确“产品标准：规定产品应满足的要求以确保其适用性的标准。”' },
            { id: 19005, chapter: 19, group: 'theory', text: '规定两个产品连接时相互连接问题的标准是？', options: ['A、符号标准', 'B、试验标准', 'C、接口标准', 'D、术语标准'], answer: 'C', explanation: '讲义中明确“接口标准：两个产品连接时，其相互连接的标准化问题。”' },
            { id: 19006, chapter: 19, group: 'theory', text: '按标准的要求程度划分，针对设备、构件或产品的标准化对象是？', options: ['A、规范', 'B、规程', 'C、指南', 'D、标准'], answer: 'B', explanation: '讲义中明确“规程：针对的标准化对象是设备、构件或产品。”' },
            { id: 19007, chapter: 19, group: 'theory', text: '在系统与软件工程标准中，《软件工程软件工程知识体系指南》属于？', options: ['A、生存周期管理标准', 'B、质量与测试标准', 'C、基础标准', 'D、过程标准'], answer: 'C', explanation: '讲义中将《信息技术软件工程术语》、《软件工程软件工程知识体系指南》列为“基础标准”。' },
            { id: 19008, chapter: 19, group: 'theory', text: '以下哪项不属于物联网相关标准？', options: ['A、《物联网术语》', 'B、《物联网标准化工作指南》', 'C、《物联网参考体系结构》', 'D、《信息技术云计算参考架构》'], answer: 'D', explanation: '讲义中明确《信息技术云计算参考架构》属于云计算相关标准，而非物联网标准。' },
            { id: 19009, chapter: 19, group: 'theory', text: '监理合同中，监理服务费用的计取通常为工程建设费用的？', options: ['A、0.1%到0.5%', 'B、1%到5%', 'C、5%到10%', 'D、10%到15%'], answer: 'B', explanation: '讲义中明确“监理服务费用的计取：一般为工程建设费用的1%到5%。”' },
            { id: 19010, chapter: 19, group: 'theory', text: '监理合同争议解决的方式不包括？', options: ['A、协商', 'B、仲裁', 'C、诉讼', 'D、强制调解'], answer: 'D', explanation: '讲义中明确“争议解决的方式包括协商、仲裁、诉讼”，未提及强制调解。' },
            { id: 19011, chapter: 19, group: 'theory', text: '以下哪项不属于监理人员？', options: ['A、总监理工程师', 'B、总监理工程师代表', 'C、监理工程师', 'D、外部技术专家'], answer: 'D', explanation: '讲义中明确监理人员包括总监理工程师、总监理工程师代表、监理工程师、监理员。外部技术专家属于外部技术协作体系。' },
            { id: 19012, chapter: 19, group: 'theory', text: '外部技术协作体系不包括？', options: ['A、专家管理制度', 'B、专家聘用和工作流程', 'C、专家库建设', 'D、人力资源招聘'], answer: 'D', explanation: '讲义中明确外部技术协作体系包括专家管理制度、专家聘用和工作流程、专家库建设。人力资源招聘属于人力资源管理体系。' },
            { id: 19013, chapter: 19, group: 'theory', text: '以下哪项不属于监理的技术能力？', options: ['A、监理工作体系', 'B、业务流程研究能力', 'C、监理技术规范', 'D、监理设施管理'], answer: 'D', explanation: '讲义中技术能力包括监理工作体系、业务流程研究能力、监理技术规范等。监理设施管理属于资源能力。' },
            { id: 19014, chapter: 19, group: 'theory', text: '监理技术规范不包括？', options: ['A、检查', 'B、旁站', 'C、抽查', 'D、财务审计'], answer: 'D', explanation: '讲义中明确监理技术规范包括检查、旁站、抽查、测试等。财务审计不属于监理技术规范范畴。' },
            { id: 19015, chapter: 19, group: 'theory', text: '以下哪项属于监理的资源能力？', options: ['A、监理工作体系', 'B、业务流程研究能力', 'C、质量管理体系', 'D、监理知识库及案例库'], answer: 'D', explanation: '讲义中明确资源能力包括监理机构、监理设施、监理知识库及案例库、检测分析工具、企业管理信息系统。' },
            { id: 19016, chapter: 19, group: 'theory', text: '检测分析工具及仪器设备不包括？', options: ['A、硬件工具', 'B、软件工具', 'C、监理设备', 'D、人力资源管理系统'], answer: 'D', explanation: '讲义中明确检测分析工具及仪器设备包括软硬件工具和监理设备。人力资源管理系统属于企业管理信息系统范畴。' },
            { id: 19017, chapter: 19, group: 'theory', text: '以下哪项属于监理的流程能力？', options: ['A、监理人员', 'B、监理设施', 'C、客户服务体系', 'D、检测分析工具'], answer: 'C', explanation: '讲义中明确流程能力包括项目管理体系、客户服务体系、监理及相关服务的制度和流程。' },
            { id: 19018, chapter: 19, group: 'theory', text: '按照标准的要求程度划分，提供一般性、原则性、方向性指导的文件是？', options: ['A、规范', 'B、规程', 'C、指南', 'D、标准'], answer: 'C', explanation: '讲义中明确“指南：一般性、原则性、方向性的信息、指导或建议文件。”' },
            { id: 19019, chapter: 19, group: 'theory', text: '在信息技术标准中，《信息技术大数据术语》属于？', options: ['A、物联网相关标准', 'B、云计算相关标准', 'C、大数据相关标准', 'D、软件工程标准'], answer: 'C', explanation: '讲义中明确《信息技术大数据术语》属于大数据相关标准。' },
            { id: 19020, chapter: 19, group: 'theory', text: '监理服务能力中，人力资源管理体系不包括？', options: ['A、招聘', 'B、培训与开发', 'C、绩效管理', 'D、专家库建设'], answer: 'D', explanation: '讲义中明确人力资源管理体系涵盖招聘、培训与开发、绩效管理、薪酬管理等方面。专家库建设属于外部技术协作体系。' },
            { id: 19021, chapter: 19, group: 'theory', text: '由省级标准化行政主管部门统一编制计划、组织制定、审批、编号和发布的标准是？', options: ['A、国家标准', 'B、行业标准', 'C、地方标准', 'D、企业标准'], answer: 'C', explanation: '讲义中明确“地方标准：由省级标准化行政主管部门统一编制计划、组织制定、审批、编号和发布。”' },
            { id: 19022, chapter: 19, group: 'theory', text: '按照标准涉及的对象类型划分，《XXX词汇》、《XXX术语集》属于？', options: ['A、术语标准', 'B、符号标准', 'C、试验标准', 'D、产品标准'], answer: 'A', explanation: '讲义中明确“术语标准：包含某个专业的许多术语。比如《XXX词汇》、《XXX术语集》。”' },
            { id: 19023, chapter: 19, group: 'theory', text: '按照标准涉及的对象类型划分，规定试验过程的标准是？', options: ['A、术语标准', 'B、符号标准', 'C、试验标准', 'D、过程标准'], answer: 'C', explanation: '讲义中明确“试验标准：规定试验过程的标准。”' },
            { id: 19024, chapter: 19, group: 'theory', text: '按照标准涉及的对象类型划分，规定过程应满足的要求以确保其适用性的标准是？', options: ['A、产品标准', 'B、过程标准', 'C、服务标准', 'D、接口标准'], answer: 'B', explanation: '讲义中明确“过程标准：规定过程应满足的要求以确保其适用性的标准。”' },
            { id: 19025, chapter: 19, group: 'theory', text: '按照标准的要求程度划分，所有的标准化对象都可以成为其对象的是？', options: ['A、规范', 'B、规程', 'C、指南', 'D、标准'], answer: 'A', explanation: '讲义中明确“规范：所有的标准化对象都可以成为规范的对象。”' },
            { id: 19026, chapter: 19, group: 'theory', text: '在系统与软件工程标准中，《系统与软件工程软件生存周期过程》属于？', options: ['A、基础标准', 'B、生存周期管理标准', 'C、质量与测试标准', 'D、过程标准'], answer: 'B', explanation: '讲义中将《系统与软件工程软件生存周期过程》列为“生存周期管理标准”。' },
            { id: 19027, chapter: 19, group: 'theory', text: '在系统与软件工程标准中，《系统与软件工程系统与软件质量要求和评价(SQuaRE)》属于？', options: ['A、基础标准', 'B、生存周期管理标准', 'C、质量与测试标准', 'D、产品标准'], answer: 'C', explanation: '讲义中将《系统与软件工程系统与软件质量要求和评价(SQuaRE)》列为“质量与测试标准”。' },
            { id: 19028, chapter: 19, group: 'theory', text: '以下哪项属于云计算相关标准？', options: ['A、《物联网术语》', 'B、《信息技术云计算概览与词汇》', 'C、《信息技术大数据术语》', 'D、《软件工程软件工程知识体系指南》'], answer: 'B', explanation: '讲义中明确《信息技术云计算概览与词汇》属于云计算相关标准。' },
            { id: 19029, chapter: 19, group: 'theory', text: '监理合同中，“描述实施监理的地点、目标及其提供咨询专项服务等内容”属于？', options: ['A、监理服务周期', 'B、双方的权利和义务', 'C、监理及相关服务内容', 'D、监理服务费用的计取'], answer: 'C', explanation: '讲义中明确“监理及相关服务内容：描述实施监理的地点、目标及其提供咨询专项服务等内容。”' },
            { id: 19030, chapter: 19, group: 'theory', text: '监理合同中，“业主单位履行支付费用和付酬”属于？', options: ['A、监理及相关服务内容', 'B、监理服务周期', 'C、双方的权利和义务', 'D、违约责任及争议的解决办法'], answer: 'C', explanation: '讲义中将“业主单位履行支付费用和付酬”列为双方的权利和义务内容。' },
            { id: 19031, chapter: 19, group: 'theory', text: '监理服务能力中，“包括总监理工程师、总监理工程师代表、监理工程师、监理员”属于哪个要素？', options: ['A、人员', 'B、技术', 'C、资源', 'D、流程'], answer: 'A', explanation: '讲义中明确在“人员”要素中包括总监理工程师、总监理工程师代表、监理工程师、监理员。' },
            { id: 19032, chapter: 19, group: 'theory', text: '监理服务能力中，“包括专家管理制度、专家聘用和工作流程、专家库建设”属于哪个要素？', options: ['A、人力资源管理体系', 'B、外部技术协作体系', 'C、监理工作体系', 'D、客户服务体系'], answer: 'B', explanation: '讲义中明确“外部技术协作体系：包括专家管理制度、专家聘用和工作流程、专家库建设。”' },
            { id: 19033, chapter: 19, group: 'theory', text: '监理服务能力中，“涵盖招聘、培训与开发、绩效管理、薪酬管理等方面”属于哪个要素？', options: ['A、外部技术协作体系', 'B、人力资源管理体系', 'C、监理工作体系', 'D、质量管理体系'], answer: 'B', explanation: '讲义中明确“人力资源管理体系：涵盖招聘、培训与开发、绩效管理、薪酬管理等方面。”' },
            { id: 19034, chapter: 19, group: 'theory', text: '监理服务能力中，“包括组织体系、管理体系和文档体系”属于哪个要素？', options: ['A、人员', 'B、技术', 'C、资源', 'D、流程'], answer: 'B', explanation: '讲义中明确在“技术”要素中的“监理工作体系：包括组织体系、管理体系和文档体系。”' },
            { id: 19035, chapter: 19, group: 'theory', text: '监理服务能力中，“通过长期积累和研究，掌握监理服务工作的重点和要点”指的是？', options: ['A、监理工作体系', 'B、业务流程研究能力', 'C、监理技术规范', 'D、质量管理体系'], answer: 'B', explanation: '讲义中明确“业务流程研究能力：通过长期积累和研究，掌握监理服务工作的重点和要点。”' },
            { id: 19036, chapter: 19, group: 'theory', text: '监理服务能力中，“包括检查、旁站、抽查、测试等”属于？', options: ['A、监理工作体系', 'B、业务流程研究能力', 'C、监理技术规范', 'D、监理实施细则'], answer: 'C', explanation: '讲义中明确“监理技术规范：包括检查、旁站、抽查、测试等。”' },
            { id: 19037, chapter: 19, group: 'theory', text: '监理服务能力中，“各监理机构共享所积累的技术知识和信息”指的是？', options: ['A、监理机构', 'B、监理设施', 'C、监理知识库及监理案例库', 'D、检测分析工具及仪器设备'], answer: 'C', explanation: '讲义中明确“监理知识库及监理案例库。各监理机构共享所积累的技术知识和信息。”' },
            { id: 19038, chapter: 19, group: 'theory', text: '监理服务能力中，“包括软硬件工具和监理设备”属于？', options: ['A、监理机构', 'B、监理设施', 'C、检测分析工具及仪器设备', 'D、企业管理信息系统'], answer: 'C', explanation: '讲义中明确“检测分析工具及仪器设备。包括软硬件工具和监理设备。”' },
            { id: 19039, chapter: 19, group: 'theory', text: '监理服务能力中，“通过管理软件实现内部办公、财务和合同的信息化管理”指的是？', options: ['A、监理知识库及监理案例库', 'B、检测分析工具及仪器设备', 'C、企业管理信息系统', 'D、客户服务体系'], answer: 'C', explanation: '讲义中明确“企业管理信息系统。通过管理软件实现内部办公、财务和合同的信息化管理。”' },
            { id: 19040, chapter: 19, group: 'theory', text: '监理服务能力中，“客户服务体系”属于哪个要素？', options: ['A、人员', 'B、技术', 'C、资源', 'D、流程'], answer: 'D', explanation: '讲义中明确在“流程”要素中包括“客户服务体系”。' }
        ];

        // ★★★ 第20节 招投标与工程全过程监理（49题）★★★
        const CHAPTER_20 = [
            { id: 20001, chapter: 20, group: 'theory', text: '在规划阶段，监理验证项目需求的基本方法不包括以下哪项？', options: ['A、自查法', 'B、用户审查法', 'C、专家审查法', 'D、抽样测试法'], answer: 'D', explanation: '讲义中明确需求验证的基本方法包括自查法、用户审查法、专家审查法和原型法，未提及抽样测试法。' },
            { id: 20002, chapter: 20, group: 'theory', text: '关于公开招标的缺点，以下描述正确的是？', options: ['A、程序简单，耗时少', 'B、费用支出较少', 'C、采购风险较大', 'D、容易产生舞弊行为'], answer: 'C', explanation: '讲义中明确指出公开招标的缺点包括“程序较为复杂，招投标耗时较多，费用支出也较多”和“采购风险较大，例如，投标者之间可能出现串通投标”。' },
            { id: 20003, chapter: 20, group: 'theory', text: '在什么情况下可以采用邀请招标方式？', options: ['A、项目预算充足时', 'B、涉及国家安全、国家秘密时', 'C、希望扩大投标人范围时', 'D、项目技术要求简单时'], answer: 'B', explanation: '讲义中明确“涉及国家安全、国家秘密或者抢险救灾，不宜公开招标的”可以采用邀请招标方式。' },
            { id: 20004, chapter: 20, group: 'theory', text: '监理机构在参与招标文件编制时，对技术和质量要求的审核不包括？', options: ['A、指标描述是否具体准确', 'B、是否满足业主单位业务需求', 'C、投标单位的企业规模', 'D、技术和质量要求的可实现性'], answer: 'C', explanation: '讲义中明确技术和质量要求的审核包括指标描述、业务需求满足度、可实现性和经济性，不涉及投标单位的企业规模。' },
            { id: 20005, chapter: 20, group: 'theory', text: '招标人对已发出的招标文件进行必要的澄清或者修改的，应当在什么时候通知所有招标文件收受人？', options: ['A、投标截止时间前5日', 'B、投标截止时间前15日', 'C、开标前5日', 'D、开标前15日'], answer: 'B', explanation: '讲义中明确“应当在招标文件要求提交投标文件截止时间至少十五日前，以书面形式通知所有招标文件收受人”。' },
            { id: 20006, chapter: 20, group: 'theory', text: '依法须进行招标的项目，自招标文件开始发出之日起至投标人提交投标文件截止之日止，最短不得少于多少日？', options: ['A、10日', 'B、15日', 'C、20日', 'D、30日'], answer: 'C', explanation: '讲义中明确“最短不得少于二十日”。' },
            { id: 20007, chapter: 20, group: 'theory', text: '招标人和中标人应当自中标通知书发出之日起多长时间内订立书面合同？', options: ['A、15日', 'B、20日', 'C、30日', 'D、45日'], answer: 'C', explanation: '讲义中明确“应当自中标通知书发出之日起三十日内，按照招标文件和中标人的投标文件订立书面合同”。' },
            { id: 20008, chapter: 20, group: 'theory', text: '在设计阶段，对设计方案的审查不包括以下哪项？', options: ['A、设计方案的完整性', 'B、设计方案的艺术性', 'C、与项目需求的符合性', 'D、设计正确性'], answer: 'B', explanation: '讲义中明确对设计方案的审查包括完整性、符合性、合理性和正确性，未提及艺术性。' },
            { id: 20009, chapter: 20, group: 'theory', text: '设计变更控制主要通过哪两个手段来实现？', options: ['A、变更流程控制和变更内容控制', 'B、变更时间控制和变更成本控制', 'C、变更人员控制和变更文档控制', 'D、变更技术控制和变更质量控制'], answer: 'A', explanation: '讲义中明确“设计变更控制主要通过两个手段来实现：变更流程的控制和变更内容的控制”。' },
            { id: 20010, chapter: 20, group: 'theory', text: '在实施阶段，监理机构审核实施方案时，不需要审核以下哪项？', options: ['A、实施方案与法律法规的符合性', 'B、实施方案的合理性和可行性', 'C、承建单位的财务状况', 'D、实施方案与合同的符合性'], answer: 'C', explanation: '讲义中明确实施方案审核内容包括与法律法规符合性、合理可行性、与合同设计方案符合性，不涉及承建单位财务状况。' },
            { id: 20011, chapter: 20, group: 'theory', text: '当质量缺陷出现明显症状时，监理机构应该怎么做？', options: ['A、要求承建单位加快进度', 'B、发出暂停施工的指令', 'C、降低质量标准', 'D、忽略问题继续施工'], answer: 'B', explanation: '讲义中明确“当质量缺陷出现明显症状时，监理机构应发出暂停施工的指令”。' },
            { id: 20012, chapter: 20, group: 'theory', text: '审查分包单位资质时，不需要审查以下哪项？', options: ['A、营业执照', 'B、企业资质等级证书', 'C、管理人员资格证书', 'D、股东构成信息'], answer: 'D', explanation: '讲义中明确需要审查营业执照、企业资质等级证书、技术管理人员资格证书等，未提及股东构成信息。' },
            { id: 20013, chapter: 20, group: 'theory', text: '硬件设备验收时，设备加电测试主要测试什么？', options: ['A、设备外观是否美观', 'B、设备包装是否完整', 'C、设备是否可以正常开机', 'D、设备运输费用是否合理'], answer: 'C', explanation: '讲义中明确加电测试主要测试“设备是否可以正常开机，运行的稳定性，配置参数是否与合同要求一致”。' },
            { id: 20014, chapter: 20, group: 'theory', text: '在质量事故处理程序中，监理机构首先应该做什么？', options: ['A、签发复工令', 'B、要求承建单位立即采取措施', 'C、上报行政监督部门', 'D、修改项目预算'], answer: 'B', explanation: '讲义中明确“要求承建单位在事故发生后立即采取措施，尽可能控制其影响范围，及时签发停工令，上报业主单位”。' },
            { id: 20015, chapter: 20, group: 'theory', text: '项目延期影响项目总体进度计划时，监理机构应该要求谁修改进度计划？', options: ['A、业主单位', 'B、监理机构', 'C、承建单位', 'D、设计单位'], answer: 'C', explanation: '讲义中明确“要求承建单位修改项目总体进度计划，经三方签认后，做工程备忘录”。' },
            { id: 20016, chapter: 20, group: 'theory', text: '索赔处理程序中，申请方应在什么时候向监理机构提交索赔申请？', options: ['A、项目开始前', 'B、合同规定的期限内', 'C、项目结束后', 'D、任意时间'], answer: 'B', explanation: '讲义中明确“申请方应在合同规定的期限内向监理机构提交索赔申请”。' },
            { id: 20017, chapter: 20, group: 'theory', text: '在项目初验条件中，不包括以下哪项？', options: ['A、招投标文件要求的系统功能已实现', 'B、承建单位提交了自测报告', 'C、系统已通过终验', 'D、监理机构抽检测试已完成'], answer: 'C', explanation: '讲义中列出的初验条件包括系统功能实现、自测报告提交、文档齐备、验收方案审核、抽检测试完成等，系统通过终验是终验阶段的要求。' },
            { id: 20018, chapter: 20, group: 'theory', text: '系统试运行的启动依据是什么？', options: ['A、承建单位的口头承诺', 'B、初验合格报告', 'C、监理机构的单方面决定', 'D、业主单位的主观意愿'], answer: 'B', explanation: '讲义中明确“要求业主及承建单位以初验合格报告作为启动试运行的依据”。' },
            { id: 20019, chapter: 20, group: 'theory', text: '项目终验的条件不包括以下哪项？', options: ['A、项目建设内容按照合同要求全部完成', 'B、系统的功能和性能满足设计要求', 'C、系统已通过初验和试运行', 'D、承建单位已获得其他项目合同'], answer: 'D', explanation: '讲义中详细列出了终验的多个条件，但不包括承建单位获得其他项目合同这一项。' },
            { id: 20020, chapter: 20, group: 'theory', text: '在验收阶段监理工作流程中，监理机构输出的文档不包括？', options: ['A、监理工作联系单', 'B、监理通知单', 'C、承建单位财务报表', 'D、整改方案'], answer: 'C', explanation: '讲义中的验收阶段监理工作流程显示了多种输出文档，但不包括承建单位财务报表。' },
            { id: 20021, chapter: 20, group: 'theory', text: '监理机构在招标阶段对投标单位资质的审查，主要从哪两个方面考虑？', options: ['A、企业规模和成立时间', 'B、企业注册地和员工数量', 'C、企业能力和资质认证、项目经验', 'D、企业法人代表和股东背景'], answer: 'C', explanation: '讲义中明确“投标单位资质的要求，从两个方面考虑：投标单位的能力、资质认证要求；投标单位的项目经验要求”。' },
            { id: 20022, chapter: 20, group: 'theory', text: '关于邀请招标的缺点，以下描述正确的是？', options: ['A、招标工作量和费用较大', 'B、竞争开放度相对较弱', 'C、程序复杂耗时较长', 'D、容易产生舞弊行为'], answer: 'B', explanation: '讲义中明确指出邀请招标的缺点包括“投标人数量相对较少，竞争开放度相对较弱”。' },
            { id: 20023, chapter: 20, group: 'theory', text: '在设计文档完整性审查完毕后，监理机构下一步应该做什么？', options: ['A、直接签认设计方案', 'B、组织设计方案的详细审查', 'C、要求重新招标', 'D、修改项目预算'], answer: 'B', explanation: '讲义中明确“设计文档完整性审查完毕后，监理机构应组织人员进行设计方案的详细审查”。' },
            { id: 20024, chapter: 20, group: 'theory', text: '实施准备会议的主要内容应做成什么文档？', options: ['A、会议纪要', 'B、监理规划', 'C、项目预算', 'D、招标文件'], answer: 'A', explanation: '讲义中明确“会议内容应做会议纪要，并经三方签认”。' },
            { id: 20025, chapter: 20, group: 'theory', text: '当质量缺陷已对下个阶段产生质量影响时，监理机构应该怎么做？', options: ['A、忽略问题继续施工', 'B、拒绝签认工程计量', 'C、降低质量标准', 'D、加快施工进度'], answer: 'B', explanation: '讲义中明确“当质量缺陷已对下个阶段产生质量影响时，应拒绝签认工程计量，并要求承建单位进行返工或处理”。' },
            { id: 20026, chapter: 20, group: 'theory', text: '硬件设备验收时，承建单位应提前多长时间通知业主单位和监理机构具体的到货时间和地点？', options: ['A、一天', 'B、三天', 'C、一周', 'D、半个月'], answer: 'B', explanation: '讲义中明确“承建单位按照要求提供拟发设备后，提前三天通知业主单位和监理机构具体的到货时间和地点”。' },
            { id: 20027, chapter: 20, group: 'theory', text: '在项目终验后，监理机构还需要做什么工作？', options: ['A、审核承建单位的项目结算', 'B、重新招标', 'C、修改设计方案', 'D、更换承建单位'], answer: 'A', explanation: '讲义中明确“项目终验后，审核承建单位的项目结算，可协助业主单位进行项目决算”。' },
            { id: 20028, chapter: 20, group: 'theory', text: '监理机构在处理合同管理问题时，如果三方就申请处理结果达成一致，应该及时签署什么文档？', options: ['A、监理规划', 'B、工程备忘录', 'C、投标文件', 'D、设计说明书'], answer: 'B', explanation: '讲义中明确“三方就申请处理结果达成一致后，监理机构应及时签署工程备忘录并落实合同变更”。' },
            { id: 20029, chapter: 20, group: 'theory', text: '在实施阶段监理工作流程中，承建单位做好项目实施前的各项准备工作后，应向谁提出项目实施申请？', options: ['A、业主单位', 'B、监理机构', 'C、设计单位', 'D、行政监督部门'], answer: 'B', explanation: '讲义中明确“承建单位做好项目实施前的各项准备工作后，向监理机构提出项目实施申请”。' },
            { id: 20030, chapter: 20, group: 'theory', text: '项目终验也称为什么？', options: ['A、初步验收', 'B、系统测试', 'C、竣工验收', 'D、项目启动'], answer: 'C', explanation: '讲义中明确“项目终验也称竣工验收”。' },
            { id: 20031, chapter: 20, group: 'theory', text: '在规划阶段监理活动中，监理单位协助业主单位构建的是什么？', options: ['A、项目预算', 'B、信息系统架构', 'C、投标文件', 'D、合同条款'], answer: 'B', explanation: '讲义中明确规划阶段监理活动包括“协助业主单位构建信息系统架构”。' },
            { id: 20032, chapter: 20, group: 'theory', text: '监理单位参与编写初步设计方案时，主要协助编制什么？', options: ['A、投资预算', 'B、招标文件', 'C、合同条款', 'D、用户手册'], answer: 'A', explanation: '讲义中明确“根据业主单位的委托，参与编写初步设计方案，协助编制投资预算”。' },
            { id: 20033, chapter: 20, group: 'theory', text: '需求验证方法中，通过原型系统验证存在争议或不确定需求的方法是？', options: ['A、自查法', 'B、用户审查法', 'C、专家审查法', 'D、原型法'], answer: 'D', explanation: '讲义中明确“原型法：通过原型系统验证存在争议或不确定的需求”。' },
            { id: 20034, chapter: 20, group: 'theory', text: '招标工作计划的内容不包括以下哪项？', options: ['A、项目建设内容', 'B、组织管理', 'C、总包、分包方式', 'D、承建单位股东信息'], answer: 'D', explanation: '讲义中明确工作计划内容包括项目建设内容、组织管理、总包分包方式等，不涉及承建单位股东信息。' },
            { id: 20035, chapter: 20, group: 'theory', text: '监理机构在参与招标文件编制时，对验收方法的审核通常建议采用什么方法？', options: ['A、专家评审', 'B、用户投票', 'C、测试验证', 'D、领导决定'], answer: 'C', explanation: '讲义中明确“验收方法：通常采用测试的方法来验证系统预先设计的技术指标”。' },
            { id: 20036, chapter: 20, group: 'theory', text: '招标人与确定中标人之日起多少日内，需向行政监督部门提交书面报告？', options: ['A、10日', 'B、15日', 'C、20日', 'D、30日'], answer: 'B', explanation: '讲义中明确“招标人与确定中标人之日起十五日内，向行政监督部门提交招标投标的书面报告”。' },
            { id: 20037, chapter: 20, group: 'theory', text: '合同审核要点中，不需要关注以下哪项？', options: ['A、招标文件与投标文件的一致性', 'B、总体进度和阶段进度要求', 'C、工程里程碑的划分', 'D、承建单位员工薪资水平'], answer: 'D', explanation: '讲义中列出的合同审核要点包括文件一致性、进度要求、里程碑划分等，不涉及员工薪资。' },
            { id: 20038, chapter: 20, group: 'theory', text: '对设计方案的审查中，“用户界面布局设计是否合理”属于审查什么？', options: ['A、完整性', 'B、符合性', 'C、合理性', 'D、正确性'], answer: 'C', explanation: '讲义中将“用户界面布局设计是否合理”作为设计合理性的审查例子。' },
            { id: 20039, chapter: 20, group: 'theory', text: '设计阶段对测试验收方案的审查，不包括以下哪项内容？', options: ['A、测试用例设计', 'B、测试方法与流程', 'C、测试结果的判别方法', 'D、测试人员的考勤记录'], answer: 'D', explanation: '讲义中明确测试验收方案应包括测试用例设计、测试方法与流程、测试结果判别方法，不涉及人员考勤。' },
            { id: 20040, chapter: 20, group: 'theory', text: '设计阶段文档管理要求中，不需要妥善保管的是？', options: ['A、招投标文件', 'B、承建合同', 'C、设计阶段监理文档', 'D、承建单位内部会议记录'], answer: 'D', explanation: '讲义中要求保管招投标文件、承建合同、监理文档等，但不包括承建单位内部会议记录。' },
            { id: 20041, chapter: 20, group: 'theory', text: '实施阶段对质量管理计划的审查，不包括以下哪项？', options: ['A、项目的质量目标', 'B、质量角色的职责', 'C、工作过程和成果的质量评审', 'D、承建单位的利润目标'], answer: 'D', explanation: '讲义中明确质量管理计划审查包括质量目标、质量职责、质量评审，不涉及利润目标。' },
            { id: 20042, chapter: 20, group: 'theory', text: '监理人员在实施阶段处理质量问题时应遵循的原则中，当需要发出暂停施工指令时，应该由谁签发？', options: ['A、业主单位代表', 'B、承建单位项目经理', 'C、总监理工程师', 'D、设计单位负责人'], answer: 'C', explanation: '讲义中明确由“监理机构”发出暂停指令，通常由总监理工程师签发。' },
            { id: 20043, chapter: 20, group: 'theory', text: '审查分包单位时，需要审查其近三年完成的什么样工程的业绩？', options: ['A、与分包工程内容类似的工程', 'B、所有类型的工程', 'C、海外工程项目', 'D、政府投资项目'], answer: 'A', explanation: '讲义中明确“业绩是指分包单位近三年完成的与分包工程内容类似的工程及质量情况”。' },
            { id: 20044, chapter: 20, group: 'theory', text: '硬件设备验收流程中，设备开箱检查应该由哪几方人员参加？', options: ['A、仅承建单位', 'B、仅业主单位', 'C、仅监理机构', 'D、三方人员共同'], answer: 'D', explanation: '讲义中明确“三方安排人员对到货设备进行现场开箱检查”。' },
            { id: 20045, chapter: 20, group: 'theory', text: '在质量事故处理程序中，总监理工程师在什么条件下可以签发复工令？', options: ['A、承建单位提出要求时', 'B、条件具备时', 'C、业主单位要求时', 'D、任意时间'], answer: 'B', explanation: '讲义中明确“条件具备时，总监理工程师可以签发复工令，恢复施工”。' },
            { id: 20046, chapter: 20, group: 'theory', text: '项目延期处理时，如果影响总体进度计划，修改后的计划需要经过什么程序？', options: ['A、承建单位单方面确认', 'B、监理机构单方面确认', 'C、三方签认', 'D、业主单位单方面确认'], answer: 'C', explanation: '讲义中明确“经三方签认后，做工程备忘录”。' },
            { id: 20047, chapter: 20, group: 'theory', text: '索赔处理中，总监理工程师进行索赔审查时，需要与哪两方协商？', options: ['A、仅业主单位', 'B、仅承建单位', 'C、业主和承建单位', 'D、设计单位'], answer: 'C', explanation: '讲义中明确“与承建单位和业主单位协商索赔费用”。' },
            { id: 20048, chapter: 20, group: 'theory', text: '项目初验条件中，要求承建单位对于不合格项进行什么处理？', options: ['A、忽略不计', 'B、进行整改并复测通过', 'C、降低标准', 'D、转移责任'], answer: 'B', explanation: '讲义中明确“承建单位对于不合格项进行了整改并复测通过”。' },
            { id: 20049, chapter: 20, group: 'theory', text: '系统试运行阶段，监理机构需要督促承建单位解决什么问题？', options: ['A、试运行中出现的问题', 'B、项目预算问题', 'C、人员编制问题', 'D、办公场地问题'], answer: 'A', explanation: '讲义中明确“督促承建单位解决试运行中出现的问题”。' }
        ];

        // ★★★ 第21节 各子系统工程监理（20题）★★★
        const CHAPTER_21 = [
            { id: 21001, chapter: 21, group: 'theory', text: '在招标阶段监理内容中，以下哪项不属于“梳理工程需求”的内容？', options: ['A、工程建设目标', 'B、投标单位的资质要求', 'C、工程投资规模', 'D、工程进度计划'], answer: 'B', explanation: '梳理工程需求主要包括目标、范围、功能性能安全需求、投资规模、进度计划、法律法规等，而“投标单位的资质要求”属于招标文件的监理内容。' },
            { id: 21002, chapter: 21, group: 'theory', text: '设计阶段监理中，以下哪项属于“投资控制”内容？', options: ['A、审查设计人员执业资格', 'B、审核工作计划内容', 'C、组织确认工程建设目标', 'D、审核概要预算，确定投资合理性'], answer: 'D', explanation: '投资控制包括协助制定造价目标、审核预算、组织方案比选等，D项符合；A、B、C属于质量控制内容。' },
            { id: 21003, chapter: 21, group: 'theory', text: '实施阶段监理中，关于隐蔽工程的检查，以下说法正确的是：', options: ['A、隐蔽工程可在隐蔽后补检', 'B、监理机构可拒绝签认不合格的隐蔽工程', 'C、隐蔽工程不需自检可直接报验', 'D、隐蔽工程验收不合格可进入下一道工序'], answer: 'B', explanation: '隐蔽工程必须在隐蔽前检查，承建单位自检合格后报验，监理检查合格方可签认，否则不得隐蔽或进入下一道工序。' },
            { id: 21004, chapter: 21, group: 'theory', text: '在验收阶段，监理机构检查竣工验收条件时，不包括以下哪项？', options: ['A、检查承建单位是否完成工程设计和合同约定内容', 'B、确认工程质量是否符合合同及设计文件要求', 'C、检查承建单位安全生产许可证有效性', 'D、检查公安消防、环保等部门出具的认可文件'], answer: 'C', explanation: '安全生产许可证有效性属于实施阶段安全监督管理内容，不属于竣工验收条件。' },
            { id: 21005, chapter: 21, group: 'theory', text: '在计算机网络系统工程实施阶段，关于主要设备到货验收的监理，以下哪项说法错误？', options: ['A、监理机构应组织对主要网络设备进行验收', 'B、对于数量较大的同类产品必须全部开箱检测', 'C、必要时可要求提交第三方测试报告', 'D、验收时应记录产品唯一性标识，如序列号'], answer: 'B', explanation: '对于数量较大的同类产品，监理机构可进行抽检，不必全部检测。' },
            { id: 21006, chapter: 21, group: 'theory', text: '在安全防范系统工程中，出入口控制（门禁）系统的功能检测不包括：', options: ['A、系统主机离线情况下控制器独立工作功能', 'B、系统与消防系统报警的联动功能', 'C、视频监控系统的图像记录保存时间', 'D、非法强行入侵及时报警的能力'], answer: 'C', explanation: '图像记录保存时间属于视频监控系统的检测内容，不属于门禁系统功能检测。' },
            { id: 21007, chapter: 21, group: 'theory', text: '在环境系统工程的监理中，室内噪声环境的监理要点不包括：', options: ['A、降低噪声和防止噪声扩散的措施检查', 'B、室内噪声控制测试控制值满足规范', 'C、室内照明的照度水平验收', 'D、隔绝材料和隔绝措施的质量验收'], answer: 'C', explanation: '照度水平验收属于室内照明监理内容，不属于噪声环境监理。' },
            { id: 21008, chapter: 21, group: 'theory', text: '在动力环境监控系统工程施工中，关于设备安装的说法错误的是：', options: ['A、温湿度传感器应安装在机房发热设备密集的房顶位置', 'B、漏水感应线应紧贴地面，在可能漏水处密布探头', 'C、信号防雷器应并接入电路中，电源防雷器串接', 'D、信号防雷器接地线截面积应不小于2.5mm²'], answer: 'C', explanation: '信号防雷器应串接在设备中，电源防雷器并接入电路中，选项C描述错误。' },
            { id: 21009, chapter: 21, group: 'theory', text: '关于通用布缆系统工程验收阶段的监理内容，以下哪项说法不正确？', options: ['A、应检查承建单位测试仪器的有效性和可用性', 'B、竣工文档不包括隐蔽工程记录', 'C、审核测试报告是否符合设计方案验收标准', 'D、竣工文档包括承建合同、招标文件、设计方案等'], answer: 'B', explanation: '竣工文档包括隐蔽工程记录、变更记录、自测报告、竣工图纸等，B项说法错误。' },
            { id: 21010, chapter: 21, group: 'theory', text: '在监理各子系统工程时，关于机柜安装要求的说法中，哪项是正确的？', options: ['A、机柜单排安装时，前面净空不应小于800mm', 'B、多排机柜列间距不应小于1000mm', 'C、背对背布置的机柜背面之间的距离不宜小于1.0m', 'D、成行排列的机柜长度超过6m时，两端应设有通道'], answer: 'D', explanation: '根据文档，成行排列的机柜长度超过6m时，两端应设有通道；A应为1000mm，B应为1200mm，C应为0.8m。' },
            { id: 21011, chapter: 21, group: 'theory', text: '根据基础设施工程监理的承建合同监理内容，关于工程付款的约定，以下哪项是正确的？', options: ['A、包工包料工程的预付款比例不得高于10%', 'B、进度款支付比例不得低于工程价款的90%', 'C、进度款支付比例不得高于工程价款的60%', 'D、包工包料工程的预付款比例不低于10%，不高于30%'], answer: 'D', explanation: '文档中明确说明：包工包料工程的预付款额的比例不低于合同金额的10%，不高于合同金额的30%；进度款按不低于60%，不高于90%向承包人支付。' },
            { id: 21012, chapter: 21, group: 'theory', text: '在设计阶段监理的“协调”工作中，以下哪项不是监理单位的工作内容？', options: ['A、配合业主确认设备配置和选型', 'B、监控设计资料和设计文件的交付进度', 'C、审查设计文件中设备、材料价格和用量的合理性', 'D、直接制定建设工程的造价目标'], answer: 'D', explanation: '“协助业主制定建设工程造价目标”属于“投资控制”范畴，而不是“协调”工作的内容。协调工作侧重于配合、监控和审查，而非直接制定目标。' },
            { id: 21013, chapter: 21, group: 'theory', text: '在实施阶段的质量控制中，关于“严把进场原材料、设备质量关”的要求，以下说法错误的是？', options: ['A、所有设备应有合格证，安装前按说明书进行质量检查', 'B、对国家有特殊要求的材料，只需有出厂证明即可', 'C、新材料、新型制品要有技术鉴定文件', 'D、各种产品必须有出厂证明、检测报告、技术合格证等'], answer: 'B', explanation: '文档明确指出：国家有特殊要求的材料和设备要有相应的批准证书。因此，仅有出厂证明是不够的。' },
            { id: 21014, chapter: 21, group: 'theory', text: '在验收阶段的“质量控制措施”中，初验阶段的工作不包括以下哪项？', options: ['A、审核初验计划和初验方案', 'B、组织初验会议', 'C、审核试运行记录和试运行报告', 'D、检查竣工验收条件'], answer: 'C', explanation: '“审核试运行记录和试运行报告”属于试运行阶段的质量控制内容，而非初验阶段的工作。' },
            { id: 21015, chapter: 21, group: 'theory', text: '对于计算机网络系统工程的“工程设计方案审核”，以下哪项不属于“网络基础设施的审核”内容？', options: ['A、网络集成的设计，包括接入方式、带宽等', 'B、故障恢复能力和措施', 'C、网络服务的可靠性', 'D、网络端口的可扩容性'], answer: 'C', explanation: '“网络服务的可靠性”属于“网络服务的审核”范畴，而不是对网络基础设施（如硬件、端口、集成方式）的审核。' },
            { id: 21016, chapter: 21, group: 'theory', text: '在安全防范系统中，关于“视频监控系统”的监视要点，以下哪项描述是正确的？', options: ['A、应检测其与出入口控制系统的联动功能', 'B、应检测探测器的防动物侵入功能', 'C、应检查巡更终端对巡更路线的响应功能', 'D、应检测掉电后备用电源的应急工作能力'], answer: 'A', explanation: '文档中视频监控系统的联动功能检测明确包括与出入口控制（门禁）系统、入侵报警系统等的联动。B项属于入侵报警系统，C项属于巡更管理系统，D项属于门禁系统。' },
            { id: 21017, chapter: 21, group: 'theory', text: '关于机房环境系统中的“防鼠害监理要点”，以下哪项措施是不正确的？', options: ['A、机房内所有的孔洞在施工完成后都应及时封堵', 'B、所有的线路都应裸露以便于散热和检查', 'C、所有的电缆竖井都应用防火泥封堵', 'D、所有的线路都应盖好、密封'], answer: 'B', explanation: '文档明确要求“所有的线路都应盖好、密封”，以防止鼠害。让线路裸露恰恰违反了防鼠害的基本要求。' },
            { id: 21018, chapter: 21, group: 'theory', text: '在动力环境监控系统工程的实施中，关于设备安装检查，以下哪项描述是正确的？', options: ['A、温湿度传感器应安装在机房角落的地面位置', 'B、漏水感应线应悬空架设，避免地面潮气影响', 'C、信号防雷器并接入电路中，电源防雷器串接', 'D、电源防雷器的接地线截面积应不小于10mm²'], answer: 'D', explanation: '文档明确规定：电源防雷器的接地线≥10mm²。A项传感器应安装在发热设备密集的房顶，B项感应线应紧贴地面，C项信号防雷器应串接，电源防雷器应并接。' },
            { id: 21019, chapter: 21, group: 'theory', text: '根据各子系统工程监理内容中关于机柜安装的要求，机柜多排安装时，列间距不应小于多少？', options: ['A、800mm', 'B、1000mm', 'C、1200mm', 'D、1500mm'], answer: 'C', explanation: '文档中明确规定了多排安装时，列间距不应小于1200mm。' },
            { id: 21020, chapter: 21, group: 'theory', text: '在“各子系统工程监理内容”的总纲部分，对网络安全性设计的审核，不包括以下哪个方面？', options: ['A、与国家相关法律法规、标准规范的符合性', 'B、所选网络安全技术的开放性、兼容性、可扩展性', 'C、网络管理系统的故障处理响应时间', 'D、网络安全所遵循的标准和达到的相应等级'], answer: 'C', explanation: '“网络管理系统的故障处理响应时间”属于“网络管理系统的审核”中关于系统性能的范畴，而不是对“网络安全性设计”本身的审核。' }
        ];

        // ★★★ 第22节 软件工程监理（24题）★★★
        const CHAPTER_22 = [
            { id: 22001, chapter: 22, group: 'theory', text: '在软件工程监理的阶段划分中，监理活动“计划制订的监理”主要归属于哪个阶段？', options: ['A、招标阶段', 'B、设计阶段', 'C、实施阶段', 'D、验收阶段'], answer: 'B', explanation: '根据表22-1“软件工程监理过程说明”，设计阶段的监理活动包括：计划制订的监理、需求分析的监理、概要设计的监理、详细设计的监理。' },
            { id: 22002, chapter: 22, group: 'theory', text: '以下哪项是软件工程“招标阶段”监理的主要工作内容？', options: ['A、审核承建单位提交的测试报告', 'B、参与招标文件的编制，或审核其技术需求', 'C、组织对软件系统功能的完成情况进行检查', 'D、督促承建单位提交系统部署计划'], answer: 'B', explanation: '文档中“招标阶段监理内容”明确包括：收集资料、梳理需求、参与或审核招标文件。A、C、D选项分别属于实施、验收和实施阶段的工作。' },
            { id: 22003, chapter: 22, group: 'theory', text: '在“需求规格说明书”的检查中，“是否已经对每个业务逻辑进行输入、输出以及过程的详细说明”这一检查项，主要归属于以下哪个检查类目？', options: ['A、清晰性', 'B、完整性', 'C、可行性', 'D、可管理性'], answer: 'A', explanation: '根据表22-2“需求规格说明书检查表”，对业务逻辑输入、输出、过程的详细说明，是为了确保需求的“清晰性”，避免含糊不清。' },
            { id: 22004, chapter: 22, group: 'theory', text: '对软件“概要（结构）设计”进行监理时，检查“是否所设计的架构都被清楚地表达了，包括数据流、控制流和接口”，这主要关注的是设计的？', options: ['A、完整性', 'B、清晰性', 'C、一致性', 'D、可行性'], answer: 'B', explanation: '根据表22-3“概要(结构)设计检查表”，检查架构、数据流、控制流和接口是否被清楚表达，属于“清晰性”类目的检查内容。' },
            { id: 22005, chapter: 22, group: 'theory', text: '在软件工程监理中，“详细设计”的监理准则不包括以下哪一项？', options: ['A、与概要(结构)设计的一致性', 'B、软件运行和维护的可行性', 'C、压力测试对主要指标的验证', 'D、代码的可读性强，易于理解'], answer: 'D', explanation: '文档中明确列出了详细设计的监理准则：与概要设计的一致性、测试的可行性/完备性、运行维护的可行性、压力测试对指标的验证。“代码可读性”属于“编码及测试的监理”中对编码规范的要求。' },
            { id: 22006, chapter: 22, group: 'theory', text: '设计阶段的需求管理中，验证需求的方式不包括以下哪种？', options: ['A、审查需求文档', 'B、依据需求编写监理验证用的测试用例', 'C、编写用户手册', 'D、直接开始编码工作'], answer: 'D', explanation: '文档中“设计阶段的需求管理”部分明确指出，验证需求可采用的方式包括：审查需求文档、编写测试用例、编写用户手册、确定合格标准。直接开始编码不符合规范的需求验证流程。' },
            { id: 22007, chapter: 22, group: 'theory', text: '在“实施阶段”的“编码及测试的监理”工作中，以下哪项不是对“软件编码规范”的要求？', options: ['A、遵循开发流程，在设计的指导下编写代码', 'B、程序可读性强，易于理解', 'C、软件具有良好的可扩展性', 'D、要求承建单位提交系统部署计划'], answer: 'D', explanation: '文档中“编码及测试的监理”部分明确列出了编码规范的要求，包括遵循流程、目标明确、可读性强、易于使用维护、可扩展性好。D选项“提交系统部署计划”属于“系统部署的监理”内容。' },
            { id: 22008, chapter: 22, group: 'theory', text: '关于“系统部署的监理”，以下哪项描述是正确的？', options: ['A、应在系统部署之后，再审查软件产品是否具备集成条件', 'B、部署文档不需要包含安装后的软件检验过程', 'C、监理需审核已部署系统与承建合同及系统需求的一致性', 'D、部署工作无需监理单位提出监理意见'], answer: 'C', explanation: '文档中“系统部署的监理”明确指出：部署前应审查产品是否具备条件；部署文档应包含安装后的软件检验；监理需审核已部署系统并提出意见，审核要点包括与合同、需求的一致性等。因此C正确。' },
            { id: 22009, chapter: 22, group: 'theory', text: '在“验收阶段”的“项目初验”中，以下哪项不是初验应满足的条件？', options: ['A、软件产品已纳入配置管理并可交付', 'B、已提交承建合同规定的项目文档', 'C、软件系统已通过测试', 'D、承建单位已提交最终工程结算'], answer: 'D', explanation: '文档中“项目初验的监理”部分明确列出了初验条件：产品可交付、文档已提交、系统已通过测试。D选项“提交最终工程结算”属于“项目终验的监理”中的工作内容。' },
            { id: 22010, chapter: 22, group: 'theory', text: '根据“软件工程项目三方文档清单”，以下哪份文档通常由“监理单位”负责编制和归档？', options: ['A、项目立项文档', 'B、需求规格说明书', 'C、工程监理总结报告', 'D、用户手册'], answer: 'C', explanation: '根据表22-5“软件工程项目三方文档清单”，“工程监理总结报告”明确列在“监理单位文档”类别下。A属于业主单位文档，B和D属于承建单位文档。' },
            { id: 22011, chapter: 22, group: 'theory', text: '在软件工程监理的“概述”部分，将硬件、软件、操作人员看作一个整体进行的测试被称为？', options: ['A、单元测试', 'B、集成测试', 'C、系统测试', 'D、验收测试'], answer: 'C', explanation: '文档“概述”部分明确定义：系统测试是对整套系统的测试，将硬件、软件、操作人员看作一个整体。单元测试针对最小单元，集成测试针对模块组装，验收测试是交付测试。' },
            { id: 22012, chapter: 22, group: 'theory', text: '在“设计阶段监理内容”中，审核项目计划时，以下哪项不是主要的审核准则？', options: ['A、与承建合同的一致性、可追溯性', 'B、项目进度的合理性，包括质量保证计划', 'C、对项目风险有必要的识别、分析、处理和跟踪', 'D、代码的可读性和可维护性'], answer: 'D', explanation: '文档中设计阶段审核项目计划的准则包括：合同一致性、里程碑合理性、进度合理性（含质量保证计划等）、风险识别处理。代码可读性是实施阶段编码监理的内容。' },
            { id: 22013, chapter: 22, group: 'theory', text: '根据“需求规格说明书检查表”，检查“是否包含了接口需求”主要归属于以下哪个检查类目？', options: ['A、完整性', 'B、清晰性', 'C、可行性', 'D、依从性'], answer: 'A', explanation: '在“检查类目”下明确列出：“是否包含接口需求”是检查需求规格说明书是否“完整、清晰、准确地反映用户要求”的一部分，因此属于“完整性”范畴。' },
            { id: 22014, chapter: 22, group: 'theory', text: '在“概要(结构)设计检查表”中，检查“这些模块是否具有高内聚度和低耦合度”是为了评估设计的？', options: ['A、功能性', 'B、可维护性', 'C、性能', 'D、可靠性'], answer: 'B', explanation: '文档表22-3中，“可维护性”类目的检查内容明确包括：“该设计是否是模块化的”以及“这些模块是否具有高内聚度和低耦合度”。' },
            { id: 22015, chapter: 22, group: 'theory', text: '关于“详细设计的监理”，监理在评价时应遵守的准则不包括？', options: ['A、与概要(结构)设计的一致性', 'B、测试的可行性、完备性', 'C、软件运行和维护的可行性', 'D、用户培训计划的完备性'], answer: 'D', explanation: '文档中明确列出了详细设计监理的准则：与概要设计的一致性、测试的可行性/完备性、运行维护的可行性、压力测试对指标的验证。用户培训计划属于验收和移交阶段的内容。' },
            { id: 22016, chapter: 22, group: 'theory', text: '在软件工程中，“对软件中的最小可测试单元进行检查和验证”被称为？', options: ['A、单元测试', 'B、集成测试', 'C、系统测试', 'D、验收测试'], answer: 'A', explanation: '文档“概述”部分明确定义：单元测试是对软件中的最小可测试单元进行检查和验证。' },
            { id: 22017, chapter: 22, group: 'theory', text: '“设计阶段的需求管理”活动中，不包括以下哪一项？', options: ['A、需求获取', 'B、需求分析', 'C、需求规格编写', 'D、代码走查'], answer: 'D', explanation: '文档中明确说明：设计阶段的需求管理包括：需求获取、需求分析、需求规格编写和需求验证。代码走查属于实施阶段的代码审查活动。' },
            { id: 22018, chapter: 22, group: 'theory', text: '在“系统部署的监理”工作中，部署文档不应包含以下哪项内容？', options: ['A、系统安装', 'B、安装后的软件检验', 'C、对操作手册和用户手册中的过程进行演练性运行', 'D、项目立项文档'], answer: 'D', explanation: '文档中明确列出了部署文档应包含的内容：系统安装、安装后的软件检验、对手册进行演练性运行。项目立项文档是业主单位在项目启动前准备的文档，不属于部署文档。' },
            { id: 22019, chapter: 22, group: 'theory', text: '在“项目初验的监理”工作中，评价系统满足要求的程度时，不包括以下哪项？', options: ['A、与承建合同的一致性', 'B、与系统需求的一致性', 'C、与预期结果的符合性', 'D、承建单位的利润率'], answer: 'D', explanation: '文档中明确列出了初验时的评价要点：与合同、系统需求、预期结果、业务需求、运行环境、运行维护可行性的一致性。承建单位的利润率属于商业信息，与系统功能验收无直接关系。' },
            { id: 22020, chapter: 22, group: 'theory', text: '根据“软件工程项目三方文档清单”，以下哪份文档通常由“承建单位”负责编制？', options: ['A、项目立项文档', 'B、批复文件', 'C、工程招标文件', 'D、用户手册'], answer: 'D', explanation: '根据表22-5，用户手册明确列在“承建单位文档”类别下。A、B、C三项均属于“业主单位文档”。' },
            { id: 22021, chapter: 22, group: 'theory', text: '在“验收阶段”的“项目终验的监理”工作中，以下哪项不是其主要工作内容？', options: ['A、协助业主单位确认是否满足终验条件', 'B、审核承建单位提交的终验方案', 'C、参与终验，签署终验报告', 'D、直接修改代码以修复验收发现的问题'], answer: 'D', explanation: '文档中“项目终验的监理”工作包括确认条件、审核方案、参与终验、督促问题解决、审核文档和结算、完成监理报告等。监理单位负责督促和审核，不应直接修改代码，这是承建单位的职责。' },
            { id: 22022, chapter: 22, group: 'theory', text: '根据软件工程监理阶段划分，“合同签订的监理”活动主要归属于哪个阶段？', options: ['A、规划阶段', 'B、招标阶段', 'C、设计阶段', 'D、实施阶段'], answer: 'B', explanation: '根据表22-1“软件工程监理过程说明”，招标阶段的监理活动包括：招标准备的监理；招标的监理；合同签订的监理。' },
            { id: 22023, chapter: 22, group: 'theory', text: '在“需求规格说明书检查表”中，检查“需求说明书是否与相关需求素材一致”主要关注的是？', options: ['A、清晰性', 'B、一致性', 'C、可行性', 'D、可管理性'], answer: 'B', explanation: '文档中“一致性”检查类目下明确包括：“需求说明书是否与相关需求素材一致”。' },
            { id: 22024, chapter: 22, group: 'theory', text: '对于“概要(结构)设计”，检查“主要性能参数是否已被详细说明”是为了评估设计的？', options: ['A、性能', 'B、可靠性', 'C、易测性', 'D、可追溯性'], answer: 'A', explanation: '文档表22-3中，“性能”类目的检查内容明确包括：“主要性能参数是否已被详细说明”。' }
        ];
        // ★★★ 第23节 数据中心工程监理（40题）★★★
        const CHAPTER_23 = [
            { id: 23001, chapter: 23, group: 'theory', text: '在数据中心工程中，“设计单位将已通过评审的施工图向承建单位进行详细说明的技术活动”被称为？', options: ['A、深化设计', 'B、上电自检', 'C、设计交底', 'D、资源规划'], answer: 'C', explanation: '讲义“概述”部分明确定义：设计交底是设计单位将施工图向承建单位说明的技术活动。' },
            { id: 23002, chapter: 23, group: 'theory', text: '以下哪项不属于数据中心电子设备机房的主要建设任务？', options: ['A、供配电系统工程', 'B、空调系统工程', 'C、消防系统工程', 'D、应用软件开发'], answer: 'D', explanation: '讲义“电子设备机房”部分列出了6大系统工程：供配电、空调、消防、安全防范、环境、动力环境监控。应用软件开发属于信息系统软硬件范畴，不是机房基础设施工程。' },
            { id: 23003, chapter: 23, group: 'theory', text: '数据中心“信息资源规划”的步骤中，“对数据进行分析、筛选、整合、归并等技术论证”属于哪个阶段？', options: ['A、应用数据资源规划', 'B、数据信息资源规划', 'C、保障数据资源规划', 'D、业务需求规划'], answer: 'B', explanation: '讲义明确说明：数据信息资源规划是对数据进行分析、筛选、整合、归并等技术论证。' },
            { id: 23004, chapter: 23, group: 'theory', text: '在数据中心人员角色中，“利用大数据技术对信息资源进行科学分析、挖掘、展现，用于决策支持”的是？', options: ['A、数据研发工程师', 'B、应用开发工程师', 'C、大数据分析工程师', 'D、数据中心管理员'], answer: 'C', explanation: '讲义“主要人员的角色、职能”部分明确界定：大数据分析工程师负责利用大数据技术进行分析、挖掘、展现，用于决策支持。' },
            { id: 23005, chapter: 23, group: 'theory', text: '数据中心招标阶段，监理审核“投标单位资质要求的合规性”属于以下哪个方面的审核要点？', options: ['A、招标方式符合性', 'B、投标单位资质要求', 'C、招标文件获取时间', 'D、工程质量要求'], answer: 'B', explanation: '讲义“招标文件的审核要点”中明确将“审核投标单位资质要求的合规性”作为独立的一项审核内容。' },
            { id: 23006, chapter: 23, group: 'theory', text: '在数据中心设计阶段监理中，审核“承建单位核心人员岗位职责与合同约定的一致性”属于哪项工作的内容？', options: ['A、深化设计方案审核', 'B、开工申请的审核', 'C、施工计划的监理', 'D、规章制度管理'], answer: 'B', explanation: '讲义“开工申请的审核”部分明确包括：承建单位核心人员岗位职责与合同约定的一致性。' },
            { id: 23007, chapter: 23, group: 'theory', text: '数据中心设计需求分析中，监理机构审核的要点不包括以下哪项？', options: ['A、最大化地适应业务需求的高可用性', 'B、准确数据挖掘的高可靠性', 'C、承建单位利润率最大化', 'D、高效节约、绿色低排放的建设方案'], answer: 'C', explanation: '讲义“监理中心设计需求分析审核要点”包括高可用性、高可靠性、高效节约、适宜运维策略等，不涉及承建单位的利润率。' },
            { id: 23008, chapter: 23, group: 'theory', text: '在数据中心实施阶段，关于“实施方案的审核”，监理不需关注以下哪项？', options: ['A、到货日程安排是否符合工程实际要求', 'B、软硬件到货清单是否符合合同要求', 'C、到货验收手续清单及预定结论是否妥当', 'D、承建单位的内部财务审计报告'], answer: 'D', explanation: '讲义“实施方案的审核”包括到货日程、清单符合性、验收技术要求、验收手续等。承建单位内部财务审计与工程实施的技术管理无直接关系。' },
            { id: 23009, chapter: 23, group: 'theory', text: '数据中心实施阶段的“施工检测”中，信息网络系统的检测部位通常是？', options: ['A、关键工作流程的核心节点', 'B、数据中心机房核心交换机机柜', 'C、用户视图与数据流', 'D、人员的岗位职责'], answer: 'B', explanation: '讲义明确说明：信息网络系统的施工检测部位如数据中心机房核心交换机机柜。' },
            { id: 23010, chapter: 23, group: 'theory', text: '在数据中心信息资源(数据)监理中，“主体项目检测内容”不包括？', options: ['A、用户视图与数据流', 'B、数据接口规范', 'C、系统调试、试运行情况', 'D、数据表的物理存储设计'], answer: 'D', explanation: '讲义明确列出信息资源监理的主体项目检测内容包括：用户视图与数据流、数据接口规范。系统调试、试运行属于一般项目检测内容。' },
            { id: 23011, chapter: 23, group: 'theory', text: '对数据中心人员及相关规章制度的检查，通常通过什么方式来实际查看应急响应能力？', options: ['A、书面考试', 'B、预案应急响应', 'C、日常考勤', 'D、设备操作熟练度测试'], answer: 'B', explanation: '讲义在“人员及规章制度监理”部分特别注明：通过“预案应急响应”方式来实际查看被考核人员对事故“应急处理”的响应程度。' },
            { id: 23012, chapter: 23, group: 'theory', text: '监理记录中，“据实记录现场巡查情况，针对发现的问题提出改进措施”属于哪部分内容？', options: ['A、项目当前情况', 'B、项目巡查情况', 'C、会议情况', 'D、归档要求'], answer: 'B', explanation: '讲义“监理记录要求”中明确说明：项目巡查情况要据实记录现场巡查情况，针对发现的问题提出改进措施。' },
            { id: 23013, chapter: 23, group: 'theory', text: '根据实施阶段监理流程，在“到货验收与安装调试”环节，承建单位需要提交以下哪项文件？', options: ['A、测试计划', 'B、用户操作手册', 'C、计算机系统软硬件报验单', 'D、监理工作总结报告'], answer: 'C', explanation: '讲义图23-3实施阶段监理流程明确显示：“计算机系统软硬件报验单、安装配置计划”是“到货验收与安装调试”环节的输入文件。' },
            { id: 23014, chapter: 23, group: 'theory', text: '在验收阶段，工程验收前必须满足的条件不包括以下哪项？', options: ['A、完成调试及自检，并出具系统自检记录', 'B、完成系统试运行，并出具系统试运行报告', 'C、完成技术培训，并出具培训记录', 'D、承建单位已获得所有知识产权专利'], answer: 'D', explanation: '讲义明确列出了验收前应满足的6个条件，包括完成施工、自检、试运行、检测、培训等。获得所有知识产权专利不是验收的必要条件。' },
            { id: 23015, chapter: 23, group: 'theory', text: '在验收阶段监理流程中，“初验报告”是在哪个环节产生的输出文件？', options: ['A、系统初验', 'B、试运行', 'C、系统终验', 'D、工程交付'], answer: 'A', explanation: '讲义图23-4验收阶段监理流程明确显示：“系统初验”环节审核通过后，输出“初验报告”。' },
            { id: 23016, chapter: 23, group: 'theory', text: '数据中心工程中，负责“参与数据中心网络的架构设计、建设，负责其日常维护、优化”的主要角色是？', options: ['A、大数据分析工程师', 'B、数据研发工程师', 'C、应用开发工程师', 'D、数据中心管理员'], answer: 'D', explanation: '讲义“主要人员的角色、职能”部分明确说明：数据中心管理员职责包括参与架构设计、建设，负责日常维护、优化。' },
            { id: 23017, chapter: 23, group: 'theory', text: '在招标阶段，监理审核“合同范围、权利和义务的描述与招标文件的一致性”属于哪项监理工作？', options: ['A、招标文件的审核', 'B、承建单位合同的审核', 'C、监理流程的制定', 'D、投标保证金的审核'], answer: 'B', explanation: '讲义在“承建单位合同”部分明确列出：审核合同范围、权利和义务的描述与招标文件的一致性。' },
            { id: 23018, chapter: 23, group: 'theory', text: '设计阶段监理中，审核“施工计划中各项工作应衔接紧密、前后一致、时间可控”属于哪项监理内容？', options: ['A、规章制度管理', 'B、开工申请审核', 'C、深化设计方案审核', 'D、施工计划的监理'], answer: 'D', explanation: '讲义“施工计划的监理”部分明确包括：施工计划中各项工作应衔接紧密、前后一致、时间可控。' },
            { id: 23019, chapter: 23, group: 'theory', text: '在实施阶段监理流程中，“测试计划/方案报告评审表”是哪个环节的输出文件？', options: ['A、到货验收与安装调试', 'B、系统调试', 'C、用户培训', 'D、工程初验'], answer: 'B', explanation: '讲义图23-3实施阶段监理流程明确显示：“系统调试”环节中，监理单位审查测试计划后，输出“测试计划/方案报告评审表”。' },
            { id: 23020, chapter: 23, group: 'theory', text: '监理单位在验收阶段撰写的“工作总结报告”中，一般不包括以下哪项内容？', options: ['A、项目建设总体完成情况', 'B、项目资金到位及使用情况', 'C、监理人员的个人薪酬明细', 'D、竣工决算情况'], answer: 'C', explanation: '讲义明确列出了监理工作总结报告应包含的内容：项目建设总体情况、资金情况、变更情况、档案情况、决算情况。监理人员个人薪酬属于内部管理信息，不应包含在向业主提交的工程总结报告中。' },
            { id: 23021, chapter: 23, group: 'theory', text: '在数据中心信息资源规划中，“确定应用类别，按照业务功能逻辑性形成资源应用链”属于哪个步骤？', options: ['A、应用数据资源规划', 'B、数据信息资源规划', 'C、保障数据资源规划', 'D、业务需求规划'], answer: 'A', explanation: '讲义明确说明：应用数据资源规划是确定应用类别，按照业务功能逻辑性形成资源应用链，归整成不同信息资源应用域。' },
            { id: 23022, chapter: 23, group: 'theory', text: '数据研发工程师通常不包括以下哪种角色？', options: ['A、数据挖掘工程师', 'B、数据算法工程师', 'C、数据安全研究工程师', 'D、数据库管理员'], answer: 'D', explanation: '讲义明确说明：数据研发工程师通常分为数据挖掘工程师、数据算法工程师和数据安全研究工程师三种角色。' },
            { id: 23023, chapter: 23, group: 'theory', text: '在招标阶段监理中，审核“投标保证金、履约保证金约定的合理性”属于哪方面的审核？', options: ['A、招标方式符合性', 'B、投标单位资质要求', 'C、保证金约定', 'D、工程质量要求'], answer: 'C', explanation: '讲义“招标文件的审核要点”中明确将“审核投标保证金、履约保证金约定的合理性”作为独立的审核内容。' },
            { id: 23024, chapter: 23, group: 'theory', text: '设计阶段监理中，审核“各方质量保证体系落实与生效的制度”属于哪项监理内容？', options: ['A、规章制度管理制度体系', 'B、开工申请的审核', 'C、深化设计方案审核', 'D、施工计划的监理'], answer: 'A', explanation: '讲义“规章制度管理制度体系”部分明确包括审核“各方质量保证体系落实与生效的制度”。' },
            { id: 23025, chapter: 23, group: 'theory', text: '在深化设计方案审核中，不需要关注以下哪项？', options: ['A、施工方案与合同要求的一致性', 'B、工程质量技术保障措施', 'C、设计变更与技术核定的一致性', 'D、承建单位的财务报表'], answer: 'D', explanation: '讲义“深化设计方案和图纸的审核”包括施工方案一致性、质量保障措施、设计变更一致性等，不涉及承建单位的财务报表。' },
            { id: 23026, chapter: 23, group: 'theory', text: '数据中心设计方案评审要点中，强调“以‘发现问题→分析问题→解决问题→关闭问题’的闭环思路”是为了保证设计方案的？', options: ['A、架构清晰', 'B、基于科学', 'C、基于可靠数据', 'D、完整性'], answer: 'D', explanation: '讲义明确说明：设计方案应具备完整性，宜以“发现问题→分析问题→解决问题→关闭问题”的闭环思路进行表述。' },
            { id: 23027, chapter: 23, group: 'theory', text: '在实施阶段，对“软硬件设备资产的审核”中，不包括以下哪项？', options: ['A、资产清单台账与实际状况的一致性', 'B、设备资产入库手续的合规性', 'C、资产标识的规范性', 'D、设备采购人员的学历背景'], answer: 'D', explanation: '讲义“软硬件设备资产的审核”包括资产清单一致性、入库手续合规性、资产标识规范性等，不涉及采购人员的学历背景。' },
            { id: 23028, chapter: 23, group: 'theory', text: '信息应用系统的施工检测中，“主体项目检测内容”包括？', options: ['A、应用软件功能和性能测试', 'B、网络设备安装', 'C、检测的频次数目', 'D、设备中无关软件检查'], answer: 'A', explanation: '讲义明确说明：信息应用系统的主体项目检测内容包括应用软件功能和性能测试、应用软件修改后的回归测试。' },
            { id: 23029, chapter: 23, group: 'theory', text: '在监理记录要求中，“据实记录各种与所记录事件有关的会议的重点内容、决议等”属于？', options: ['A、项目当前情况', 'B、项目巡查情况', 'C、会议情况', 'D、归档要求'], answer: 'C', explanation: '讲义“监理记录要求”中明确说明：会议情况要据实记录各种与所记录事件有关的会议的重点内容、决议等。' },
            { id: 23030, chapter: 23, group: 'theory', text: '根据实施阶段监理流程，在“用户培训”环节，承建单位需要提交以下哪项文件？', options: ['A、测试计划', 'B、用户操作手册', 'C、计算机系统软硬件报验单', 'D、到货验收单'], answer: 'B', explanation: '讲义图23-3实施阶段监理流程明确显示：“用户操作手册、用户安装手册、管理员手册”是“用户培训”环节的输入文件。' },
            { id: 23031, chapter: 23, group: 'theory', text: '在验收阶段监理流程中，“试运行评审表”是在哪个环节产生的？', options: ['A、系统初验', 'B、试运行', 'C、系统终验', 'D、工程交付'], answer: 'B', explanation: '讲义图23-4验收阶段监理流程明确显示：“试运行”环节审核通过后，输出“试运行评审表”。' },
            { id: 23032, chapter: 23, group: 'theory', text: '数据中心管理员的职责不包括？', options: ['A、参与数据中心网络架构设计', 'B、负责日常维护优化', 'C、进行大数据分析挖掘', 'D、参与数据中心建设'], answer: 'C', explanation: '讲义明确说明：数据中心管理员职责包括参与架构设计、建设，负责日常维护优化。大数据分析挖掘是大数据分析工程师的职责。' },
            { id: 23033, chapter: 23, group: 'theory', text: '在招标阶段，审核“实施工艺、工序及验收指标的合规性”属于哪项监理工作？', options: ['A、招标文件的审核', 'B、承建单位合同的审核', 'C、监理流程的制定', 'D、投标保证金的审核'], answer: 'B', explanation: '讲义在“承建单位合同”部分明确列出：审核实施工艺、工序及验收指标的合规性。' },
            { id: 23034, chapter: 23, group: 'theory', text: '设计阶段监理中，审核“承建单位进场人员的安全和保密承诺与开工条件的符合性”属于？', options: ['A、规章制度管理', 'B、开工申请审核', 'C、深化设计方案审核', 'D、施工计划的监理'], answer: 'B', explanation: '讲义“开工申请的审核”部分明确包括：承建单位进场人员的安全和保密承诺与开工条件的符合性。' },
            { id: 23035, chapter: 23, group: 'theory', text: '在实施阶段监理流程中，“监理日志”是哪个环节的输出文件？', options: ['A、到货验收与安装调试', 'B、系统调试', 'C、用户培训', 'D、工程初验'], answer: 'A', explanation: '讲义图23-3实施阶段监理流程明确显示：“到货验收与安装调试”环节中，监理单位审查后输出“监理日志”。' },
            { id: 23036, chapter: 23, group: 'theory', text: '信息资源规划中，“满足各阶段业务用户对远程访问和可视展示的智能化展示、安全管理等要求”属于？', options: ['A、应用数据资源规划', 'B、数据信息资源规划', 'C、保障数据资源规划', 'D、业务需求规划'], answer: 'C', explanation: '讲义明确说明：保障数据资源规划是满足各阶段业务用户对远程访问和可视展示的智能化展示、安全管理等要求。' },
            { id: 23037, chapter: 23, group: 'theory', text: '在数据中心人员中，“基于业务需求，将信息资源以再集成、可视化图表等形式展示给业务用户”的是？', options: ['A、大数据分析工程师', 'B、数据研发工程师', 'C、应用开发工程师', 'D、数据中心管理员'], answer: 'C', explanation: '讲义明确说明：应用开发工程师基于业务需求，在数据分析基础上，将信息资源以再集成、可视化图表等形式展示给业务用户。' },
            { id: 23038, chapter: 23, group: 'theory', text: '设计阶段监理中，审核“施工计划中的项目确定投资额、工程量等均能落实”是为了保证施工计划的？', options: ['A、衔接紧密', 'B、投资工程量落实', 'C、进度合理性', 'D、可行性'], answer: 'B', explanation: '讲义“施工计划的监理”部分明确包括：施工计划中的项目确定投资额、工程量等均能落实。' },
            { id: 23039, chapter: 23, group: 'theory', text: '在实施阶段，“功能检测·性能检测·安全检测”属于哪方面的内容？', options: ['A、实施方案的审核', 'B、施工检测', 'C、软硬件设备资产审核', 'D、信息资源监理'], answer: 'B', explanation: '讲义明确说明：施工检测包括功能检测、性能检测、安全检测。' },
            { id: 23040, chapter: 23, group: 'theory', text: '验收阶段监理中，“协助业主单位组织验收”的前提是？', options: ['A、按照承建合同的要求', 'B、按照监理单位的偏好', 'C、按照承建单位的建议', 'D、按照最新技术趋势'], answer: 'A', explanation: '讲义明确说明：按照承建合同的要求和施工的实际情况，协助业主单位组织验收。' }
        ];

        // ★★★ 第24节 信息安全监理（40题）★★★
        const CHAPTER_24 = [
            { id: 24001, chapter: 24, group: 'theory', text: '在信息安全监理的规划设计阶段，以下哪项不属于主要监理任务？', options: ['A、配合进行安全风险评估，形成安全需求', 'B、配合完成网络安全等级保护方案编制', 'C、直接进行安全设备的安装调试', 'D、协助开展关键信息基础设施分析识别工作'], answer: 'C', explanation: '讲义表“信息安全监理阶段划分及监理任务”中，规划设计阶段任务包括风险评估、等级保护方案编制、关键信息基础设施识别等。设备安装调试属于实施阶段工作。' },
            { id: 24002, chapter: 24, group: 'theory', text: '在安全风险评估中，“对预期信息系统进行细致周密的脆弱性和威胁分析”的主要目的是？', options: ['A、确定资产价值', 'B、发现脆弱点及可能造成的损失', 'C、进行风险优先级排序', 'D、形成安全措施需求清单'], answer: 'B', explanation: '讲义明确说明：脆弱性和威胁分析是为了发现系统的脆弱点及所引发的威胁被利用后所造成的损失。' },
            { id: 24003, chapter: 24, group: 'theory', text: '关于网络安全等级保护方案审核，以下哪项不属于“特殊安全需求分析”的内容？', options: ['A、全面了解等级保护对象的范围和边界', 'B、分析重要资产的特殊保护要求', 'C、确定可能的安全风险', 'D、形成需求分析报告'], answer: 'A', explanation: '讲义明确说明：“全面了解等级保护对象，明确范围和边界”属于“基本安全需求分析”，而“分析重要资产特殊保护要求，确定安全风险”属于“特殊安全需求分析”。' },
            { id: 24004, chapter: 24, group: 'theory', text: '商用密码应用系统建设方案中，“管理制度、人员管理、建设运行和应急处置”属于？', options: ['A、技术方案', 'B、管理方案', 'C、物理方案', 'D、环境方案'], answer: 'B', explanation: '讲义明确说明：商用密码应用方案包含技术方案和管理方案，其中管理方案包括信息系统的管理制度、人员管理、建设运行和应急处置。' },
            { id: 24005, chapter: 24, group: 'theory', text: '在现阶段信息系统工程实践中，最常见的商用密码应用等级是？', options: ['A、一级', 'B、二级', 'C、三级', 'D、四级'], answer: 'C', explanation: '讲义明确说明：在现阶段信息系统工程实践中，信息系统以三级安全防护能力要求最为常见。' },
            { id: 24006, chapter: 24, group: 'theory', text: '招标阶段监理工作中，以下哪项不属于“承建合同监理”的内容？', options: ['A、信息安全建设内容与投标文件一致性', 'B、包括适用的保密条款和安全责任条款', 'C、包括项目验收和安全测评标准', 'D、直接修改合同中的技术参数'], answer: 'D', explanation: '讲义“承建合同监理”包括内容一致性、保密条款、验收标准、变更处理方法等。监理负责审核，不应直接修改合同技术参数。' },
            { id: 24007, chapter: 24, group: 'theory', text: '在设计阶段监理中，“安全产品采购和使用符合国家有关规定”属于哪方面的审核？', options: ['A、体系结构设计的审核', 'B、详细设计的审核', 'C、深化设计方案的审核', 'D、项目实施方案的审核'], answer: 'B', explanation: '讲义“详细设计的审核”部分明确包括：安全产品采购和使用符合国家有关规定。' },
            { id: 24008, chapter: 24, group: 'theory', text: '深化设计阶段中，“技术措施实现方案”不包括以下哪项？', options: ['A、网络安全产品服务采购', 'B、安全控制的定制开发', 'C、安全管理制度的建设修订', 'D、安全控制集成'], answer: 'C', explanation: '讲义明确说明：技术措施实现方案包括安全产品采购、安全控制定制开发、安全控制集成。安全管理制度的建设修订属于管理措施实现方案。' },
            { id: 24009, chapter: 24, group: 'theory', text: '在实施阶段的安全设备验收中，以下哪项不是必需的？', options: ['A、设备类型和数量与到货清单一致', 'B、安全设备具有公安部颁发的销售许可证', 'C、设备价格低于市场平均价', 'D、设备符合安全设计方案的功能性能要求'], answer: 'C', explanation: '讲义“安全设备验收”包括清单一致性、销售许可证、功能性能符合性等。设备价格不是技术验收的必要条件。' },
            { id: 24010, chapter: 24, group: 'theory', text: '等级测评过程中，“测评对象确定，测评指标确定，测评内容确定”属于哪个活动？', options: ['A、测评准备活动', 'B、方案编制活动', 'C、现场测评活动', 'D、报告编制活动'], answer: 'B', explanation: '讲义表24-2明确说明：方案编制活动包括测评对象确定、测评指标确定、测评内容确定等。' },
            { id: 24011, chapter: 24, group: 'theory', text: '在验收阶段的系统测试审查中，“用户身份鉴别、访问控制、安全审计”属于对什么的审查？', options: ['A、系统安全功能', 'B、系统安全性能', 'C、系统可用性', 'D、密码算法强度'], answer: 'A', explanation: '讲义明确说明：系统安全功能包括用户身份鉴别、访问控制、安全审计、数据存储和传输加密等。' },
            { id: 24012, chapter: 24, group: 'theory', text: '关于信息安全合规性要求，以下说法正确的是？', options: ['A、风险评估只需在系统设计阶段进行', 'B、等级保护遵循“谁主管谁负责”原则', 'C、技术体系应避免深度防御原则', 'D、应急管理只需在系统上线时演练一次'], answer: 'B', explanation: '讲义明确说明：等级保护应按照“谁主管谁负责、谁运营谁负责、谁使用谁负责”的要求落实责任主体。' },
            { id: 24013, chapter: 24, group: 'theory', text: '在物理安全关键技术要求中，机房场地应避免设在何处？', options: ['A、建筑物中层且独立区域', 'B、建筑物高层或地下室', 'C、靠近办公区方便维护', 'D、建筑物顶层视野开阔'], answer: 'B', explanation: '讲义明确要求：机房场地应避免设在建筑物的高层或地下室，以及用水设备的下层或隔壁。' },
            { id: 24014, chapter: 24, group: 'theory', text: '关于网络安全的技术要求，以下哪项描述是正确的？', options: ['A、各种服务器宜放置在开放办公区', 'B、防火墙不需要通过国家安全测评认证', 'C、关键网络设备业务处理能力应具备冗余空间', 'D、网络边界处不需要部署访问控制设备'], answer: 'C', explanation: '讲义明确要求：关键网络设备的业务处理能力具备冗余空间，满足网络各个部分业务高峰期需要。' },
            { id: 24015, chapter: 24, group: 'theory', text: '在网络设备防护中，“应对登录网络设备的用户进行身份鉴别”是为了保证？', options: ['A、结构安全', 'B、访问控制', 'C、安全审计', 'D、边界完整性'], answer: 'B', explanation: '讲义“网络设备防护”部分明确包括：应对登录网络设备的用户进行身份鉴别，这属于访问控制范畴。' },
            { id: 24016, chapter: 24, group: 'theory', text: '对于等级保护第三级以上系统，数据备份的要求是？', options: ['A、完全数据备份至少每周一次', 'B、不需要异地数据备份', 'C、完全数据备份至少每天一次', 'D、只需要本地数据备份'], answer: 'C', explanation: '讲义明确要求：等级保护第三级以上系统，应提供本地数据备份、异地数据备份与恢复功能，完全数据备份至少每天一次。' },
            { id: 24017, chapter: 24, group: 'theory', text: '在深化设计阶段监理中，承建单位不需要检查以下哪项？', options: ['A、机房出入口门禁系统', 'B、机房防盗报警系统', 'C、机柜接地系统', 'D、办公区空调功率'], answer: 'D', explanation: '讲义“深化设计方案的审核”部分要求承建单位检查机房出入口门禁、防盗报警、机柜接地系统等。办公区空调功率不属于安全相关的必要检查项。' },
            { id: 24018, chapter: 24, group: 'theory', text: '信息安全监理的测试评估阶段，监理的主要任务不包括？', options: ['A、核查安全测评报告结论', 'B、整理监理档案', 'C、直接进行安全测评', 'D、协助编制验收方案'], answer: 'C', explanation: '讲义明确说明：测试评估阶段监理任务包括核查报告、整理档案、协助编制验收方案等。直接进行安全测评应由专业检测机构完成。' },
            { id: 24019, chapter: 24, group: 'theory', text: '关于商用密码应用技术方案，应体现的密码安全功能维度不包括？', options: ['A、机密性', 'B、完整性', 'C、可用性', 'D、不可否认性'], answer: 'C', explanation: '讲义明确说明：商用密码应用技术方案应体现机密性、完整性、真实性、不可否认性四个密码安全功能维度。可用性不是密码技术直接提供的安全功能。' },
            { id: 24020, chapter: 24, group: 'theory', text: '在实施阶段的工程安全管理中，以下哪项是必要的？', options: ['A、督促承建单位指定专人负责安全管理', 'B、允许未经审查的施工人员进场', 'C、确保实施过程可以偏离实施方案', 'D、不需要进行安全意识教育'], answer: 'A', explanation: '讲义“工程实施中的安全管理”明确要求：督促承建单位指定或授权专门的部门和人员负责工程实施过程的安全管理。' },
            { id: 24021, chapter: 24, group: 'theory', text: '在等级测评的“测评准备活动”中，以下哪项不属于主要工作任务？', options: ['A、工作启动', 'B、信息收集和分析', 'C、工具和表单准备', 'D、单项测评结果判定'], answer: 'D', explanation: '讲义表24-2明确说明：测评准备活动包括工作启动、信息收集分析、工具表单准备。单项测评结果判定属于报告编制活动的工作。' },
            { id: 24022, chapter: 24, group: 'theory', text: '关于商用密码应用系统建设方案的审核要求，第三级以上（含）方案应如何处理？', options: ['A、承建单位自行审批即可', 'B、监理单位审批即可', 'C、通过密码管理部门的评审后方可实施', 'D、不需要特殊审批流程'], answer: 'C', explanation: '讲义明确要求：第三级以上(含)的商用密码应用系统建设方案应通过密码管理部门的评审后方可实施。' },
            { id: 24023, chapter: 24, group: 'theory', text: '在物理安全要求中，关于机房区域划分的要求是什么？', options: ['A、区域之间不需要隔离', 'B、区域和区域之间设置物理隔离装置', 'C、重要区域不需要门禁系统', 'D、机房各区应完全开放'], answer: 'B', explanation: '讲义明确要求：应对机房进行区域划分，区域和区域之间设置物理隔离装置；重要区域配置电子门禁系统。' },
            { id: 24024, chapter: 24, group: 'theory', text: '对于网络安全的“结构安全”要求，以下哪项描述是正确的？', options: ['A、关键设备业务处理能力不需要冗余', 'B、不需要考虑业务高峰期需求', 'C、按照业务重要次序分配优先级别', 'D、核心交换机不需要启用QoS策略'], answer: 'C', explanation: '讲义明确要求：按照业务的重要次序来分配优先级别，在核心交换机或边界设备上启用QoS策略。' },
            { id: 24025, chapter: 24, group: 'theory', text: '在“网络设备防护”技术要求中，关于用户标识的要求是？', options: ['A、多个管理员可共用同一账号', 'B、网络设备的管理用户标识应具有唯一性', 'C、不需要身份鉴别', 'D、登录失败不需要处理'], answer: 'B', explanation: '讲义明确要求：应对登录网络设备的用户进行身份鉴别，网络设备的管理用户标识应具有唯一性。' },
            { id: 24026, chapter: 24, group: 'theory', text: '关于“边界完整性检查”的要求，主要目的是？', options: ['A、监视端口扫描行为', 'B、对内部用户私自联到外部网络的行为进行检查和阻断', 'C、部署网络反病毒设备', 'D、记录用户行为日志'], answer: 'B', explanation: '讲义明确说明：边界完整性要求对内部网络用户私自联到外部网络的行为进行检查，并对其进行有效阻断。' },
            { id: 24027, chapter: 24, group: 'theory', text: '在数据安全要求中，对于等级保护第三级以上系统，备份策略要求是？', options: ['A、不需要数据备份', 'B、只需要本地备份', 'C、提供本地和异地数据备份与恢复功能', 'D、备份周期至少每周一次'], answer: 'C', explanation: '讲义明确要求：等级保护第三级以上系统，应提供本地数据备份、异地数据备份与恢复功能，完全数据备份至少每天一次。' },
            { id: 24028, chapter: 24, group: 'theory', text: '在深化设计阶段，监理审核实施方案时，技术措施实现方案不包括？', options: ['A、网络安全产品服务采购', 'B、安全控制的定制开发', 'C、安全管理制度的修订', 'D、安全控制集成'], answer: 'C', explanation: '讲义明确说明：技术措施实现方案包括安全产品采购、安全控制定制开发、安全控制集成。安全管理制度的修订属于管理措施实现方案。' },
            { id: 24029, chapter: 24, group: 'theory', text: '关于信息安全应急管理的要求，以下说法正确的是？', options: ['A、应急预案只需制定一次', 'B、不需要进行演练', 'C、定期进行培训、演练和修订', 'D、应急管理不是必须的'], answer: 'C', explanation: '讲义明确要求：定期进行应急预案的培训、演练和修订。' },
            { id: 24030, chapter: 24, group: 'theory', text: '在实施阶段的安全控制措施审核中，监理应关注？', options: ['A、安全控制措施是否达到设计要求', 'B、设备价格是否最低', 'C、施工人员数量是否足够', 'D、设备外观是否美观'], answer: 'A', explanation: '讲义明确要求：确认安全控制措施达到设计要求，有效降低风险。' },
            { id: 24031, chapter: 24, group: 'theory', text: '关于等级保护的原则，以下说法错误的是？', options: ['A、自主定级', 'B、自主保护', 'C、谁主管谁负责', 'D、可以随意调整安全等级'], answer: 'D', explanation: '讲义明确说明：应按照“自主定级、自主保护”的原则，开展等级保护工作，不能随意调整安全等级。' },
            { id: 24032, chapter: 24, group: 'theory', text: '在网络安全要求中，“应在网络边界处部署访问控制设备”的主要目的是？', options: ['A、提高网络速度', 'B、实现网络边界访问控制', 'C、减少设备成本', 'D、简化网络结构'], answer: 'B', explanation: '讲义明确要求：应在网络边界处部署访问控制设备(如防火墙等)。' },
            { id: 24033, chapter: 24, group: 'theory', text: '关于物理安全中的“防静电”要求，机房地面应采用？', options: ['A、普通瓷砖', 'B、木质地板', 'C、防静电地板', 'D、水泥地面'], answer: 'C', explanation: '讲义明确要求：机房的地面应采用防静电地板。' },
            { id: 24034, chapter: 24, group: 'theory', text: '在招标阶段，监理协助编写或审核招标文件时，应重点关注？', options: ['A、投标单位注册资金', 'B、信息安全技术要求能否满足安全目标', 'C、投标单位办公面积', 'D、投标单位员工数量'], answer: 'B', explanation: '讲义明确要求：信息安全技术要求应能满足既定的安全目标与安全需求。' },
            { id: 24035, chapter: 24, group: 'theory', text: '关于“安全审计”的技术要求，以下说法正确的是？', options: ['A、不需要记录网络设备运行状况', 'B、不需要记录用户行为', 'C、应对网络设备运行状况、流量、用户行为等进行日志记录', 'D、日志记录会增加系统负担不应实施'], answer: 'C', explanation: '讲义明确要求：对网络系统中的网络设备运行状况、网络流量、用户行为等进行日志记录。' },
            { id: 24036, chapter: 24, group: 'theory', text: '在深化设计阶段，承建单位应检查的项目不包括？', options: ['A、机房出入口门禁系统', 'B、机房防盗报警系统', 'C、机柜接地系统', 'D、办公区域装修风格'], answer: 'D', explanation: '讲义“深化设计方案的审核”部分要求承建单位检查机房相关安全设施，办公区域装修风格不属于安全必要的检查项。' },
            { id: 24037, chapter: 24, group: 'theory', text: '关于等级测评的“现场测评活动”，不包括以下哪项工作？', options: ['A、现场测评准备', 'B、现场测评和结果记录', 'C、结果确认和资料归还', 'D、测评方案编制'], answer: 'D', explanation: '讲义表24-2明确说明：现场测评活动包括现场测评准备、现场测评和结果记录、结果确认和资料归还。测评方案编制属于方案编制活动。' },
            { id: 24038, chapter: 24, group: 'theory', text: '在实施阶段的安全设备验收中，对于销售许可证的要求是？', options: ['A、不需要销售许可证', 'B、具有公安部颁发的销售许可证且在有效期内', 'C、只需要产品合格证', 'D、销售许可证已过期也可以'], answer: 'B', explanation: '讲义明确要求：安全设备具有公安部颁发的销售许可证，且在有效期内。' },
            { id: 24039, chapter: 24, group: 'theory', text: '关于信息安全技术体系的基本原则，不包括？', options: ['A、深度防御', 'B、动态保障', 'C、静态防护', 'D、全面覆盖'], answer: 'C', explanation: '讲义明确说明：安全技术体系符合“深度防御”和“动态保障”等基本原则。静态防护不是现代信息安全的基本原则。' },
            { id: 24040, chapter: 24, group: 'theory', text: '在测试评估阶段，监理跟踪测评过程的主要目的是？', options: ['A、代替测评机构工作', 'B、督促相关方按计划完成测评工作', 'C、减少测评项目', 'D、加快测评速度'], answer: 'B', explanation: '讲义明确说明：跟踪测评过程，督促相关方按计划完成测评工作。' }
        ];

        // ★★★ 第25节 运行维护监理（40题）★★★
        const CHAPTER_25 = [
            { id: 25001, chapter: 25, group: 'theory', text: '与信息系统工程建设监理相比，运行维护监理在“质量控制”方面更注重什么？', options: ['A、保障产品及项目成果物的建设过程质量', 'B、保障运行维护事件的响应、快速处置等服务质量', 'C、控制项目整体工期和里程碑进度', 'D、评估工程造价和控制预算决算'], answer: 'B', explanation: '根据表25-1对比，运维监理的质量控制重点是保障运行维护事件的响应、快速处置、深层技术问题解决等服务质量。' },
            { id: 25002, chapter: 25, group: 'theory', text: '运行维护监理方法论在建设监理“三控、两管、一协调”基础上，总结出的方法论是什么？', options: ['A、三控、三管、一协调', 'B、四控、五管、一协调', 'C、五控、四管、一协调', 'D、四控、三管、一协调'], answer: 'B', explanation: '文档明确说明：在建设监理规范基础上，总结出了“四控、五管、一协调”的运行维护监理方法论。' },
            { id: 25003, chapter: 25, group: 'theory', text: '在运行维护监理的投资控制中，更加强调什么？', options: ['A、工程造价评估', 'B、预算决算审核', 'C、IT全面预算管理', 'D、项目成本核算'], answer: 'C', explanation: '根据表25-1对比，运维监理的投资控制突出预算执行，指导预算编制与决算，强调IT全面预算管理。' },
            { id: 25004, chapter: 25, group: 'theory', text: '运行维护监理的“效能管理”主要评价什么？', options: ['A、产品建设质量', 'B、运维服务提供方的服务能力及IT资产对业务的支撑能力', 'C、项目进度完成情况', 'D、文档资料完整性'], answer: 'B', explanation: '文档明确说明：效能管理是评价并管理运维服务提供方对其所辖服务对象的服务能力，以及IT资产对业务发展的支撑能力。' },
            { id: 25005, chapter: 25, group: 'theory', text: '在招标阶段监理工作中，以下哪项不是主要输出文档？', options: ['A、监理规划', 'B、服务需求研讨会会议纪要', 'C、招标需求文件评审的监理意见', 'D、系统详细设计文档'], answer: 'D', explanation: '文档明确列出了招标阶段主要输出文档，包括监理规划、会议纪要、评审意见等。系统详细设计文档属于承建单位的设计成果。' },
            { id: 25006, chapter: 25, group: 'theory', text: '运行维护监理质量控制的特点不包括以下哪项？', options: ['A、首先要控制运维服务人员的工作能力', 'B、定位故障比较容易', 'C、改正错误的代价往往较大', 'D、可能引发其他质量问题'], answer: 'B', explanation: '文档明确说明质量控制特点包括：控制运维人员能力、定位故障比较困难、改正错误代价大。因此“定位故障比较容易”说法错误。' },
            { id: 25007, chapter: 25, group: 'theory', text: '在实施阶段的投资控制中，不固定运行维护费的计算方法一般是？', options: ['A、固定总价', 'B、服务单价乘以数量(或工作量)', 'C、成本加酬金', 'D、包干价'], answer: 'B', explanation: '文档明确说明：不固定运行维护费的计算方法一般是服务单价乘以数量(或工作量)。' },
            { id: 25008, chapter: 25, group: 'theory', text: '运行维护安全控制活动中，不包括以下哪项？', options: ['A、人员安全管理', 'B、运行维护工作人员任职、休假制度', 'C、系统开发编码规范', 'D、运行维护应急制度'], answer: 'C', explanation: '文档明确列出了安全控制活动内容，包括人员安全管理、任职休假制度、应急制度等。系统开发编码规范属于建设阶段内容。' },
            { id: 25009, chapter: 25, group: 'theory', text: '配置管理岗位体系中，“定期对配置项的一致性和准确性进行核查”是哪个角色的职责？', options: ['A、配置经理', 'B、配置管理员', 'C、配置审核员', 'D、配置控制员'], answer: 'C', explanation: '文档明确说明：配置审核员的职责是定期对配置项的一致性和准确性进行核查。' },
            { id: 25010, chapter: 25, group: 'theory', text: '应急事件处理流程的正确顺序是？', options: ['A、事件分析→成立工作组→处理过程→结果评估→统计报告', 'B、成立工作组→事件分析→处理过程→统计报告→结果评估', 'C、处理过程→事件分析→成立工作组→结果评估→统计报告', 'D、结果评估→事件分析→成立工作组→处理过程→统计报告'], answer: 'A', explanation: '文档明确说明了应急事件处理流程：应急事件分析→成立应急工作组→应急处理过程→应急处理结果评估→统计和报告。' },
            { id: 25011, chapter: 25, group: 'theory', text: '在效能管理活动中，监理机构的主要工作不包括？', options: ['A、协助建立运维绩效考核管理体系', 'B、直接代替业主单位进行绩效考核打分', 'C、协助执行绩效考核管理体系', 'D、协助完善绩效考核管理体系'], answer: 'B', explanation: '文档明确说明：监理机构协助收集绩效考核指标数据进行打分，并提交报告和监理意见，但不是直接代替业主单位进行考核。' },
            { id: 25012, chapter: 25, group: 'theory', text: '运行维护监理在组织协调方面，突出作为什么角色？', options: ['A、技术实施者', 'B、服务单位职责的裁判', 'C、系统开发者', 'D、测试人员'], answer: 'B', explanation: '根据表25-1对比，运维监理在组织协调中突出作为服务单位职责的裁判作用。' },
            { id: 25013, chapter: 25, group: 'theory', text: '在文档资料管理中，以下哪项不属于运行维护过程文档？', options: ['A、运维合同', 'B、运行维护日志', 'C、巡检日志', 'D、方案/计划报表'], answer: 'A', explanation: '文档明确分类：运维合同属于运行维护总控类文档，而运行维护日志、巡检日志等属于过程文档。' },
            { id: 25014, chapter: 25, group: 'theory', text: '配置经理的职责不包括以下哪项？', options: ['A、确定配置管理过程的计划', 'B、收集和记录配置信息', 'C、组织配置审计工作', 'D、对配置项进行识别和控制'], answer: 'B', explanation: '文档明确说明：收集和记录配置信息是配置管理员的职责，不是配置经理的职责。' },
            { id: 25015, chapter: 25, group: 'theory', text: '应急管理活动中，监理机构不需要评审以下哪项？', options: ['A、组织结构和人员', 'B、检测和预警机制', 'C、应急响应流程', 'D、运维服务商的财务报表'], answer: 'D', explanation: '文档明确列出了应急管理方案的评审重点，包括组织结构、检测预警、应急流程等。财务报表不属于技术评审范围。' },
            { id: 25016, chapter: 25, group: 'theory', text: '在运行维护评估阶段，监理机构的主要工作不包括？', options: ['A、对运维服务提供方进行综合评估', 'B、直接修改系统代码', 'C、完成书面的评估报告', 'D、提出改进意见'], answer: 'B', explanation: '文档明确说明评估阶段监理工作包括综合评估、编写报告、提出改进意见等。直接修改代码是承建单位的工作。' },
            { id: 25017, chapter: 25, group: 'theory', text: '运行维护监理的投资控制要点中，强调应以什么原则为指导？', options: ['A、静态控制原则', 'B、动态控制原则', 'C、固定控制原则', 'D、随机控制原则'], answer: 'B', explanation: '文档明确要求：以动态控制原则为指导进行费用计划值与实际值的比较。' },
            { id: 25018, chapter: 25, group: 'theory', text: '以下哪项不是运行维护实施阶段的主要输出文档？', options: ['A、监理实施细则', 'B、监理会议纪要', 'C、系统源代码', 'D、监理周报、月报'], answer: 'C', explanation: '文档明确列出了实施阶段输出文档，包括实施细则、会议纪要、周月报等。系统源代码是承建单位的开发成果。' },
            { id: 25019, chapter: 25, group: 'theory', text: '在质量控制活动中，监理应定期对什么进行考核、评估？', options: ['A、运行维护服务质量', 'B、系统硬件价格', 'C、办公场地面积', 'D、员工考勤记录'], answer: 'A', explanation: '文档明确要求：宜定期对运行维护服务质量进行考核、评估。' },
            { id: 25020, chapter: 25, group: 'theory', text: '运行维护监理在合同管理方面的衡量标准特点是？', options: ['A、衡量标准具有多样性', 'B、衡量标准不明确', 'C、衡量标准明确', 'D、不需要衡量标准'], answer: 'C', explanation: '根据表25-1对比，运维监理在合同管理方面的衡量标准明确。' },
            { id: 25021, chapter: 25, group: 'theory', text: '在运行维护监理的质量控制中，首要控制的是什么？', options: ['A、运维工具的数量', 'B、运维服务人员的工作能力和水平', 'C、办公环境的舒适度', 'D、文档格式的规范性'], answer: 'B', explanation: '文档明确说明：要控制质量，首先要控制运维服务人员的工作能力、水平。' },
            { id: 25022, chapter: 25, group: 'theory', text: '运行维护监理进度控制中，监理需要做什么？', options: ['A、审核整体运行维护计划', 'B、直接编写运维代码', 'C、代替运维人员值班', 'D、修改系统架构'], answer: 'A', explanation: '文档明确说明：进度控制包括审核整体运行维护计划，包括任务安排合理性，工具、人员投入合理性。' },
            { id: 25023, chapter: 25, group: 'theory', text: '在投资控制中，固定运行维护费的控制方法主要适用于什么情况？', options: ['A、工作量不固定的情况', 'B、服务内容经常变更的情况', 'C、服务范围和内容相对固定的情况', 'D、应急处理情况'], answer: 'C', explanation: '文档将运行维护费分为固定和不固定两种，固定费用适用于服务范围内容相对固定的情况。' },
            { id: 25024, chapter: 25, group: 'theory', text: '运行维护安全控制中，监理需要督促建立的安全操作规范不包括？', options: ['A、运行维护操作环境出入管理制度', 'B、运行维护工作人员人事管理制度', 'C、系统开发流程规范', 'D、运行维护应急制度'], answer: 'C', explanation: '文档明确列出了安全操作规范内容，包括出入管理、人事管理、应急制度等。系统开发流程规范属于建设阶段内容。' },
            { id: 25025, chapter: 25, group: 'theory', text: '配置管理岗位中，负责“收集和记录配置信息，维护配置项信息”的是？', options: ['A、配置经理', 'B、配置管理员', 'C、配置审核员', 'D、配置控制员'], answer: 'B', explanation: '文档明确说明：配置管理员的具体职责包括收集和记录配置信息，维护配置项信息。' },
            { id: 25026, chapter: 25, group: 'theory', text: '应急事件处理流程中，“分析判定风险级别”属于哪个步骤？', options: ['A、应急事件分析', 'B、成立应急工作组', 'C、应急处理过程', 'D、应急处理结果评估'], answer: 'A', explanation: '文档明确说明：应急事件分析阶段要分析判定风险级别。' },
            { id: 25027, chapter: 25, group: 'theory', text: '在效能管理中，监理协助建立的绩效考核管理体系不包括？', options: ['A、绩效考核指标', 'B、绩效考核内容', 'C、绩效考核流程', 'D、员工个人隐私信息'], answer: 'D', explanation: '文档明确说明绩效考核管理体系包括指标、内容、流程、办法等。员工个人隐私信息不属于绩效考核管理范畴。' },
            { id: 25028, chapter: 25, group: 'theory', text: '运行维护监理在沟通协调中，需要建立什么机制？', options: ['A、三方的信息传递机制', 'B、单方面的指令下达机制', 'C、随意的沟通方式', 'D、非正式的交流渠道'], answer: 'A', explanation: '文档明确要求：建立三方的信息传递机制，包括信息沟通、汇报、审批等流程。' },
            { id: 25029, chapter: 25, group: 'theory', text: '运行维护过程文档不包括以下哪项？', options: ['A、运行维护日志', 'B、巡检日志', 'C、系统源代码', 'D、方案/计划报表'], answer: 'C', explanation: '文档明确分类：运行维护日志、巡检日志、方案/计划报表都属于过程文档。系统源代码属于开发成果。' },
            { id: 25030, chapter: 25, group: 'theory', text: '配置经理的职责包括以下哪项？', options: ['A、确定配置管理过程的计划', 'B、直接修改配置项内容', 'C、代替配置管理员工作', 'D、跳过配置审计'], answer: 'A', explanation: '文档明确说明：配置经理的职责包括确定配置管理过程的计划、对配置项进行识别和控制等。' },
            { id: 25031, chapter: 25, group: 'theory', text: '在应急管理方案评审中，监理需要重点评审的内容不包括？', options: ['A、组织结构和人员', 'B、检测和预警机制', 'C、应急响应流程', 'D、运维服务商的利润率'], answer: 'D', explanation: '文档明确列出了应急管理方案的评审重点，包括组织结构、检测预警、应急流程等。利润率不属于技术评审范围。' },
            { id: 25032, chapter: 25, group: 'theory', text: '运行维护监理的投资控制强调什么？', options: ['A、实际费用不应超过计划费用', 'B、可以随意超支', 'C、不需要预算控制', 'D、费用控制不重要'], answer: 'A', explanation: '文档明确要求：一般情况下，项目实际费用不应超过项目计划费用。' },
            { id: 25033, chapter: 25, group: 'theory', text: '在质量控制中，监理需要抽查什么记录？', options: ['A、巡检相关记录', 'B、员工考勤记录', 'C、个人邮件记录', 'D、社交媒体记录'], answer: 'A', explanation: '文档明确要求：督促运维服务提供方开展巡检，并抽查巡检相关记录。' },
            { id: 25034, chapter: 25, group: 'theory', text: '运行维护监理的文档资料管理强调什么？', options: ['A、服务过程的可溯源性及整体关联性', 'B、文档数量越多越好', 'C、格式完全统一', 'D、不需要保存历史记录'], answer: 'A', explanation: '文档明确说明：运维监理的文档管理强调服务过程的可溯源性及整体关联性。' },
            { id: 25035, chapter: 25, group: 'theory', text: '应急事件关闭后，监理需要督促完成什么工作？', options: ['A、应急事件的索赔、总结、评价和改进', 'B、立即销毁所有记录', 'C、忽略此次事件', 'D、仅做简单记录'], answer: 'A', explanation: '文档明确要求：应急事件关闭后，督促各方完成应急事件的索赔、总结、评价和改进工作。' },
            { id: 25036, chapter: 25, group: 'theory', text: '在配置管理中，配置审核员的主要工作是什么？', options: ['A、定期对配置项的一致性和准确性进行核查', 'B、直接修改配置项', 'C、管理配置团队', 'D、编写配置管理计划'], answer: 'A', explanation: '文档明确说明：配置审核员的职责是定期对配置项的一致性和准确性进行核查。' },
            { id: 25037, chapter: 25, group: 'theory', text: '运行维护监理在评估阶段的主要输出文档不包括？', options: ['A、监理意见', 'B、运行维护服务验收记录', 'C、系统源代码', 'D、监理工作总结报告'], answer: 'C', explanation: '文档明确列出了评估阶段的主要输出文档，包括监理意见、验收记录、总结报告等。系统源代码是承建单位的开发成果。' },
            { id: 25038, chapter: 25, group: 'theory', text: '在投资控制中，动态控制原则是指？', options: ['A、费用计划值与实际值的比较', 'B、固定不变的控制', 'C、随机调整', 'D、不需要控制'], answer: 'A', explanation: '文档明确要求：以动态控制原则为指导进行费用计划值与实际值的比较。' },
            { id: 25039, chapter: 25, group: 'theory', text: '运行维护监理需要检查什么准备情况？', options: ['A、备品、备件的准备情况', 'B、员工午餐菜单', 'C、办公用品数量', 'D、节假日安排'], answer: 'A', explanation: '文档明确要求：检查备品、备件的准备情况。' },
            { id: 25040, chapter: 25, group: 'theory', text: '在沟通协调中，监理需要定期召开什么会议？', options: ['A、运行维护工作监理例会', 'B、产品发布会', 'C、市场营销会议', 'D、股东会议'], answer: 'A', explanation: '文档明确要求：建立三方的协调机制，定期召开运行维护工作监理例会，并形成会议纪要。' }
        ];
        // ★★★ 2024年下半年 信息系统监理师 上午试卷 综合知识（75题）★★★
        const CHAPTER_26 = [
            { id: 26001, chapter: 26, group: 'exam', text: '隐蔽工程施工完毕，应由承建单位的(45)，符合要求后，由承建单位通知监理工程师检查验收。', options: ['A、相关人员自检、互检、专检', 'B、作业技术人员进行自检', 'C、专业技术人员检查', 'D、专职质检员进行专检'], answer: 'A', explanation: '隐蔽工程施工完毕，承建单位应先组织相关人员自检、互检、专检，合格后通知监理工程师检查验收。' },
            { id: 26002, chapter: 26, group: 'exam', text: '承建单位提出的项目合同变更，应编制变更文件，由(60)组织审查。', options: ['A、总监理工程师代表', 'B、总监理工程师', 'C、监理工程师', 'D、监理文档管理人员'], answer: 'B', explanation: '知识点：总监理工程师、项目合同。项目合同变更文件应由总监理工程师组织审查。' },
            { id: 26003, chapter: 26, group: 'exam', text: '某单位搭建信息网络安全平台时，为防范从通信信道窃取信息，应采用（ ）。', options: ['A、数据加密技术', 'B、漏洞扫描技术', 'C、应用网关产品', 'D、分组过滤技术'], answer: 'A', explanation: '知识点：数据加密、网络安全、信道。防范通信信道窃取信息应采用数据加密技术。' },
            { id: 26004, chapter: 26, group: 'exam', text: '（ ）不属于漏洞扫描系统的功能和性能要素。', options: ['A、支持灵活的事件和规则自定义功能', 'B、支持与入侵监测系统的联动', 'C、支持对电子邮件附件的病毒防治', 'D、支持快速检索事件和规则信息的功能'], answer: 'C', explanation: '知识点：漏洞扫描。电子邮件附件的病毒防治属于反病毒系统的功能，不属于漏洞扫描系统。' },
            { id: 26005, chapter: 26, group: 'exam', text: '为投标某行业大数据智能平台建设项目，某信息系统监理公司总监在投标书中编制了（ ），重点阐述监理目的，初步规划将采取的监理措施。', options: ['A、质量保证计划', 'B、监理大纲', 'C、监理规划', 'D、监理合同'], answer: 'B', explanation: '知识点：监理大纲、投标。监理大纲是投标阶段编制的文件，重点阐述监理目的和初步监理措施。' },
            { id: 26006, chapter: 26, group: 'exam', text: '为验证某程序的模块A是否正确实现了规定的功能，需要进行(30)；为验证模块A能否与其他模块按照规定方式正确工作，需要进行(31)。', options: ['A、集成测试', 'B、系统测试', 'C、确认测试', 'D、单元测试'], answer: 'D', explanation: '知识点：单元测试。验证模块本身功能是单元测试(30)；验证模块间协作是集成测试(31)。' },
            { id: 26007, chapter: 26, group: 'exam', text: '下面关于监理在处理工期延期方面的叙述，不正确的是(52)。', options: ['A、要求承建单位承担赶工的全部额外开支和赔偿工程拖期造成的损失', 'B、及时受理承建单位的工程延期申请，并确认其合理性和可行性', 'C、监理在做出延期确认之前，应与建设单位、承建单位进行协商', 'D、阶段性工程延期造成工程总工期延迟时，应要求承建单位修改总工期，经审核后报建设单位备案'], answer: 'A', explanation: '工期延期属于可原谅的延误，不应要求承建单位承担全部额外开支并赔偿损失；该说法不正确。' },
            { id: 26008, chapter: 26, group: 'exam', text: '监理人员在进行需求变更管理时，不正确的管理措施是：（ ）。', options: ['A、变更文件必须表述准确、图示规范', 'B、分包项目的需求变更由分包商提交监理单位签认', 'C、变更的内容应符合有关规范、规程和技术标准', 'D、变更的内容应及时反映在实施方案中'], answer: 'B', explanation: '知识点：变更管理、需求变更管理。分包项目的需求变更应由总承包单位提交监理，而非分包商直接提交。' },
            { id: 26009, chapter: 26, group: 'exam', text: '协助建设单位改善信息工程项目目标控制的工作流程是监理单位对信息工程目标控制采取的（）措施。', options: ['A、组织', 'B、技术', 'C、经济', 'D、合同'], answer: 'A', explanation: '知识点：监理单位、建设单位、组织措施。改善目标控制的工作流程属于组织措施。' },
            { id: 26010, chapter: 26, group: 'exam', text: '某公司总监理工程师在处理建设单位与承建单位之间的合同纠纷时，考虑到其受建设单位委托，而有意规避掉部分应由建设单位承担的责任，这种行为违背了监理方(24)的行为准则。', options: ['A、科学', 'B、守法', 'C、诚信', 'D、公正'], answer: 'D', explanation: '偏袒委托方、规避其应担责任，违背了监理的公正性行为准则。' },
            { id: 26011, chapter: 26, group: 'exam', text: '(41)符合信息系统工程监理单位甲级资质等级评定条件(2012年修订版)的规定。', options: ['A、企业近三年的信息系统工程监理及相关信息技术服务收入总额不少于3500万元', 'B、具有信息系统工程监理工程师资格的人数不少于25名', 'C、近三年完成的信息系统工程监理及相关信息技术服务项目个数不少于10', 'D、企业注册资本和实收资本均不少于1000万元'], answer: 'D', explanation: '甲级资质评定条件中明确规定：企业注册资本和实收资本均不少于1000万元。' },
            { id: 26012, chapter: 26, group: 'exam', text: '双绞线的电气特性“NEXT”表示(20)。', options: ['A、远端串扰', 'B、近端串扰', 'C、衰减串扰比', 'D、衰减'], answer: 'B', explanation: '知识点：测试的种类、双绞线电气特性。NEXT(Near End Cross Talk)表示近端串扰。' },
            { id: 26013, chapter: 26, group: 'exam', text: '路由选择功能由对应于OSI模型的(9)负责完成。', options: ['A、数据链路层', 'B、传输层', 'C、物理层', 'D、网络层'], answer: 'D', explanation: '知识点：网络层。路由选择是OSI网络层的功能。' },
            { id: 26014, chapter: 26, group: 'exam', text: '下列对网络层次化设计的理解，不正确的是(10)。', options: ['A、使配置复杂性提高，不易被攻击', 'B、层次化设计易于扩展', 'C、使网络容易升级到最新的技术，无需改变整个环境', 'D、可以使故障排除更容易'], answer: 'A', explanation: '层次化设计使网络结构清晰、易于管理维护，“使配置复杂性提高”的理解不正确。' },
            { id: 26015, chapter: 26, group: 'exam', text: '某自然语言处理实验室开发了一个网站，输入想要表达的意思，可以快速分析语义，查找出相关的名言、诗句，甚至写成优美的文章。这是（）的一个典型应用。', options: ['A、语种互译', 'B、智能合约', 'C、人工智能', 'D、脑机接口'], answer: 'C', explanation: '知识点：典型应用、自然语言处理。语义分析、自动写作是人工智能的典型应用。' },
            { id: 26016, chapter: 26, group: 'exam', text: '大数据具有“volume”、“variety”、“value”、“velocity”等特点，其中“volume”是指(1)。', options: ['A、数据体量巨大', 'B、数据相关性高', 'C、数据类型繁多', 'D、价值密度低'], answer: 'A', explanation: '知识点：大数据。volume指数据体量巨大。' },
            { id: 26017, chapter: 26, group: 'exam', text: '（ ）技术用于防止网络外部“敌人”的侵犯。', options: ['A、漏洞扫描', 'B、入侵监测', 'C、数据加密', 'D、防火墙'], answer: 'D', explanation: '知识点：防火墙。防火墙部署在网络边界，用于防止外部入侵。' },
            { id: 26018, chapter: 26, group: 'exam', text: '现场实施危险作业意外伤害保险费应列入项目(57)中。', options: ['A、其它费用', 'B、风险费用', 'C、直接费用', 'D、间接费用'], answer: 'D', explanation: '知识点：现场实施。意外伤害保险费属于规费，列入项目间接费用。' },
            { id: 26019, chapter: 26, group: 'exam', text: '信息系统工程项目是由建设单位、承建单位和监理单位共同完成的，因此质量控制任务也应由三方共同完成。下面关于质量管理体系中三方关系的说法，不妥的是(47)。', options: ['A、监理单位是工程项目的监督管理协调方，既要按照自己的质量控制体系从事监理活动，还要对承建单位的质量控制体系以及建设单位的工程管理体系进行监督和指导', 'B、承建单位是工程建设的实施方，因此承建单位的质量控制体系能否有效运行是整个项目质量保障的关键', 'C、建设单位作为工程建设的投资方和用户方，应该建立较完整的工程项目管理体系，这是项目成功的关键因素之一', 'D、质量管理过程中，建设单位的参与人员是建设单位为本项目配备的质量管理人员，承建单位的参与人员是承建单位的项目经理和质量管理人员，监理单位的参与人员主要是质量监理工程师、总监理工程师和专家'], answer: 'D', explanation: 'D项对三方参与人员的描述过于绝对和僵化，不符合三方协同质量管理体系的实际要求。' },
            { id: 26020, chapter: 26, group: 'exam', text: '某银行在信息系统逻辑访问的安全控制过程中，发现有一批账户在交易发生后计算出的金额（如利息）发生了变化，小数点后的余额尾数（如分）被去除，差额被转入某个可疑账户。这种舞弊行为使用的技术是（ ）。', options: ['A、尼姆达病毒', 'B、逻辑炸弹', 'C、特洛伊木马', 'D、色粒米技术'], answer: 'D', explanation: '知识点：安全管理概述。截取交易尾数差额转入特定账户的舞弊技术称为色粒米(Salami)技术。' },
            { id: 26021, chapter: 26, group: 'exam', text: '信息系统工程项目投资构成中的实施方案设计费属于(54)。', options: ['A、咨询费', 'B、工程验收费', 'C、工程前期费', 'D、工程费'], answer: 'C', explanation: '知识点：项目投资的构成。实施方案设计费属于工程前期费。' },
            { id: 26022, chapter: 26, group: 'exam', text: 'Ethernet采用的媒体访问控制方式为(7)。', options: ['A、令牌总线', 'B、CSMA/CD', 'C、CDMA', 'D、无竞争协议'], answer: 'B', explanation: '知识点：访问控制。以太网采用CSMA/CD(载波侦听多路访问/冲突检测)方式。' },
            { id: 26023, chapter: 26, group: 'exam', text: '（）是指导整个项目执行和控制的文件。', options: ['A、工作说明书', 'B、项目计划', 'C、质量计划', 'D、资源规划'], answer: 'B', explanation: '知识点：项目计划。项目计划是指导整个项目执行和控制的文件。' },
            { id: 26024, chapter: 26, group: 'exam', text: '综合布线系统(PDS)应是开放式星状拓扑结构。综合布线系统一般包含六部分子系统，其中不包括( )。', options: ['A、综合管理子系统', 'B、工作区子系统', 'C、垂直干线子系统', 'D、建筑群子系统'], answer: 'A', explanation: '知识点：综合布线系统。六个子系统为工作区、水平、垂直干线、设备间、管理、建筑群子系统，无“综合管理子系统”。' },
            { id: 26025, chapter: 26, group: 'exam', text: '承担信息系统工程监理的监理单位与该信息系统工程的承建单位不得有隶属关系和其它利害关系，这个要求反映了监理的(24)。', options: ['A、独立性', 'B、服务性', 'C、科学性', 'D、公正性'], answer: 'A', explanation: '与承建单位不得有隶属和利害关系，体现的是监理的独立性。' },
            { id: 26026, chapter: 26, group: 'exam', text: '项目监理例会是为了履约各方沟通情况、交流信息、协调处理、研究解决合同履行中存在的各方面问题而召开的会议，应由()组织与主持。', options: ['A、承建单位项目经理', 'B、监理工程师', 'C、总监代表', 'D、总监理工程师'], answer: 'D', explanation: '知识点：监理的主要内容。项目监理例会由总监理工程师组织与主持。' },
            { id: 26027, chapter: 26, group: 'exam', text: '以下关于中继器的叙述中，不正确的是(8)。', options: ['A、中继器是工作于物理层的网络连接设备', 'B、中继器的主要功能是通过重新发送或者转发数据信号，来扩大网络的范围', 'C、一般情况下，中继器两端连接的是相同的传输介质', 'D、利用中继器的放大再生功能，可以无限延长网络距离'], answer: 'D', explanation: '中继器的级联受距离和数量的限制(如5-4-3规则)，不能无限延长网络距离。' },
            { id: 26028, chapter: 26, group: 'exam', text: '（ ）属于适应性维护。', options: ['A、为便于维护而做的修改，如为了改进易读性而增加一些注释等', 'B、为改善性能而作的修改，如提高运行速度、节省存储空间等', 'C、软件支持环境的改变，如操作系统、编译器或实用程序的变化等', 'D、为扩充和增强功能而做的修改，如扩充解题范围和算法优化等'], answer: 'C', explanation: '知识点：软件维护。适应软件支持环境变化(操作系统、编译器变化等)的维护属于适应性维护。' },
            { id: 26029, chapter: 26, group: 'exam', text: '软件的(23)反映了组织机构或客户对系统、产品高层次的目标要求。', options: ['A、功能需求', 'B、性能需求', 'C、技术先进性', 'D、业务需求'], answer: 'D', explanation: '知识点：需求的分类。业务需求反映组织机构或客户对系统、产品高层次的目标要求。' },
            { id: 26030, chapter: 26, group: 'exam', text: '总监理工程师参与编制监理大纲有利于(46)。', options: ['A、监理实施细则的编制', 'B、承揽到监理业务', 'C、被业主认可', 'D、监理规划的编制'], answer: 'B', explanation: '知识点：监理大纲、总监理工程师。总监参与编制监理大纲有利于承揽到监理业务。' },
            { id: 26031, chapter: 26, group: 'exam', text: '应用层DNS协议主要用于实现(10)的网络服务功能。', options: ['A、用户名到进程地址的映射', 'B、进程地址到IP地址的映射', 'C、网络设备名到IP地址的映射', 'D、网络硬件地址到IP地址的映射'], answer: 'C', explanation: '知识点：DNS、应用层。DNS实现域名(网络设备名)到IP地址的映射。' },
            { id: 26032, chapter: 26, group: 'exam', text: '以下信息系统项目一定不属于电子政务项目的是(1)。', options: ['A、基础空间地理信息库管理系统', 'B、土地招拍卖挂管理信息系统', 'C、宏观经济管理信息系统', 'D、ERP系统'], answer: 'D', explanation: '知识点：电子政务。ERP系统是企业资源计划系统，属于企业信息化项目。' },
            { id: 26033, chapter: 26, group: 'exam', text: '合同索赔是在信息系统工程合同履行中，当事人一方由于另一方未履行合同所规定的义务而遭受损失时，向另一方提出赔偿要求的行为。关于索赔的描述，不正确的是（ ）。', options: ['A、合同索赔的依据是国家有关的法律、法规和项目所在地的地方法规等', 'B、合同索赔的依据是本项目的合同文件、合同履行过程中与索赔事件有关的凭证等', 'C、反索赔是承建单位向建设单位提出的索赔', 'D、索赔是合同管理的重要环节，是合同双方利益的体现'], answer: 'C', explanation: '知识点：合同索赔。反索赔是建设单位向承建单位提出的索赔，C项说法不正确。' },
            { id: 26034, chapter: 26, group: 'exam', text: '以下关于基于双重宿主主机体系结构的防火墙的叙述中，正确的是（ ）。', options: ['A、内部网络用户不可以通过客户端代理软件以代理方式访问外部资源', 'B、内部网络用户可以直接登录至双重宿主主机成为一个用户来访问外部资源', 'C、双重宿主主机可以配置为内部网络与外部网络进行数据包转发的路由器', 'D、当访问外部资源时，该主机的资源消耗较小'], answer: 'B', explanation: '知识点：防火墙体系结构。双重宿主主机体系结构下，内部用户可直接登录该主机访问外部资源，且其不具备路由转发功能。' },
            { id: 26035, chapter: 26, group: 'exam', text: 'VLAN网的帧结构(7)。', options: ['A、与以太网帧结构完全不同', 'B、与以太网帧结构完全相同', 'C、与以太网帧结构不兼容', 'D、在以太网帧结构中增加4个VLAN标记'], answer: 'D', explanation: '知识点：信息网络系统。VLAN帧是在以太网帧结构中增加4字节VLAN标记(802.1Q标签)。' },
            { id: 26036, chapter: 26, group: 'exam', text: 'MIPS常用来描述计算机的运算速度，其含义是(4)。', options: ['A、每分钟执行百万条指令', 'B、每分钟处理百万个字符', 'C、每秒钟处理百万个字符', 'D、每秒钟执行百万条指令'], answer: 'D', explanation: '知识点：计算机的分类、运算速度。MIPS即每秒钟执行百万条指令数。' },
            { id: 26037, chapter: 26, group: 'exam', text: '监理合同内容不包括（ ）。', options: ['A、监理业务内容', 'B、承建单位的违约责任', 'C、监理单位的违约责任', 'D、监理费用的计取和支付方式'], answer: 'B', explanation: '知识点：合同的主要内容。监理合同是建设单位与监理单位之间的合同，不涉及承建单位的违约责任。' },

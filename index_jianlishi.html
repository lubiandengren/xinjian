            { id: 8035, chapter: 8, group: 'theory', text: '监理人员能力要求中，“压力与情绪管理”属于哪类能力？', options: ['A、专业能力', 'B、行为能力', 'C、管理能力', 'D、技术能力'], answer: 'B', explanation: '讲义表8-1中，“压力与情绪管理”被明确归类在“行为能力”之下。' }
        ];

        // ★★★ 第11节 进度控制（38题）★★★
        const CHAPTER_11 = [
            { id: 11001, chapter: 11, group: 'theory', text: '进度控制的四个基本步骤简称是什么？', options: ['A、PCDA', 'B、PDCA', 'C、PCAD', 'D、PACD'], answer: 'B', explanation: '讲义明确说明进度控制的四个步骤是：“计划(Plan)、执行(Do)、检查(Check)和行动(Action)”。' },
            { id: 11002, chapter: 11, group: 'theory', text: '进度计划编制的依据不包括以下哪项？', options: ['A、项目承包合同', 'B、项目设计图纸', 'C、监理单位内部人事安排', 'D、项目自然条件'], answer: 'C', explanation: '讲义列出了进度计划编制的多个依据，包括合同、图纸、自然条件等，但不包括监理单位内部人事安排。' },
            { id: 11003, chapter: 11, group: 'theory', text: '在进度控制中，“将进度计划具体化为实施计划和实施任务书”属于哪个环节？', options: ['A、计划编制', 'B、计划实施', 'C、计划检查', 'D、计划总结'], answer: 'B', explanation: '讲义在“进度计划实施”部分明确说明：“将进度计划具体化为实施计划和实施任务书。”' },
            { id: 11004, chapter: 11, group: 'theory', text: '甘特图中，如果检查发现项目进度已经落后，监理工程师应该？', options: ['A、不做任何处理', 'B、立即提出监理报告并采取补救措施', 'C、等待承建单位自行解决', 'D、直接处罚承建单位'], answer: 'B', explanation: '讲义明确说明：“监理工程师如果检查发现项目进度已经落后，则应立即提出监理报告，采取补救措施。”' },
            { id: 11005, chapter: 11, group: 'theory', text: '在“香蕉”曲线图中，实际完成曲线处于两曲线之间表示什么？', options: ['A、进度正常', 'B、进度提前', 'C、进度延期', 'D、进度无法判断'], answer: 'A', explanation: '讲义说明：“实际完成曲线处在两曲线之中表示进度正常，处于曲线之上表示提前，处于曲线之下表示延期。”' },
            { id: 11006, chapter: 11, group: 'theory', text: '双代号网络图的主要特征是什么？', options: ['A、以节点表示工作', 'B、以箭头线表示工作', 'C、以圆圈表示逻辑关系', 'D、以数字表示时间'], answer: 'B', explanation: '讲义明确说明：“双代号网络图又称箭头线式网络图，以箭头线表示工作，以节点表示工作的开始或结束状态。”' },
            { id: 11007, chapter: 11, group: 'theory', text: '监理进度控制程序中，进度计划最终由谁签署批准？', options: ['A、业主单位', 'B、承建单位', 'C、总监理工程师', 'D、监理工程师'], answer: 'C', explanation: '讲义明确说明：“进度计划由总监理工程师签署批准后实施，并报送业主。”' },
            { id: 11008, chapter: 11, group: 'theory', text: '当发现进度计划严重偏离时，总监理工程师应该？', options: ['A、忽略继续观察', 'B、及时签发监理通知单', 'C、直接更换承建单位', 'D、仅做记录不处理'], answer: 'B', explanation: '讲义在调整进度计划部分明确要求：“发现严重偏离时，总监理工程师应及时签发监理通知单。”' },
            { id: 11009, chapter: 11, group: 'theory', text: '项目延期处理的第一步是？', options: ['A、直接批准延期', 'B、确认延期的合理性', 'C、处罚承建单位', 'D、修改总体计划'], answer: 'B', explanation: '讲义明确项目延期处理流程：“监理单位应先确认其合理性，并与业主单位、承建单位协商确认后，由总监理工程师对项目延期申请予以签认。”' },
            { id: 11010, chapter: 11, group: 'theory', text: '监理进度控制方法中，“采用实际值与计划值进行比较”属于？', options: ['A、动态管理', 'B、主动预控', 'C、行政方法', 'D、经济手段'], answer: 'A', explanation: '讲义说明进度控制方法：“采用实际值与计划值进行比较的方法进行检查和评价”，这属于动态管理。' },
            { id: 11011, chapter: 11, group: 'theory', text: '以下哪项属于进度控制的组织措施？', options: ['A、采用进度控制技术', 'B、落实人员分工和职责', 'C、办理工程进度款', 'D、加强合同管理'], answer: 'B', explanation: '讲义明确组织措施包括：“落实监理单位进度控制的人员组成、任务和管理职责分工”。' },
            { id: 11012, chapter: 11, group: 'theory', text: '以下哪项属于进度控制的技术措施？', options: ['A、建立进度报告制度', 'B、采用进度控制技术', 'C、支付赶工费用', 'D、加强索赔管理'], answer: 'B', explanation: '讲义明确技术措施包括：“采用进度控制技术及其他科学适用的进度控制方法”。' },
            { id: 11013, chapter: 11, group: 'theory', text: '以下哪项属于进度控制的经济措施？', options: ['A、落实人员分工', 'B、采用控制技术', 'C、办理工程预付款', 'D、加强合同管理'], answer: 'C', explanation: '讲义明确经济措施包括：“及时办理工程预付款及工程进度款支付手续”。' },
            { id: 11014, chapter: 11, group: 'theory', text: '以下哪项属于进度控制的合同措施？', options: ['A、建立沟通机制', 'B、进行进度预测', 'C、收取误期赔偿金', 'D、加强风险管理'], answer: 'D', explanation: '讲义明确合同措施包括：“加强风险管理，在合同中应充分考虑风险因素及处理方法”。' },
            { id: 11015, chapter: 11, group: 'theory', text: '在进度计划检查中，使用的主要方法是什么？', options: ['A、抽样法', 'B、对比法', 'C、实验法', 'D、推理法'], answer: 'B', explanation: '讲义明确说明检查的方法：“对比法，即将计划内容与记录的实际状况进行对比。”' },
            { id: 11016, chapter: 11, group: 'theory', text: '进度控制的范围不包括以下哪项？', options: ['A、对工程建设全过程的控制', 'B、对分项目分系统的控制', 'C、对承建单位内部管理的控制', 'D、对总体进度计划的控制'], answer: 'C', explanation: '讲义明确进度控制范围包括对全过程和分项目分系统的控制，但不涉及承建单位内部管理。' },
            { id: 11017, chapter: 11, group: 'theory', text: '单代号网络图的主要特征是什么？', options: ['A、以箭头线表示工作', 'B、以节点表示工作', 'C、以虚线表示关系', 'D、以颜色区分进度'], answer: 'B', explanation: '讲义明确说明：“单代号网络图又称节点式网络图，以节点及其编号表示工作。”' },
            { id: 11018, chapter: 11, group: 'theory', text: '当项目确实不能按计划实现时，正确的处理方式是？', options: ['A、强制按原计划执行', 'B、适当延长工期或改变实施速度', 'C、立即终止项目', 'D、追究个人责任'], answer: 'B', explanation: '讲义明确说明：“当项目确实不能按计划实现时，适当延长工期，或改变实施速度。”' },
            { id: 11019, chapter: 11, group: 'theory', text: '监理进度控制方法中，“利用行政权力发布进度指令”属于？', options: ['A、行政方法', 'B、经济手段', 'C、技术措施', 'D、合同措施'], answer: 'A', explanation: '讲义明确说明：“运用行政的方法，利用行政权力发布进度指令，实施有效的控制。”' },
            { id: 11020, chapter: 11, group: 'theory', text: '进度计划实施中，“记录工作在计划图表上进行”的目的是？', options: ['A、增加工作量', 'B、便于检查时分析对比', 'C、美化图表', 'D、应付检查'], answer: 'B', explanation: '讲义明确说明：“记录工作在计划图表上进行，以便检查计划时进行分析对比。”' },
            { id: 11021, chapter: 11, group: 'theory', text: '进度控制流程的正确顺序是？', options: ['A、检查计划、编制计划、实施计划、总结计划', 'B、编制计划、实施计划、检查计划、总结计划', 'C、实施计划、编制计划、检查计划、总结计划', 'D、总结计划、编制计划、实施计划、检查计划'], answer: 'B', explanation: '讲义明确说明进度控制流程为：“编制计划、实施计划、检查计划、总结计划。”' },
            { id: 11022, chapter: 11, group: 'theory', text: '在进度计划编制中，安排开工、竣工时间的主要依据是？', options: ['A、承建单位意愿', 'B、合同工期', 'C、监理单位安排', 'D、业主单位要求'], answer: 'B', explanation: '讲义明确说明：“以合同工期为依据安排开工、竣工时间”。' },
            { id: 11023, chapter: 11, group: 'theory', text: '以下哪项不是进度计划的具体内容？', options: ['A、项目综合进度计划', 'B、设备采购工作进度计划', 'C、项目实施进度计划', 'D、监理单位财务计划'], answer: 'D', explanation: '讲义列出了进度计划的具体内容包括项目综合进度计划、设备采购进度计划、实施进度计划、验收进度计划，不包括监理单位财务计划。' },
            { id: 11024, chapter: 11, group: 'theory', text: '进度计划实施中的“调度工作”不包括以下哪项？', options: ['A、督促供应商按计划供应资源', 'B、控制实施现场临时设施使用', 'C、发布调度令', 'D、直接进行施工操作'], answer: 'D', explanation: '讲义说明调度工作包括督促供应商、控制临时设施、发布调度令，但监理不直接进行施工操作。' },
            { id: 11025, chapter: 11, group: 'theory', text: '按检查时间分类，进度计划检查分为？', options: ['A、定期检查和不定期检查', 'B、日常检查和定期检查', 'C、全面检查和抽样检查', 'D、内部检查和外部检查'], answer: 'B', explanation: '讲义明确说明：“按检查时间分类：分为日常检查和定期检查。”' },
            { id: 11026, chapter: 11, group: 'theory', text: '进度计划检查收集的数据信息不包括？', options: ['A、实际投入的人力', 'B、实际投入的成本', 'C、项目范围变更信息', 'D、承建单位内部会议记录'], answer: 'D', explanation: '讲义列出了检查收集的数据包括实际人力、成本、范围变更信息等，但不包括承建单位内部会议记录。' },
            { id: 11027, chapter: 11, group: 'theory', text: '进度计划分析与总结的主要目的是？', options: ['A、追究责任', 'B、发现问题、总结经验', 'C、处罚相关人员', 'D、增加文档资料'], answer: 'B', explanation: '讲义明确说明：“总结的目的是发现问题，总结经验，寻找更好的控制措施。”' },
            { id: 11028, chapter: 11, group: 'theory', text: '进度控制的目标是？', options: ['A、尽可能缩短工期', 'B、保障项目在计划时间内完成', 'C、降低项目成本', 'D、提高工程质量'], answer: 'B', explanation: '讲义明确说明进度控制目标：“通过各种有效措施，保障项目在计划规定的时间内完成。”' },
            { id: 11029, chapter: 11, group: 'theory', text: '在甘特图中，深色和浅色分别表示？', options: ['A、实际进度和计划进度', 'B、计划进度和实际进度', 'C、关键路径和非关键路径', 'D、已完成和未完成'], answer: 'B', explanation: '讲义说明甘特图：“深色表示计划进度，浅色表示实际进度。”' },
            { id: 11030, chapter: 11, group: 'theory', text: '在“香蕉”曲线图中，横轴和纵轴分别代表？', options: ['A、任务量和时间', 'B、时间和任务量', 'C、成本和时间', 'D、质量和时间'], answer: 'B', explanation: '讲义说明：“横轴代表工期或时间，纵轴代表项目完成的任务量或实施进度的累计。”' },
            { id: 11031, chapter: 11, group: 'theory', text: '网络图计划法中，表示工作之间逻辑关系的是？', options: ['A、节点编号', 'B、箭头线', 'C、虚线', 'D、颜色标识'], answer: 'B', explanation: '讲义说明单代号网络图：“以箭头线表示工作之间的逻辑关系。”' },
            { id: 11032, chapter: 11, group: 'theory', text: '监理进度控制程序中，审查进度计划时不需要分析？', options: ['A、进度计划的合理性', 'B、进度计划的可行性', 'C、承建单位的利润率', 'D、关键路径分析'], answer: 'C', explanation: '讲义说明审查进度计划要分析合理性、可行性、关键路径，但不涉及承建单位的利润率。' },
            { id: 11033, chapter: 11, group: 'theory', text: '监控进度计划时，若发现偏离，首先应该？', options: ['A、直接处罚承建单位', 'B、报告总监理工程师', 'C、修改进度计划', 'D、忽略偏差'], answer: 'B', explanation: '讲义明确要求：“若发现偏离，应及时报告总监理工程师，并由其签发监理通知单。”' },
            { id: 11034, chapter: 11, group: 'theory', text: '调整进度计划时，如果需要延长工期，正确的流程是？', options: ['A、承建单位直接延期', 'B、承建单位申请延期报监理审查', 'C、监理单位直接决定', 'D、业主单位单方面批准'], answer: 'B', explanation: '讲义明确要求：“须延长工期时，承建单位应申请延期，报监理单位审查。”' },
            { id: 11035, chapter: 11, group: 'theory', text: '工程进度报告不包括以下哪项？', options: ['A、阶段性进度报告', 'B、进度月报', 'C、承建单位内部考核报告', 'D、进度调整报告'], answer: 'C', explanation: '讲义说明工程进度报告包括阶段性进度报告、进度月报、进度调整报告，不包括承建单位内部考核报告。' },
            { id: 11036, chapter: 11, group: 'theory', text: '项目延期影响总体进度计划时，监理单位应该？', options: ['A、不予理会', 'B、要求承建单位修改总体计划', 'C、直接修改计划', 'D、终止合同'], answer: 'B', explanation: '讲义明确要求：“项目延期影响总体进度计划时，监理单位应要求承建单位修改总体进度计划。”' },
            { id: 11037, chapter: 11, group: 'theory', text: '监理进度控制方法中，“发挥经济杠杆作用”指的是？', options: ['A、行政方法', 'B、经济手段', 'C、技术措施', 'D、组织措施'], answer: 'B', explanation: '讲义明确说明：“发挥经济杠杆的作用，采用经济手段对项目进度加以影响。”' },
            { id: 11038, chapter: 11, group: 'theory', text: '进度控制的组织措施包括？', options: ['A、采用控制技术', 'B、建立进度报告制度', 'C、支付进度款', 'D、加强合同管理'], answer: 'B', explanation: '讲义明确组织措施包括：“建立进度报告制度及进度信息沟通协调机制”。' }
        ];

        // ★★★ 第13节 合同管理（35题）★★★
        const CHAPTER_13 = [
            { id: 13001, chapter: 13, group: 'theory', text: '业主将不同的工作任务分别发包给不同的承建单位，这种合同类型是？', options: ['A、总承包合同', 'B、单项承包合同', 'C、分包合同', 'D、转包合同'], answer: 'B', explanation: '讲义明确说明：“单项承包合同：业主将不同的工作任务，分别发包给不同的承建单位，并与其签订相应的合同。”' },
            { id: 13002, chapter: 13, group: 'theory', text: '签订分包合同应当同时具备的条件不包括以下哪项？', options: ['A、总承建单位具有相应资质', 'B、分包单位具有相应资质', 'C、分包项目经过业主单位同意', 'D、分包项目可以再分包'], answer: 'D', explanation: '讲义明确说明分包合同条件包括资质要求和业主同意，同时强调“禁止再分包”。' },
            { id: 13003, chapter: 13, group: 'theory', text: '在合同分类中，适用于项目工作量不大、工期较短、技术不太复杂的合同类型是？', options: ['A、总价合同', 'B、单价合同', 'C、成本加酬金合同', 'D、分包合同'], answer: 'A', explanation: '讲义明确说明：“总价合同...适用于项目工作量不大且能精确计算、工期较短、技术不太复杂、风险不大的项目。”' },
            { id: 13004, chapter: 13, group: 'theory', text: '合同争议处理的优先选择方式是？', options: ['A、仲裁', 'B、诉讼', 'C、协商', 'D、调解'], answer: 'C', explanation: '讲义明确说明：“应优先选择协商的方式”作为争议处理方式。' },
            { id: 13005, chapter: 13, group: 'theory', text: '合同管理的基本原则中，“预测项目风险及可能发生索赔的诱因”属于？', options: ['A、事前预控原则', 'B、实时纠偏原则', 'C、充分协商原则', 'D、公正处理原则'], answer: 'A', explanation: '讲义明确将预测风险和减少索赔列为“事前预控原则”的内容。' },
            { id: 13006, chapter: 13, group: 'theory', text: '在合同索赔处理中，反索赔是指？', options: ['A、承建单位向业主提出的索赔', 'B、业主单位向承建单位提出的索赔', 'C、监理单位向业主提出的索赔', 'D、分包单位向总包单位提出的索赔'], answer: 'B', explanation: '讲义明确说明：“反索赔是指业主单位向承建单位提出的索赔。”' },
            { id: 13007, chapter: 13, group: 'theory', text: '索赔处理程序中，首先应该做什么？', options: ['A、总监理工程师直接决定', 'B、申请方在合同期限内提交索赔申请', 'C、监理单位主动提出索赔', 'D、双方立即进行仲裁'], answer: 'B', explanation: '讲义明确索赔处理程序第一步：“申请方应在合同规定的期限内向监理机构提交索赔申请”。' },
            { id: 13008, chapter: 13, group: 'theory', text: '当业主单位违约导致合同最终解除时，监理单位确定承建单位应得款项不包括？', options: ['A、已完成工作的应得款项', 'B、合理的利润补偿', 'C、承建单位人员的个人债务', 'D、合同规定的违约金'], answer: 'C', explanation: '讲义列出了业主违约时承建单位应得的5项款项，都是与项目相关的费用，不包括承建单位人员的个人债务。' },
            { id: 13009, chapter: 13, group: 'theory', text: '知识产权分类中，“对产品的形状、构造提出的适于实用的新的方案”属于？', options: ['A、发明专利', 'B、实用新型专利', 'C、外观设计专利', 'D、商业秘密'], answer: 'B', explanation: '讲义明确说明：“实用新型：对产品的形状、构造提出的适于实用的新的方案。”' },
            { id: 13010, chapter: 13, group: 'theory', text: '在合同主要内容中，不属于基本条款的是？', options: ['A、业主与承建单位的权利与义务', 'B、项目质量要求和验收标准', 'C、项目组成员的个人简历', 'D、项目费用和付款方式'], answer: 'C', explanation: '讲义列出了合同的7个主要内容，都是项目管理和技术条款，不包括项目组成员的个人简历。' },
            { id: 13011, chapter: 13, group: 'theory', text: '合同履行管理的重点是什么？', options: ['A、合同签订管理', 'B、项目索赔管理', 'C、合同档案管理', 'D、人员管理'], answer: 'B', explanation: '讲义明确说明：“履约管理的重点——项目索赔管理”。' },
            { id: 13012, chapter: 13, group: 'theory', text: '当调解未能达成一致时，总监理工程师应该？', options: ['A、放弃调解', 'B、在合同规定期限内提出处理意见', 'C、直接做出最终裁决', 'D、要求双方立即仲裁'], answer: 'B', explanation: '讲义明确说明：“当调解未能达成一致时，总监理工程师应在合同规定的期限内提出处理该合同争议的意见。”' },
            { id: 13013, chapter: 13, group: 'theory', text: '对于不可抗力事件导致的损失，由业主单位承担的是？', options: ['A、承建单位设备损坏', 'B、承建单位人员伤亡', 'C、项目本身的损害', 'D、承建单位停工损失'], answer: 'C', explanation: '讲义明确说明不可抗力事件中：“项目本身的损害...由业主单位承担”。' },
            { id: 13014, chapter: 13, group: 'theory', text: '知识产权保护措施中，不属于软件著作权保护的是？', options: ['A、及时进行软件著作权登记', 'B、开展软件盗版状况调查', 'C、及时进行专利申请', 'D、请求司法部门介入追究责任'], answer: 'C', explanation: '讲义将“及时进行专利申请”列为专利权保护措施，而非软件著作权保护。' },
            { id: 13015, chapter: 13, group: 'theory', text: '在合同违约管理中，业主单位未按合同规定提供实施场地应承担的责任是？', options: ['A、偿付承建单位停工窝工损失', 'B、支付逾期违约金', 'C、承担修复费用', 'D、赔偿利润损失'], answer: 'A', explanation: '讲义明确说明业主违约责任：“未按合同规定的时间和要求提供实施场地...应偿付承建单位因此造成停工、窝工的实际损失”。' },
            { id: 13016, chapter: 13, group: 'theory', text: '关于总承包合同的描述，以下哪项是正确的？', options: ['A、业主必须与多个承包商签订合同', 'B、总承包合同只能以一个总合同形式签订', 'C、有利于发挥大承包商的专业优势', 'D、不利于项目整体协调管理'], answer: 'C', explanation: '讲义明确说明总承包合同：“有利于充分发挥具有较强的技术力量、丰富的经验和组织管理能力的大承包商的专业优势。”' },
            { id: 13017, chapter: 13, group: 'theory', text: '在分包合同的法律关系中，当分包项目出现问题时，业主单位可以？', options: ['A、只能要求总承建单位承担责任', 'B、只能要求分包单位承担责任', 'C、可以要求总承建单位或分包单位承担责任', 'D、只能要求监理单位承担责任'], answer: 'C', explanation: '讲义明确说明：“因分包的项目出现问题，业主单位既可以要求总承建单位承担责任，也可以直接要求分包单位承担责任。”' },
            { id: 13018, chapter: 13, group: 'theory', text: '以下哪种行为在合同管理中是被明确禁止的？', options: ['A、总承建单位将部分项目分包', 'B、分包单位将其承包的工程再分包', 'C、业主单位与多个承建单位签订合同', 'D、监理单位参与合同争议调解'], answer: 'B', explanation: '讲义明确说明：“禁止再分包，禁止分包单位将其承包的工程再分包。”' },
            { id: 13019, chapter: 13, group: 'theory', text: '在成本加酬金合同类型中，主要的风险承担者是？', options: ['A、承建单位', 'B、业主单位', 'C、监理单位', 'D、分包单位'], answer: 'B', explanation: '讲义明确说明：“业主单位须承担项目实际发生的一切费用，因此承担了项目的全部风险。”' },
            { id: 13020, chapter: 13, group: 'theory', text: '合同分析的主要内容不包括以下哪项？', options: ['A、分析合同漏洞，解释争议内容', 'B、分析合同风险，制定风险对策', 'C、分解合同并落实合同责任', 'D、重新谈判修改合同条款'], answer: 'D', explanation: '讲义列出了合同分析的三方面内容，都是基于现有合同的分析工作，不包括重新谈判修改条款。' },
            { id: 13021, chapter: 13, group: 'theory', text: '合同监督的重要内容包括？', options: ['A、修改合同条款', 'B、检查双方来往信函和文件', 'C、重新确定合同价格', 'D、更换合同签订方'], answer: 'B', explanation: '讲义明确说明合同监督的重要内容：“检查、解释双方来往的信函和文件，以及会议记录、业主单位指示等”。' },
            { id: 13022, chapter: 13, group: 'theory', text: '在索赔处理中，监理工程师处理索赔事件必须遵循的原则不包括？', options: ['A、必须以合同为依据', 'B、可以超出授权范围决定', 'C、公平合理原则', 'D、协商原则'], answer: 'B', explanation: '讲义明确说明授权原则：“监理工程师处理索赔事件，必须在合同规定、业主单位授权的权限之内”，不能超出授权范围。' },
            { id: 13023, chapter: 13, group: 'theory', text: '索赔报告的计算部分不需要阐明的是？', options: ['A、索赔要求总额', 'B、各项索赔款的计算', 'C、索赔事件的经过', 'D、各项开支的计算依据'], answer: 'C', explanation: '讲义说明计算部分需要阐明索赔总额、各项计算和依据，“索赔事件的经过”属于根据部分的内容。' },
            { id: 13024, chapter: 13, group: 'theory', text: '当承建单位违约导致项目质量不符合规定时，业主单位有权要求？', options: ['A、增加项目费用', 'B、限期无偿返工完善', 'C、延长项目工期', 'D、更换监理单位'], answer: 'B', explanation: '讲义明确说明：“承建单位违约导致项目质量不符合规定，业主单位有权要求承建单位限期无偿返工、完善”。' },
            { id: 13025, chapter: 13, group: 'theory', text: '在不可抗力事件中，由承建单位承担的是？', options: ['A、项目本身的损害', 'B、承建单位设备损坏及停工损失', 'C、项目所需清理修复费用', 'D、业主单位人员伤亡'], answer: 'B', explanation: '讲义明确说明不可抗力事件中：“承建单位设备损坏及停工损失，由承建单位承担”。' },
            { id: 13026, chapter: 13, group: 'theory', text: '知识产权分类中，“对产品的形状、图案所作出的新设计”属于？', options: ['A、发明专利', 'B、实用新型专利', 'C、外观设计专利', 'D、商业秘密'], answer: 'C', explanation: '讲义明确说明：“外观设计：是指对产品的形状、图案所作出的新设计。”' },
            { id: 13027, chapter: 13, group: 'theory', text: '企业知识产权管理体制中，“研发费用由总公司预付，专利权事宜由总公司统筹”属于？', options: ['A、集中管理体制', 'B、分散管理体制', 'C、分门别类管理体制', 'D、混合管理体制'], answer: 'A', explanation: '讲义说明集中管理体制：“研发的费用由总公司预付给子公司，而专利权与授权后的事宜全部由总公司知识产权管理部门统筹负责。”' },
            { id: 13028, chapter: 13, group: 'theory', text: '合同履行管理的方式分为？', options: ['A、主动控制和被动控制', 'B、前期控制和后期控制', 'C、技术控制和经济控制', 'D、质量控制和进度控制'], answer: 'A', explanation: '讲义明确说明合同控制：“分为主动控制和被动控制。主动控制是预先分析目标偏离的可能性；被动控制是从合同的执行中发现偏差。”' },
            { id: 13029, chapter: 13, group: 'theory', text: '在合同争议调解程序中，双方应如何向监理单位提出争议？', options: ['A、口头提出即可', 'B、书面提出并呈一份副本给对方', 'C、通过第三方转达', 'D、在会议上临时提出'], answer: 'B', explanation: '讲义明确要求：“双方都应书面向监理单位提出争议事宜，并呈一份副本给对方。”' },
            { id: 13030, chapter: 13, group: 'theory', text: '业主单位违反合同实施部分的责任不包括？', options: ['A、未按合同提供实施场地', 'B、项目中途停建缓建', 'C、验收超过期限', 'D、承建单位人员操作失误'], answer: 'D', explanation: '讲义列出了业主违反实施合同的责任，都是业主方的责任，不包括承建单位人员的操作失误。' },
            { id: 13031, chapter: 13, group: 'theory', text: '商业秘密的保护措施不包括？', options: ['A、制定保护规章制度', 'B、与员工签订保护协议', 'C、及时进行专利登记', 'D、对离职员工签订竞业协议'], answer: 'C', explanation: '讲义列出了商业秘密保护措施，“及时进行专利登记”属于专利权保护措施。' },
            { id: 13032, chapter: 13, group: 'theory', text: '在索赔依据中，不包括以下哪项？', options: ['A、国家法律法规', 'B、项目实施合同文件', 'C、监理单位内部规定', 'D、实施过程中的凭证'], answer: 'C', explanation: '讲义列出了索赔的4个依据，都是正式的法律法规和项目文件，不包括监理单位内部规定。' },
            { id: 13033, chapter: 13, group: 'theory', text: '当业主单位合理终止合同或承建单位不正当放弃项目时，业主单位有权？', options: ['A、要求承建单位赔偿全部损失', 'B、收回新旧承包商完成项目的费用差额', 'C、直接接管承建单位设备', 'D、单方面修改合同条款'], answer: 'B', explanation: '讲义明确说明：“业主单位有权从承建单位手中收回由新的承建单位完成全部项目所需的项目款与原合同未付部分的差额。”' },
            { id: 13034, chapter: 13, group: 'theory', text: '在知识产权保护中，由公安部门负责管理的是？', options: ['A、专利', 'B、商标', 'C、作品', 'D、商业秘密'], answer: 'D', explanation: '讲义明确说明：“商业秘密由公安部门负责”管理。' },
            { id: 13035, chapter: 13, group: 'theory', text: '合同管理制度中，“及时纠正、发现承建单位的错误和不当做法”属于？', options: ['A、事前预控原则', 'B、实时纠偏原则', 'C、充分协商原则', 'D、公正处理原则'], answer: 'B', explanation: '讲义明确说明实时纠偏原则：“及时纠正、发现承建单位的错误和不当的做法。”' }
        ];
        // ★★★ 第9节 监理组织与监理文件（35题）★★★
        const CHAPTER_9 = [
            { id: 9001, chapter: 9, group: 'theory', text: '在监理机构中，全面负责监理合同实施并确定监理机构人员分工的是？', options: ['A、总监理工程师代表', 'B、监理工程师', 'C、总监理工程师', 'D、监理员'], answer: 'C', explanation: '文档明确总监理工程师职责第一条：“全面负责监理合同的实施”，第二条：“确定监理机构人员分工并书面授权总监理工程师代表”。' },
            { id: 9002, chapter: 9, group: 'theory', text: '负责编制监理规划中本专业部分内容及监理实施细则的是？', options: ['A、总监理工程师', 'B、总监理工程师代表', 'C、监理工程师', 'D、监理员'], answer: 'C', explanation: '文档明确监理工程师职责第一条：“负责编制监理规划中本专业部分的内容及监理实施细则”。' },
            { id: 9003, chapter: 9, group: 'theory', text: '在监理工程师指导下开展监理工作，并担任现场监理工作的是？', options: ['A、总监理工程师代表', 'B、专业监理工程师', 'C、监理员', 'D、技术顾问'], answer: 'C', explanation: '文档明确监理员职责第一条：“在监理工程师的指导下开展监理工作”，第三条：“担任现场监理工作，发现问题及时向监理工程师报告”。' },
            { id: 9004, chapter: 9, group: 'theory', text: '监理大纲的主要作用不包括以下哪项？', options: ['A、使业主认可监理方案', 'B、为监理工作制定框架', 'C、直接指导现场监理操作', 'D、帮助获得监理业务'], answer: 'C', explanation: '文档说明监理大纲的作用是使业主认可方案、帮助获得业务、制定工作框架。监理大纲是方案性文件，不直接指导现场操作，现场操作由监理实施细则指导。' },
            { id: 9005, chapter: 9, group: 'theory', text: '监理大纲的编制依据不包括以下哪项？', options: ['A、业主单位的要求', 'B、监理单位的质量管理体系', 'C、监理实施细则', 'D、相关的法律法规'], answer: 'C', explanation: '文档列出监理大纲编制依据包括业主要求、质量管理体系、服务规范、法律法规等。监理实施细则是在监理合同签订后编制的，不是大纲的编制依据。' },
            { id: 9006, chapter: 9, group: 'theory', text: '监理规划编制的主要依据不包括以下哪项？', options: ['A、与工程建设有关的法律', 'B、监理大纲', 'C、监理实施细则', 'D、监理合同'], answer: 'C', explanation: '文档明确监理规划编制依据包括法律法规、监理有关的法规、项目标准、监理合同、监理大纲等。监理实施细则是在监理规划之后编制的，不是其依据。' },
            { id: 9007, chapter: 9, group: 'theory', text: '监理实施细则的编制要求不包括以下哪项？', options: ['A、符合项目专业特点', 'B、技术指标量化细化', 'C、完全照搬国家标准', 'D、考虑项目自身特点'], answer: 'C', explanation: '文档要求实施细则要“严格执行国家、地方的规范及标准并考虑项目自身的特点”，而不是完全照搬。' },
            { id: 9008, chapter: 9, group: 'theory', text: '以下哪项不是监理实施细则的编制方式？', options: ['A、按专业分工编制', 'B、按阶段编制', 'C、按监理工作内容编制', 'D、按公司行政结构编制'], answer: 'D', explanation: '文档明确监理实施细则的编制方式有：按专业分工、按阶段、按监理工作内容编制。没有按公司行政结构编制的方式。' },
            { id: 9009, chapter: 9, group: 'theory', text: '监理规划的作用不包括以下哪项？', options: ['A、监理机构职能的具体体现', 'B、指导监理机构全面工作', 'C、业主检查监理履责的依据', 'D、替代监理合同效力'], answer: 'D', explanation: '文档说明监理规划是“具有合同效力的一种文件”，但不能替代监理合同本身。' },
            { id: 9010, chapter: 9, group: 'theory', text: '在监理人员职责中，负责核查工程中所用设备、材料和软件的是？', options: ['A、总监理工程师', 'B、监理工程师', 'C、监理员', 'D、质量检测员'], answer: 'B', explanation: '文档明确监理工程师职责第五条：“负责核查工程及相关服务项目中所用的设备、材料和软件”。' },
            { id: 9011, chapter: 9, group: 'theory', text: '监理大纲的编制负责人通常是？', options: ['A、公司总监', 'B、总监理工程师', 'C、监理工程师', 'D、监理员'], answer: 'A', explanation: '文档表9-1明确显示监理大纲的负责人是“公司总监”。' },
            { id: 9012, chapter: 9, group: 'theory', text: '监理规划的编制负责人是？', options: ['A、公司总监', 'B、总监理工程师', 'C、监理工程师', 'D、监理员'], answer: 'B', explanation: '文档表9-1明确显示监理规划的负责人是“总监理工程师”。' },
            { id: 9013, chapter: 9, group: 'theory', text: '监理实施细则的编制负责人是？', options: ['A、公司总监', 'B、总监理工程师', 'C、监理工程师', 'D、监理员'], answer: 'C', explanation: '文档表9-1明确显示监理实施细则的负责人是“监理工程师”。' },
            { id: 9014, chapter: 9, group: 'theory', text: '监理大纲的编制时间是在？', options: ['A、监理招标阶段', 'B、监理合同签订后', 'C、监理机构建立后', 'D、项目验收阶段'], answer: 'A', explanation: '文档表9-1明确显示监理大纲的编制时间是“监理招标阶段”。' },
            { id: 9015, chapter: 9, group: 'theory', text: '监理规划的编制时间是在？', options: ['A、监理招标阶段', 'B、监理合同签订后', 'C、监理机构建立后', 'D、项目实施阶段'], answer: 'B', explanation: '文档表9-1明确显示监理规划的编制时间是“监理合同签订后”。' },
            { id: 9016, chapter: 9, group: 'theory', text: '根据监理人员职责，负责调解合同争议，参与索赔处理的是？', options: ['A、总监理工程师', 'B、监理工程师', 'C、监理员', 'D、法律顾问'], answer: 'A', explanation: '文档在总监理工程师职责中明确列出：“调解合同争议，参与索赔的处理，审批工程延期”。' },
            { id: 9017, chapter: 9, group: 'theory', text: '监理员在发现现场问题时应如何处理？', options: ['A、立即自行处理', 'B、记录在案但不报告', 'C、及时向监理工程师报告', 'D、要求承建单位直接解决'], answer: 'C', explanation: '文档明确监理员职责第三条：“担任现场监理工作，发现问题及时向监理工程师报告”。' },
            { id: 9018, chapter: 9, group: 'theory', text: '监理大纲的编制目的主要是？', options: ['A、供业主单位审查监理能力', 'B、指导现场监理操作', 'C、规范监理内部管理', 'D、替代监理合同'], answer: 'A', explanation: '文档表9-1明确监理大纲的编制目的是“供业主单位审查监理能力”。' },
            { id: 9019, chapter: 9, group: 'theory', text: '监理规划的编制目的主要是作为？', options: ['A、业主审查监理能力的依据', 'B、项目监理的工作纲领', 'C、专业监理的操作指南', 'D、承建单位施工依据'], answer: 'B', explanation: '文档表9-1明确监理规划的编制目的是“项目监理的工作纲领”。' },
            { id: 9020, chapter: 9, group: 'theory', text: '监理实施细则的编制目的主要是作为？', options: ['A、供业主审查监理能力', 'B、项目监理的工作纲领', 'C、专业监理实施的操作指南', 'D、承建单位投标依据'], answer: 'C', explanation: '文档表9-1明确监理实施细则的编制目的是“专业监理实施的操作指南”。' },
            { id: 9021, chapter: 9, group: 'theory', text: '在监理规划的内容中，不包括以下哪项？', options: ['A、工程概况', 'B、监理范围与目标', 'C、监理人员的具体考勤', 'D、监理依据与工作制度'], answer: 'C', explanation: '文档列出监理规划内容包括工程概况、监理范围与目标、监理机构组织及人员职责、监理依据与工作制度等，但不涉及具体的考勤管理。' },
            { id: 9022, chapter: 9, group: 'theory', text: '监理实施细则的编制依据不包括以下哪项？', options: ['A、已经批准的监理规划', 'B、国家法律法规和技术标准', 'C、监理单位的财务预算', 'D、工程实施方案'], answer: 'C', explanation: '文档列出监理实施细则编制依据包括监理规划、法律法规、设计文件、实施方案、合同文件等，不包括监理单位的财务预算。' },
            { id: 9023, chapter: 9, group: 'theory', text: '以下哪项属于总监理工程师代表的职责？', options: ['A、全面负责监理合同实施', 'B、确定监理机构人员分工', 'C、主持编制监理规划', 'D、代表总监理工程师行使部分职权'], answer: 'D', explanation: '文档定义总监理工程师代表：“由总监理工程师书面授权，代表总监理工程师行使其部分职权的监理工程师”。' },
            { id: 9024, chapter: 9, group: 'theory', text: '监理工程师需要定期向谁提交本专业监理工作实施情况报告？', options: ['A、业主单位', 'B、承建单位', 'C、总监理工程师', 'D、监理员'], answer: 'C', explanation: '文档明确监理工程师职责第七条：“定期向总监理工程师提交本专业监理工作实施情况报告”。' },
            { id: 9025, chapter: 9, group: 'theory', text: '在监理大纲中，监理工作目标的分析不包括以下哪方面？', options: ['A、质量控制', 'B、进度控制', 'C、投资控制', 'D、人员绩效考核'], answer: 'D', explanation: '文档说明监理工作目标从质量控制、进度控制、投资控制、合同管理、信息管理、安全管理等方面分析，不包括人员绩效考核。' },
            { id: 9026, chapter: 9, group: 'theory', text: '监理实施细则的编制要求中强调技术指标要？', options: ['A、尽可能模糊', 'B、量化细化', 'C、保持抽象', 'D、避免具体'], answer: 'B', explanation: '文档明确要求：“技术指标量化、细化，使其更具有可操作性”。' },
            { id: 9027, chapter: 9, group: 'theory', text: '监理规划的作用包括它是？', options: ['A、承建单位的施工指南', 'B、具有合同效力的一种文件', 'C、业主单位的项目管理手册', 'D、监理员的日常工作记录'], answer: 'B', explanation: '文档明确说明监理规划是“具有合同效力的一种文件”。' },
            { id: 9028, chapter: 9, group: 'theory', text: '监理员职责中包括？', options: ['A、审批工程变更', 'B、主持监理工作会议', 'C、审核付款申请', 'D、填写监理日志'], answer: 'D', explanation: '文档明确监理员职责包括：“填写监理日志”。' },
            { id: 9029, chapter: 9, group: 'theory', text: '监理大纲的内容重点在于？', options: ['A、具体的操作方法和标准', 'B、监理工作的目标和依据', 'C、详细的监理工作流程', 'D、监理人员的考勤记录'], answer: 'B', explanation: '文档表9-1显示监理大纲的内容重点是“监理工作目标、依据和范围”。' },
            { id: 9030, chapter: 9, group: 'theory', text: '监理实施细则的内容重点在于？', options: ['A、监理工作的目标和依据', 'B、具体的操作方法和标准', 'C、监理机构的组织形式', 'D、监理招标文件分析'], answer: 'B', explanation: '文档表9-1显示监理实施细则的内容重点是“具体的操作方法和标准”。' },
            { id: 9031, chapter: 9, group: 'theory', text: '按专业分工编制监理实施细则时，可能涉及的专业领域不包括？', options: ['A、通信工程', 'B、软件开发', 'C、设备选型', 'D、人力资源管理'], answer: 'D', explanation: '文档说明按专业分工可能涉及通信工程、软件开发、设备选型等专业技术领域，人力资源管理不属于工程专业技术领域。' },
            { id: 9032, chapter: 9, group: 'theory', text: '在监理工作流程中设置控制点的目的是？', options: ['A、增加监理工作量', 'B、便于检测和纠正问题', 'C、延长工程工期', 'D、简化监理程序'], answer: 'B', explanation: '文档说明：“在工程过程中设置一些容易检测和纠正的标志性时机作为控制点”。' },
            { id: 9033, chapter: 9, group: 'theory', text: '监理工程师需要协助总监理工程师审查什么？', options: ['A、本专业的计划、方案、申请、变更', 'B、其他专业的监理工作', 'C、监理单位的财务预算', 'D、业主单位的行政事务'], answer: 'A', explanation: '文档明确监理工程师职责第四条：“协助总监理工程师审查本专业的计划、方案、申请、变更”。' },
            { id: 9034, chapter: 9, group: 'theory', text: '监理大纲的编制作用主要是？', options: ['A、增强监理项目中标的可能性', 'B、指导监理日常工作', 'C、规范监理资料管理', 'D、替代工程设计方案'], answer: 'A', explanation: '文档表9-1明确监理大纲的编制作用是“增强监理项目中标的可能性”。' },
            { id: 9035, chapter: 9, group: 'theory', text: '监理实施细则的编制作用主要是？', options: ['A、供业主审查监理能力', 'B、使监理工作规范化', 'C、帮助获得监理业务', 'D、替代监理规划'], answer: 'B', explanation: '文档表9-1明确监理实施细则的编制作用是“规定专业监理程序、方法、标准，使监理工作规范化”。' }
        ];

        // ★★★ 第10节 质量控制（35题）★★★
        const CHAPTER_10 = [
            { id: 10001, chapter: 10, group: 'theory', text: '信息系统工程质量控制的基础性特点不包括以下哪项？', options: ['A、人的智力劳动', 'B、需求变更无风险', 'C、质量缺陷隐蔽', 'D、改正错误代价大'], answer: 'B', explanation: '讲义明确列出了质量控制的多个基础特点，包括“需求变更有风险”，而不是“无风险”。' },
            { id: 10002, chapter: 10, group: 'theory', text: '在质量控制中，监理单位与业主单位的关系是？', options: ['A、监理单位独立承担所有质量责任', 'B、业主单位承担全部质量责任', 'C、双方共同承担监督管理任务', 'D、承建单位承担所有质量责任'], answer: 'C', explanation: '讲义明确指出：“监理单位与业主单位共同承担对项目的监督管理任务。”' },
            { id: 10003, chapter: 10, group: 'theory', text: '对质量影响因素的控制中，“持证上岗，禁止违章作业”主要控制的是？', options: ['A、材料和设备', 'B、实施方案与方法', 'C、人的行为', 'D、环境因素'], answer: 'C', explanation: '讲义在对人的行为控制中举例说明：“比如持证上岗，禁止违章作业和野蛮施工。”' },
            { id: 10004, chapter: 10, group: 'theory', text: '在材料和设备的质量控制中，进口材料设备应配合哪个部门做好开箱检查？', options: ['A、安全部门', 'B、商检部门', 'C、税务部门', 'D、海关部门'], answer: 'B', explanation: '讲义明确要求：“对进口材料、设备应配合商检部门做好开箱检查。”' },
            { id: 10005, chapter: 10, group: 'theory', text: '在三方协同质量控制中，谁是整个项目质量保证的关键？', options: ['A、业主单位', 'B、监理单位', 'C、承建单位', 'D、设计单位'], answer: 'C', explanation: '讲义明确指出：“承建单位是工程建设实施方，因此承建单位是整个项目质量保证的关键。”' },
            { id: 10006, chapter: 10, group: 'theory', text: '承建单位质量管理体系建设的要求不包括以下哪项？', options: ['A、制订明确的质量计划', 'B、建立灵敏的质量信息反馈系统', 'C、实现管理业务标准化', 'D、由监理单位直接管理质量工作'], answer: 'D', explanation: '讲义列出了承建单位质量管理体系的5个要求，都是承建单位自身要建立的体系，监理单位是监督而不是直接管理。' },
            { id: 10007, chapter: 10, group: 'theory', text: '评审工作通常在什么时候进行？', options: ['A、项目开始时', 'B、项目结束后', 'C、主要项目里程碑接近完成时', 'D、每月固定时间'], answer: 'C', explanation: '讲义明确说明：“在主要的项目里程碑接近完成时进行，例如总体设计、编码或测试完成时。”' },
            { id: 10008, chapter: 10, group: 'theory', text: '以下哪项不是评审的依据？', options: ['A、国家和行业标准', 'B、监理工程师提供的监理信息', 'C、承建单位的财务报表', 'D、有关部门的项目文件和批示'], answer: 'C', explanation: '讲义列出了评审的4个依据，都是与项目质量相关的技术和管理依据，不包含承建单位的财务报表。' },
            { id: 10009, chapter: 10, group: 'theory', text: '监理在测试工作中的职责不包括以下哪项？', options: ['A、督促建立项目测试体系', 'B、直接替代承建单位测试', 'C、审核测试方案及计划', 'D、对测试结果进行审查'], answer: 'B', explanation: '讲义说明监理是“监督承建单位的测试工作”和“亲自测试重要环节”，但不是直接替代承建单位进行所有测试。' },
            { id: 10010, chapter: 10, group: 'theory', text: '现场旁站监理比较适合以下哪种情况？', options: ['A、日常办公会议', 'B、设备开箱检验', 'C、承建单位内部培训', 'D、业主单位需求讨论'], answer: 'B', explanation: '讲义明确说明旁站“比较适合网络基础设施建设、设备开箱检验、机房建设、隐蔽工程”。' },
            { id: 10011, chapter: 10, group: 'theory', text: '设置质量控制点的目的不包括以下哪项？', options: ['A、将质量总目标分解为分目标', 'B、增加监理工作量', 'C、突出重点控制', 'D、有利于三方共同控制'], answer: 'B', explanation: '讲义列出了设置质量控制点的5个目的，都是为了提高质量控制效果，而不是为了增加工作量。' },
            { id: 10012, chapter: 10, group: 'theory', text: '在招标阶段的质量控制中，监理的工作不包括以下哪项？', options: ['A、协助提出工程需求方案', 'B、直接确定中标单位', 'C、参与招标文件编制', 'D、协助制定投标文件质量评定标准'], answer: 'B', explanation: '讲义列出了监理在招标阶段的8项工作，都是协助和监督工作，监理不能直接确定中标单位。' },
            { id: 10013, chapter: 10, group: 'theory', text: '设计阶段质量控制中，监理对设计方案的处理方式是？', options: ['A、设计方案由承建单位直接实施', 'B、设计方案经监理工程师审定后由总监理工程师签发', 'C、设计方案无需监理审查', 'D、设计方案由业主单位直接批准'], answer: 'B', explanation: '讲义明确说明：“设计方案经监理工程师审定后，由总监理工程师审定签发。”' },
            { id: 10014, chapter: 10, group: 'theory', text: '在实施阶段，发现人员与实施方案不一致时，监理应该？', options: ['A、忽略此问题', 'B、要求严格按照实施方案更换或申请更换人员', 'C、立即签发停工令', 'D、直接处罚相关人员'], answer: 'B', explanation: '讲义明确要求：“发现人员与实施方案不一致时，应要求承建单位严格按照实施方案更换或申请更换人员。”' },
            { id: 10015, chapter: 10, group: 'theory', text: '验收阶段监理的工作不包括以下哪项？', options: ['A、审核初验/终验计划及方案', 'B、直接代替业主进行验收', 'C、审核初验/终验条件', 'D、确认初验/终验结果'], answer: 'B', explanation: '讲义列出了验收阶段监理的4项工作，都是审核、协助、确认等工作，监理不能直接代替业主进行验收。' },
            { id: 10016, chapter: 10, group: 'theory', text: '关于信息系统工程质量控制，以下哪项描述是正确的？', options: ['A、质量控制只需在验收阶段进行', 'B、监理单位应实施全过程不间断控制', 'C、只需控制关键节点，无需全面控制', 'D、质量缺陷很容易发现和定位'], answer: 'B', explanation: '讲义明确要求：“对项目的实施全过程不间断地进行质量控制。”' },
            { id: 10017, chapter: 10, group: 'theory', text: '在质量控制中，对自研初次使用的设备，正确的处理方式是？', options: ['A、直接投入使用', 'B、先提出试用要求，试验合格后使用', 'C、由监理单位决定是否使用', 'D、由业主单位批准后立即使用'], answer: 'B', explanation: '讲义明确要求：“对自研的初次使用的设备，应先提出试用要求，试验合格后，才能使用。”' },
            { id: 10018, chapter: 10, group: 'theory', text: '监理单位在质量控制中的重点工作是？', options: ['A、监督工程关键性过程和检查阶段性结果', 'B、替代承建单位进行具体实施', 'C、负责所有材料的采购', 'D、管理业主单位的资金使用'], answer: 'A', explanation: '讲义明确指出：“重点是监督工程关键性过程和检查工程阶段性结果。”' },
            { id: 10019, chapter: 10, group: 'theory', text: '在评审过程中，由谁判断是否进行评审并形成评审方案？', options: ['A、业主单位代表', 'B、承建单位项目经理', 'C、总监理工程师', 'D、现场质量监理工程师'], answer: 'C', explanation: '讲义明确评审过程：“总监理工程师判断是否进行评审，若可以评审，要形成评审方案。”' },
            { id: 10020, chapter: 10, group: 'theory', text: '关于测试工作的监理，以下哪项是正确的？', options: ['A、监理单位不需要了解测试工作', 'B、承建单位的测试计划只需自己确认', 'C、监理应对测试问题改进过程进行跟踪', 'D、测试工具的选择无需监理审核'], answer: 'C', explanation: '讲义明确监理在测试工作中的职责包括：“对测试问题改进过程进行跟踪。”' },
            { id: 10021, chapter: 10, group: 'theory', text: '现场抽查测试通常在什么情况下进行？', options: ['A、只在项目结束时进行', 'B、当监理工程师发现质量疑点时', 'C、每周固定时间进行', 'D、仅对软件进行抽查'], answer: 'B', explanation: '讲义说明：“当现场监理工程师发现质量疑点时，要进行现场抽查测试。”' },
            { id: 10022, chapter: 10, group: 'theory', text: '对于第三方测试机构的监理工作不包括以下哪项？', options: ['A、协助业主选择第三方测试机构', 'B、直接管理第三方测试机构人员', 'C、对测试计划进行确认', 'D、协调各方工作关系'], answer: 'B', explanation: '讲义列出了对第三方测试机构监理的4项工作，都是协调、确认、协助等工作，不包括直接管理人员。' },
            { id: 10023, chapter: 10, group: 'theory', text: '质量控制点的设置原则不包括以下哪项？', options: ['A、突出重点', 'B、增加工作复杂度', 'C、易于纠偏', 'D、有利于三方共同控制'], answer: 'B', explanation: '讲义列出了设置质量控制点的5个原则，都是为了提高控制效果，“增加工作复杂度”不是其原则。' },
            { id: 10024, chapter: 10, group: 'theory', text: '在招标阶段，监理对投标文件质量评定标准的工作是？', options: ['A、独立制定评定标准', 'B、协助招标公司和业主单位制定', 'C、直接采用以往项目标准', 'D、由承建单位制定标准'], answer: 'B', explanation: '讲义明确监理在招标阶段应：“协助招标公司和业主单位制定投标文件的质量评定标准。”' },
            { id: 10025, chapter: 10, group: 'theory', text: '设计阶段，监理组织设计文件及方案交底会的主要目的是？', options: ['A、帮助承建单位熟悉项目要求', 'B、替代设计单位进行设计', 'C、审查设计单位的资质', 'D、确定设计费用'], answer: 'A', explanation: '讲义说明：“组织设计文件及方案交底会，帮助承建单位熟悉项目要求。”' },
            { id: 10026, chapter: 10, group: 'theory', text: '实施阶段，当发现工程存在重大质量隐患时，监理应该？', options: ['A、忽略继续观察', 'B、及时签发停工令并报业主单位', 'C、直接要求更换承建单位', 'D、仅做记录不采取行动'], answer: 'B', explanation: '讲义明确要求：“若发现工程实施过程存在重大质量隐患，应及时向承建单位签发停工令，并报业主单位。”' },
            { id: 10027, chapter: 10, group: 'theory', text: '验收阶段，监理对初验/终验条件的处理方式是？', options: ['A、无需审核直接签认', 'B、审核必备条件，具备条件时予以签认', 'C、由承建单位自行决定', 'D、仅做形式审查'], answer: 'B', explanation: '讲义明确要求：“审核初验/终验的必备条件。具备初验/终验条件时，监理单位在初验/终验报告表中予以签认。”' },
            { id: 10028, chapter: 10, group: 'theory', text: '关于隐蔽工程的质量控制，以下哪项是正确的？', options: ['A、无需特别关注', 'B、把隐蔽工程实施过程作为控制点', 'C、隐蔽工程无法控制', 'D、由承建单位自行处理即可'], answer: 'B', explanation: '讲义在质量控制点设置中举例说明：“把隐蔽工程的实施过程作为一个控制点，可以及时纠正。”' },
            { id: 10029, chapter: 10, group: 'theory', text: '在质量控制中，对分包单位的正确处理方式是？', options: ['A、由总承建单位全权负责', 'B、监理单位应组织审核分包单位资质', 'C、无需审核直接认可', 'D、由业主单位直接管理'], answer: 'B', explanation: '讲义在实施阶段质量控制中要求：“有分包单位时，应组织审核分包单位的工程实施资质。”' },
            { id: 10030, chapter: 10, group: 'theory', text: '关于旁站记录的作用，以下哪项是正确的？', options: ['A、只是形式文件没有实际作用', 'B、是监理行使签字权的重要依据', 'C、仅用于内部参考', 'D、由承建单位负责填写'], answer: 'B', explanation: '讲义明确说明旁站记录：“是监理行使签字权的重要依据，是对工程质量的签认资料。”' },
            { id: 10031, chapter: 10, group: 'theory', text: '在材料设备质量控制中，对保管不善或超期使用的处理方式是？', options: ['A、直接报废处理', 'B、继续使用不影响', 'C、取样测试合格后才能使用', 'D、由业主单位决定是否使用'], answer: 'C', explanation: '讲义明确要求：“对保管不善或使用期限超过规定的，应取样测试，经检验合格后，才能使用。”' },
            { id: 10032, chapter: 10, group: 'theory', text: '监理在软件开发项目测试中的特殊工作是？', options: ['A、替代开发人员进行编码', 'B、对重要功能性能进行模拟测试', 'C、管理开发团队', 'D、决定开发工具选择'], answer: 'B', explanation: '讲义说明：“对于软件开发项目，监理单位要对重要的功能、性能、安全性等进行模拟测试。”' },
            { id: 10033, chapter: 10, group: 'theory', text: '质量控制点的动态性是指？', options: ['A、一旦设定不能改变', 'B、根据实际情况可以调整', 'C、由承建单位单方面决定', 'D、仅在设计阶段有效'], answer: 'B', explanation: '讲义说明质量控制点具有：“设置的灵活性和动态性。根据实际情况，对已设立的质量控制点进行调整或增减。”' },
            { id: 10034, chapter: 10, group: 'theory', text: '在评审过程中，最终的监理意见由谁提交给业主和承建单位？', options: ['A、现场质量监理工程师', 'B、总监理工程师', 'C、承建单位代表', 'D、业主单位代表'], answer: 'B', explanation: '讲义明确评审过程：“总监理工程师根据评审结论...形成最终的监理意见，提交给业主单位和承建单位。”' },
            { id: 10035, chapter: 10, group: 'theory', text: '对于少量设备到货的验收方式应该是？', options: ['A、抽查部分设备', 'B、逐一检查', 'C、免检直接使用', 'D、由运输单位确认'], answer: 'B', explanation: '讲义在抽查说明中明确：“大量（成百上千）设备到货，可抽查。少量设备到货，逐一检查。”' }
        ];

        // ★★★ 第12节 投资控制（39题）★★★
        const CHAPTER_12 = [
            { id: 12001, chapter: 12, group: 'theory', text: '投资控制中强调“不仅使投资目标满足业主需求，还要兼顾进度和质量目标”的原则是？', options: ['A、投资优化原则', 'B、系统原则', 'C、全面成本控制原则', 'D、动态控制原则'], answer: 'B', explanation: '文档明确说明系统原则：“不仅使投资目标满足业主的需求，还要兼顾进度目标和质量目标。”' },
            { id: 12002, chapter: 12, group: 'theory', text: '通过各种成本管理手段，在保证项目进度和质量的前提下，实现目标成本最优化描述的是？', options: ['A、全面成本控制原则', 'B、投资优化原则', 'C、动态控制原则', 'D、目标管理原则'], answer: 'B', explanation: '文档明确说明投资优化原则：“通过各种成本管理手段，在保证项目进度和质量的前提下，实现目标成本最优化。”' },
            { id: 12003, chapter: 12, group: 'theory', text: '在投资控制过程中，实施阶段的主要工作是？', options: ['A、确定成本目标', 'B、根据成本控制方案进行动态纠偏', 'C、成本盈亏已定局', 'D、分解落实计划目标'], answer: 'B', explanation: '文档明确说明实施阶段：“根据成本控制方案进行动态纠偏，采取有针对性的纠偏措施。”' },
            { id: 12004, chapter: 12, group: 'theory', text: '以下哪项是规划成本管理的依据？', options: ['A、成本管理计划', 'B、项目章程', 'C、经验教训登记册', 'D、资源需求'], answer: 'B', explanation: '文档明确规划成本管理的依据包括：“(1)项目章程：规定了预先批准的项目投资。”' },
            { id: 12005, chapter: 12, group: 'theory', text: '成本管理计划中，“为成本估算规定的可接受的区间（例如±10%）”指的是？', options: ['A、计量单位', 'B、准确度', 'C、精确度', 'D、控制临界值'], answer: 'B', explanation: '文档明确说明：“准确度：为成本估算规定的可接受的区间，例如±10%。”' },
            { id: 12006, chapter: 12, group: 'theory', text: '使用以往类似项目的实际数据作为估计基础的成本估算方法是？', options: ['A、参数估算', 'B、类比估算', 'C、自下而上估算', 'D、三点估算'], answer: 'B', explanation: '文档明确说明：“类比估算：使用以往类似项目的实际数据作为估计现在项目的基础。”' },
            { id: 12007, chapter: 12, group: 'theory', text: '把项目特征作为参数，通过建立数学模型进行成本估算的方法是？', options: ['A、三点估算', 'B、参数估算', 'C、类比估算', 'D、自下而上估算'], answer: 'B', explanation: '文档明确说明：“参数估算：是指把项目的一些特征作为参数，通过建立一个数学模型来进行项目工作的成本估算。”' },
            { id: 12008, chapter: 12, group: 'theory', text: '首先估计各个独立工作的费用，然后汇总得出总费用的估算方法是？', options: ['A、参数估算', 'B、类比估算', 'C、自下而上估算', 'D、三点估算'], answer: 'C', explanation: '文档明确说明：“自下而上估算：通常首先估计各个独立工作的费用，然后再汇总，从下往上估计出整个项目的总费用。”' },
            { id: 12009, chapter: 12, group: 'theory', text: '在三点估算中，三角分布的预期成本计算公式是？', options: ['A、(Co + 4Cm + Cp) ÷ 6', 'B、(Co + Cm + Cp) ÷ 3', 'C、Cm ÷ (Co + Cp)', 'D、Co + Cm + Cp'], answer: 'B', explanation: '文档明确给出三角分布公式：“预期成本 = (Co + Cm + Cp) ÷ 3”。' },
            { id: 12010, chapter: 12, group: 'theory', text: '精确度在-25%～75%之间的预算类型是？', options: ['A、预算估算', 'B、最终预算', 'C、量级预算', 'D、详细估算'], answer: 'C', explanation: '文档说明量级预算：“精确度一般是从-25%～75%”。预算估算为-10%～25%，最终预算为-5%～10%。' },
            { id: 12011, chapter: 12, group: 'theory', text: '成本基准是指？', options: ['A、项目总预算', 'B、经过批准的、按时间段分配的项目预算', 'C、实际成本累计值', 'D、预计债务总额'], answer: 'B', explanation: '文档明确定义：“成本基准：是经过批准的、按时间段分配的项目预算”。' },
            { id: 12012, chapter: 12, group: 'theory', text: '预算审核方法中，“组织一批分专业的预算工程师进行全面审核”的方法是？', options: ['A、重点审核法', 'B、经验审核法', 'C、全面审核法', 'D、分解对比审核法'], answer: 'C', explanation: '文档说明全面审核法：“需要组织一批分专业的预算工程师、经济师进行”。' },
            { id: 12013, chapter: 12, group: 'theory', text: '在挣值分析中，“对已完成工作的测量值”指的是？', options: ['A、计划价值(PV)', 'B、挣值(EV)', 'C、实际成本(AC)', 'D、成本偏差(CV)'], answer: 'B', explanation: '文档明确定义：“挣值(EV)是对已完成工作的测量值”。' },
            { id: 12014, chapter: 12, group: 'theory', text: '当进度偏差SV＞0时，表明？', options: ['A、进度滞后', 'B、进度超前', 'C、按计划进行', 'D、无法判断'], answer: 'B', explanation: '文档明确说明：“当SV＞0时，表明进度超前；当SV＜0时，表明进度滞后”。' },
            { id: 12015, chapter: 12, group: 'theory', text: '当成本偏差CV＜0时，表明？', options: ['A、成本节约', 'B、成本超支', 'C、按计划进行', 'D、无法判断'], answer: 'B', explanation: '文档明确说明：“当CV＞0时，表明成本节约；当CV＜0时，表明成本超支”。' },
            { id: 12016, chapter: 12, group: 'theory', text: '在ABC分析法中，发生频率为70%～80%的因素属于？', options: ['A、A类因素', 'B、B类因素', 'C、C类因素', 'D、D类因素'], answer: 'A', explanation: '文档明确说明：“A类因素，发生频率为70%～80%，是主要影响因素。”' },
            { id: 12017, chapter: 12, group: 'theory', text: '监理投资控制措施中，“正确选择技术实施方案”属于？', options: ['A、组织措施', 'B、技术措施', 'C、经济措施', 'D、合同措施'], answer: 'B', explanation: '文档明确将“正确选择技术实施方案”列为技术措施。' },
            { id: 12018, chapter: 12, group: 'theory', text: '监理投资控制措施中，“精简不必要的人员和过程”属于？', options: ['A、组织措施', 'B、技术措施', 'C、经济措施', 'D、合同措施'], answer: 'C', explanation: '文档明确将“精简不必要的人员和过程”列为经济措施中的间接费控制。' },
            { id: 12019, chapter: 12, group: 'theory', text: '工程价款结算方式中，“以合同签订、验收完毕等里程碑作为结算条件”的方式是？', options: ['A、按月预支完工结算', 'B、按工程标志性任务完成结算', 'C、按旬预支按月结算', 'D、按进度预支完工结算'], answer: 'B', explanation: '文档明确说明：“按工程标志性任务完成结算。如以合同签订、验收完毕等里程碑式任务作为结算条件。较为常见。”' },
            { id: 12020, chapter: 12, group: 'theory', text: '在竣工结算审核中，“审核项目成本计划的执行情况”属于？', options: ['A、审核各项费用支出', 'B、审核成本计划执行', 'C、审核报废损失', 'D、审核账目资料'], answer: 'B', explanation: '文档明确将“审核项目成本计划的执行情况”列为竣工结算审核的第一项内容。' },
            { id: 12021, chapter: 12, group: 'theory', text: '成本自始至终置于有效的控制之下，防止成本控制人人有责，人人不管描述的是哪项投资控制原则？', options: ['A、系统原则', 'B、投资优化原则', 'C、全面成本控制原则', 'D、动态控制原则'], answer: 'C', explanation: '文档明确说明全面成本控制原则：“使成本自始至终置于有效的控制之下，防止成本控制人人有责，人人不管。”' },
            { id: 12022, chapter: 12, group: 'theory', text: '把计划的方针、任务、目标和措施等加以逐一分解落实描述的是哪项投资控制原则？', options: ['A、目标管理原则', 'B、责任权利相结合原则', 'C、微观控制原则', 'D、设计监理原则'], answer: 'A', explanation: '文档明确说明目标管理原则：“把计划的方针、任务、目标和措施等加以逐一分解落实。”' },
            { id: 12023, chapter: 12, group: 'theory', text: '在成本管理计划中，“设定成本估算向上或向下取整的程度”指的是？', options: ['A、计量单位', 'B、准确度', 'C、精确度', 'D、控制临界值'], answer: 'C', explanation: '文档明确说明：“精确度：设定成本估算向上或向下取整的程度。”' },
            { id: 12024, chapter: 12, group: 'theory', text: '以下哪项不是成本估算的依据？', options: ['A、成本管理计划', 'B、质量管理计划', 'C、项目进度计划', 'D、承建单位利润目标'], answer: 'D', explanation: '文档列出了成本估算的7个依据，都是项目管理和技术文件，不包括承建单位的利润目标。' },
            { id: 12025, chapter: 12, group: 'theory', text: '参数估算法在以下哪种情况下是可靠的？', options: ['A、历史数据精确且参数易定量化', 'B、仅凭个人经验判断', 'C、没有可用历史数据', 'D、参数模型不成熟'], answer: 'A', explanation: '文档明确说明参数估算法可靠的条件：“用来建模的历史数据是精确的；用来建模的参数容易定量化；模型对大型项目适用，也对小型项目适用。”' },
            { id: 12026, chapter: 12, group: 'theory', text: '在三点估算中，贝塔分布的预期成本计算公式是？', options: ['A、(Co + Cm + Cp) ÷ 3', 'B、(Co + 4Cm + Cp) ÷ 6', 'C、Cm ÷ (Co + Cp)', 'D、Co + Cm + Cp'], answer: 'B', explanation: '文档明确给出贝塔分布公式：“预期成本 = (Co + 4 × Cm + Cp) ÷ 6”。' },
            { id: 12027, chapter: 12, group: 'theory', text: '精确度在-10%～25%之间的预算类型是？', options: ['A、量级预算', 'B、预算估算', 'C、最终预算', 'D、详细估算'], answer: 'B', explanation: '文档说明预算估算：“其精确度一般在-10%～25%”。量级预算为-25%～75%，最终预算为-5%～10%。' },
            { id: 12028, chapter: 12, group: 'theory', text: '成本预算常用技术中，“汇总单个活动的估算成本，建立成本基准”的方法是？', options: ['A、储备分析', 'B、历史信息审核', 'C、成本汇总', 'D、资金限制平衡'], answer: 'C', explanation: '文档说明成本汇总：“汇总单个活动的估算成本，最终得出整个项目的总成本，建立一个经批准的成本基准的过程。”' },
            { id: 12029, chapter: 12, group: 'theory', text: '预算审核方法中，“根据以往的实践经验，审核容易发生差错的工程细目”的方法是？', options: ['A、全面审核法', 'B、重点审核法', 'C、经验审核法', 'D、分解对比审核法'], answer: 'C', explanation: '文档说明经验审核法：“即监理工程师根据以往的实践经验，审核容易发生差错的那些工程细目的方法。”' },
            { id: 12030, chapter: 12, group: 'theory', text: '在挣值分析中，“在某个给定的时间点，代表着应该已经完成的工作”指的是？', options: ['A、计划价值(PV)', 'B、挣值(EV)', 'C、实际成本(AC)', 'D、进度偏差(SV)'], answer: 'A', explanation: '文档明确定义：“计划价值（PV）代表着应该已经完成的工作。”' },
            { id: 12031, chapter: 12, group: 'theory', text: '在ABC分析法中，发生频率为10%～20%的因素属于？', options: ['A、A类因素', 'B、B类因素', 'C、C类因素', 'D、D类因素'], answer: 'B', explanation: '文档明确说明：“B类因素，发生频率为10%～20%，是次要影响因素。”' },
            { id: 12032, chapter: 12, group: 'theory', text: '监理投资控制措施中，“在项目监理机构中落实投资控制人员分工”属于？', options: ['A、组织措施', 'B、技术措施', 'C、经济措施', 'D、合同措施'], answer: 'A', explanation: '文档明确将“在项目监理机构中落实投资控制人员、任务分工和职能责任”列为组织措施。' },
            { id: 12033, chapter: 12, group: 'theory', text: '监理投资控制措施中，“利用合同的约束力进行投资控制”属于？', options: ['A、组织措施', 'B、技术措施', 'C、经济措施', 'D、合同措施'], answer: 'D', explanation: '文档明确将“监理工程师利用合同的约束力进行投资控制”列为合同措施。' },
            { id: 12034, chapter: 12, group: 'theory', text: '工程计量工作的负责方式不包括？', options: ['A、由承建单位负责提供记录', 'B、由监理工程师负责计量', 'C、由业主单位直接计量', 'D、由双方共同确认'], answer: 'C', explanation: '文档说明了两种工程计量负责方式：由承建单位负责或由监理工程师负责，没有提到由业主单位直接计量。' },
            { id: 12035, chapter: 12, group: 'theory', text: '按阶段支付工程款时，最终由谁签发工程款支付意见？', options: ['A、监理工程师', 'B、总监理工程师', 'C、业主单位代表', 'D、承建单位项目经理'], answer: 'B', explanation: '文档明确支付流程：“监理工程师审核后，总监理工程师签发工程款支付意见，报业主单位签认。”' },
            { id: 12036, chapter: 12, group: 'theory', text: '项目竣工结算的编制由谁负责汇总？', options: ['A、承建单位', 'B、监理单位', 'C、业主单位', 'D、设计单位'], answer: 'C', explanation: '文档明确说明：“项目竣工结算由业主单位汇总编制。”' },
            { id: 12037, chapter: 12, group: 'theory', text: '竣工结算审核内容中，“审核报废损失和核销损失的真实性”的目的是？', options: ['A、检查成本计划执行', 'B、审核费用支出合理性', 'C、尽量回收利用减少损失', 'D、审核账目准确性'], answer: 'C', explanation: '文档说明审核报废损失：“对报废工程要进行认真审核，要尽量回收利用减少损失。”' },
            { id: 12038, chapter: 12, group: 'theory', text: '在单方案经济评价方法中，“以工程项目的净收益补偿全部成本所需要的时间”指的是？', options: ['A、动态成本回收期', 'B、静态成本回收期', 'C、等效年值', 'D、净现值'], answer: 'B', explanation: '文档明确定义：“静态成本回收期是指以工程项目的净收益补偿全部成本所需要的时间。”' },
            { id: 12039, chapter: 12, group: 'theory', text: '技术经济分析中，最佳方案的标志是？', options: ['A、技术上最佳，经济上最合理', 'B、投资最少', 'C、工期最短', 'D、技术最先进'], answer: 'A', explanation: '文档明确说明：“最佳方案的标志是技术上最佳，经济上最合理而不是投资最少。”' }
        ];

        // ★★★ 第14节 信息与文档管理（30题）★★★
        const CHAPTER_14 = [
            { id: 14001, chapter: 14, group: 'theory', text: '以下哪项不属于信息的基本特征？', options: ['A、现实性', 'B、适时性', 'C、主观性', 'D、增值性'], answer: 'C', explanation: '信息的基本特征包括现实性、适时性、复杂性、共用性、增值性等，主观性不属于信息的基本特征。' },
            { id: 14002, chapter: 14, group: 'theory', text: '下列哪项属于引导信息？', options: ['A、实施方案', 'B、设备出厂证明书', 'C、中间产品检查验收签证', 'D、物价指数'], answer: 'A', explanation: '引导信息包括实施方案、实施组织设计、技术标准和规程等；B、C属于辨识信息；D属于投资控制信息。' },
            { id: 14003, chapter: 14, group: 'theory', text: '以下哪项不属于投资控制信息？', options: ['A、投资估算', 'B、工程预算', 'C、项目日志', 'D、物价指数'], answer: 'C', explanation: '项目日志属于进度控制信息，其他三项均为投资控制信息。' },
            { id: 14004, chapter: 14, group: 'theory', text: '监理信息资料管理中，负责文档版本管理的是：', options: ['A、总监理工程师', 'B、专业监理工程师', 'C、文档管理员', 'D、承建单位代表'], answer: 'A', explanation: '监理信息资料管理由总监理工程师负责，并指定专人实施，版本管理是其中一项重要内容。' },
            { id: 14005, chapter: 14, group: 'theory', text: '以下哪项不属于监理实施类文档？', options: ['A、监理规划', 'B、工程质量监理文档', 'C、工程监理日报', 'D、监理总结报告'], answer: 'A', explanation: '监理规划属于总控类文档；B、C、D属于监理实施类文档。' },
            { id: 14006, chapter: 14, group: 'theory', text: '在工程质量监理中，若发现质量缺陷，监理意见必须包含：', options: ['A、进度纠偏', 'B、回归情况监理', 'C、合同变更', 'D、验收测试'], answer: 'B', explanation: '若监理意见认为存在质量缺陷，则必须包含回归情况监理，确保问题得到修正。' },
            { id: 14007, chapter: 14, group: 'theory', text: '以下哪项不属于项目准备期的信息？', options: ['A、招标文件', 'B、中标通知书', 'C、需求规格说明书', 'D、项目计划'], answer: 'C', explanation: '需求规格说明书属于项目实施期的信息；A、B、D属于项目准备期信息。' },
            { id: 14008, chapter: 14, group: 'theory', text: '以下哪项属于监理回复类文档？', options: ['A、监理规划', 'B、总体监理意见', 'C、监理日志', 'D、监理月报'], answer: 'B', explanation: '监理回复类文档包括总体监理意见、工程监理意见、专题监理意见等；A属于总控类；C、D属于内部文档或实施类。' },
            { id: 14009, chapter: 14, group: 'theory', text: '在信息应用系统文档质量控制中，需求分析阶段的验收方式不包括：', options: ['A、业主单位签字', 'B、技术评审', 'C、评审意见', 'D、程序修改确认'], answer: 'D', explanation: '程序修改确认属于系统试运行阶段的验收方式；A、B、C是需求分析阶段的验收方式。' },
            { id: 14010, chapter: 14, group: 'theory', text: '以下哪项不属于信息按载体划分的类型？', options: ['A、文字信息', 'B、语言信息', 'C、视频信息', 'D、质量控制信息'], answer: 'D', explanation: '信息按载体可分为文字、语言、符号及图表、视频信息；D是按用途划分的信息类型。' },
            { id: 14011, chapter: 14, group: 'theory', text: '信息具有“随着项目进程，其价值将逐步降低或完全丧失”的特点，这指的是信息的？', options: ['A、现实性', 'B、适时性', 'C、复杂性', 'D、增值性'], answer: 'B', explanation: '讲义中明确指出信息的“适时性”是指信息在特定的时间范围内是有效的，随着时间的推移，其价值会降低或丧失。' },
            { id: 14012, chapter: 14, group: 'theory', text: '以下哪一类信息属于“辨识信息”？', options: ['A、设计变更通知', 'B、技术标准和规程', 'C、设备出厂证明书', 'D、投资计划'], answer: 'C', explanation: '讲义中将信息按性质划分为引导信息和辨识信息。辨识信息包括设备出厂证明书、技术合格证书、检查验收签证等，用于识别和确认。A、B、D属于引导信息或投资控制信息。' },
            { id: 14013, chapter: 14, group: 'theory', text: '监理单位在收到承建单位提交的工程文档后，负责回复意见的文件属于？', options: ['A、总控类文档', 'B、监理实施类文档', 'C、监理回复（批复）类文档', 'D、监理内部文档'], answer: 'C', explanation: '讲义中明确将监理文档按监理角度分类，其中“监理回复（批复）类文档”是监理单位对承建/业主单位文档的回复意见文件。' },
            { id: 14014, chapter: 14, group: 'theory', text: '在信息资料管理方法中，“新版本出来后，旧的版本应清除”是为了？', options: ['A、统一文档格式', 'B、管理文档版本', 'C、制定存档标准', 'D、覆盖项目生存期'], answer: 'B', explanation: '讲义中在“文档版本的管理”部分明确指出，新版本出来后，旧版本应清除，以保持文档版本的统一。' },
            { id: 14015, chapter: 14, group: 'theory', text: '以下哪项不属于总控类文档？', options: ['A、承建合同', 'B、监理规划', 'C、工程监理周报', 'D、项目进度计划'], answer: 'C', explanation: '讲义中列举的总控类文档包括承建合同、监理规划、项目进度计划等。工程监理周报属于监理实施类文档。' },
            { id: 14016, chapter: 14, group: 'theory', text: '在工程进度监理中，如果监理意见认为存在进度偏差，则必须包含？', options: ['A、质量回归监理', 'B、进度纠偏', 'C、合同变更', 'D、验收测试'], answer: 'B', explanation: '讲义中在“工程进度监理文档”部分明确指出，如果监理意见认为存在进度偏差，则必须包含进度纠偏。' },
            { id: 14017, chapter: 14, group: 'theory', text: '项目竣工期监理信息管理工作不包括以下哪项？', options: ['A、评估竣工资料', 'B、组织确定测试方案', 'C、编写详细设计说明书', 'D、编写监理总结报告'], answer: 'C', explanation: '讲义中项目竣工期的监理工作包括工程竣工准备、验收测试、测试结果分析、验收测试报告和监理总结报告。详细设计说明书是项目实施期承建单位输出的文档。' },
            { id: 14018, chapter: 14, group: 'theory', text: '根据信息按工程建设阶段分类，“概要设计说明书”属于哪个阶段的信息？', options: ['A、项目准备期', 'B、项目实施期', 'C、实施阶段', 'D、项目竣工期'], answer: 'B', explanation: '讲义中“项目实施期”的信息包括需求规格说明书、概要设计说明书、详细设计说明书等。' },
            { id: 14019, chapter: 14, group: 'theory', text: '监理总结报告应由谁负责组织编写？', options: ['A、业主单位代表', 'B、承建单位项目经理', 'C、总监理工程师', 'D、专业监理工程师'], answer: 'C', explanation: '讲义中在“监理总结报告”部分明确指出，该报告由总监理工程师组织编写，各专业监理工程师参加。' },
            { id: 14020, chapter: 14, group: 'theory', text: '在信息应用系统文档的质量控制中，“编程的时间控制”和“编程计划”是哪个阶段的控制要点？', options: ['A、需求分析', 'B、系统设计', 'C、程序编写', 'D、系统测试'], answer: 'C', explanation: '讲义中表14-8明确列出，“程序编写”阶段的质量控制要点包括编程的时间控制和编程计划。' },
            { id: 14021, chapter: 14, group: 'theory', text: '信息如果经过分析和处理，往往会产生新的信息，使信息得到增值。这描述的是信息的？', options: ['A、共用性', 'B、适时性', 'C、复杂性', 'D、增值性'], answer: 'D', explanation: '讲义中在“信息的特点”部分明确指出，“增值性”是指信息经过分析和处理可以产生新的、更有价值的信息。' },
            { id: 14022, chapter: 14, group: 'theory', text: '以下哪项信息主要用于“组织协调”？', options: ['A、投资估算', 'B、质量检查数据', 'C、合同变更协议书', 'D、项目进度计划'], answer: 'C', explanation: '讲义中列举的组织协调信息包括工程质量调整指令、合同变更及其协议书、政府审批文件等。A属于投资控制，B属于质量控制，D属于进度控制。' },
            { id: 14023, chapter: 14, group: 'theory', text: '“制定文档编制策略”时，强调文档应针对不同的读者设计不同类型，这体现了？', options: ['A、文档覆盖项目生存期', 'B、文档应是可管理的', 'C、文档适合于其读者', 'D、文档标准应被标识和使用'], answer: 'C', explanation: '讲义中“制定文档编制策略”的第三点明确指出：“文档应适合于其读者。针对不同的读者，监理单位应负责设计不同类型的文档。”' },
            { id: 14024, chapter: 14, group: 'theory', text: '工程监理月报中，对本月工程质量、进度、协调情况进行综合性评价的部分是？', options: ['A、工程概况', 'B、监理工作统计', 'C、工程质量控制', 'D、监理总评价'], answer: 'D', explanation: '讲义中列举的工程监理月报要素中，“监理总评价”是专门用于对本月各方面情况进行综合性评价的部分。' },
            { id: 14025, chapter: 14, group: 'theory', text: '以下哪项是“系统深化设计阶段”需要提交的文档？', options: ['A、系统需求书', 'B、系统初步设计书', 'C、系统图', 'D、系统测试分析报告'], answer: 'C', explanation: '讲义中表14-6明确列出，系统图、系统接线图、网络地址分配图等是“系统深化设计阶段”的文件。' },
            { id: 14026, chapter: 14, group: 'theory', text: '在信息应用系统文档中，“软件需求规格说明”主要在哪一阶段产生？', options: ['A、计划', 'B、需求分析', 'C、设计', 'D、测试'], answer: 'B', explanation: '讲义中表14-7（承建单位信息应用系统文档）显示，“软件需求规格说明”的主要输出阶段是“需求分析”。' },
            { id: 14027, chapter: 14, group: 'theory', text: '“系统试运行”阶段的质量控制，其验收方式主要是？', options: ['A、业主单位签字', 'B、技术评审', 'C、程序修改确认', 'D、监理意见'], answer: 'C', explanation: '讲义中表14-8（信息应用系统文档的质量控制）明确列出，“系统试运行”阶段的验收方式是“程序修改确认”。' },
            { id: 14028, chapter: 14, group: 'theory', text: '按信息的载体划分，会议讨论属于？', options: ['A、文字信息', 'B、语言信息', 'C、符号及图表信息', 'D、视频信息'], answer: 'B', explanation: '讲义中按载体将信息分为文字、语言、符号及图表、视频信息。会议讨论主要是通过语言进行的信息交流。' },
            { id: 14029, chapter: 14, group: 'theory', text: '监理信息资料管理的原则中，要求“某一类型的文档究竟应该保存多长时间”指的是？', options: ['A、文档的格式统一', 'B、文档版本的管理', 'C、文档的存档标准', 'D、文档应是可管理的'], answer: 'C', explanation: '讲义中在“信息资料管理方法”部分，“文档的存档标准”正是要确定某一类型文档的保存期限。' },
            { id: 14030, chapter: 14, group: 'theory', text: '在项目各参与单位的信息分类中，不包括以下哪一项？', options: ['A、业主单位信息', 'B、设计单位信息', 'C、承建单位信息', 'D、监理单位信息'], answer: 'B', explanation: '讲义中“按项目参与单位分类”明确分为业主、承建、监理单位信息。设计单位通常包含在承建单位范畴内，未单独列出。' }
        ];
        // ★★★ 第15节 组织协调（40题）★★★
        const CHAPTER_15 = [
            { id: 15001, chapter: 15, group: 'theory', text: '组织协调工作中，系统内部的协调不包括以下哪项内容？', options: ['A、人际关系', 'B、组织关系', 'C、需求关系', 'D、与社会团体协调'], answer: 'D', explanation: '讲义中将协调内容分为系统内部协调和系统外部协调。系统内部协调包括人际关系、组织关系和需求关系协调；与社会团体协调属于系统外部协调中的非合同因素协调。' },
            { id: 15002, chapter: 15, group: 'theory', text: '以下哪项不是组织协调的基本原则？', options: ['A、公平公正独立原则', 'B、守法原则', 'C、诚信原则', 'D、主观臆断原则'], answer: 'D', explanation: '讲义中明确提出了组织协调的四大基本原则：公平公正独立原则、守法原则、诚信原则和科学原则。主观臆断违背了科学原则。' },
            { id: 15003, chapter: 15, group: 'theory', text: '监理单位在组织协调中应坚持公平公正独立原则，以下哪项做法不符合此原则？', options: ['A、同时从事监理和系统集成业务', 'B、敢于坚持正确观点', 'C、实事求是分析问题', 'D、具备大局观全面思考'], answer: 'A', explanation: '讲义明确指出“监理单位应是独立的第三方，不能同时既做监理，又做系统集成业务”，这违反了公平公正独立原则。' },
            { id: 15004, chapter: 15, group: 'theory', text: '关于监理会议，以下说法错误的是？', options: ['A、专题会议由总监理工程师或授权监理工程师主持', 'B、监理例会纪要经总监理工程师签认后发放', 'C、会议纪要应在会后一周内形成', 'D、专题会议包括技术讨论会和紧急事件协调会等'], answer: 'C', explanation: '讲义中强调“在会后24小时之内形成会议纪要”，而不是一周内，这是确保会议成功的重要措施。' },
            { id: 15005, chapter: 15, group: 'theory', text: '项目监理例会的主要议题不包括？', options: ['A、检查项目进度计划完成情况', 'B、确定项目投资回报率', 'C、分包单位的管理和协调问题', 'D、解决项目变更的相关事宜'], answer: 'B', explanation: '讲义中列举了监理例会的主要议题，包括检查进度、分包协调、项目款支付、审查文档等，但不包括确定投资回报率这种商业决策内容。' },
            { id: 15006, chapter: 15, group: 'theory', text: '以下哪项不属于监理报告的类型？', options: ['A、监理日报', 'B、监理周报', 'C、监理月报', 'D、监理实时直播报告'], answer: 'D', explanation: '讲义中明确监理单位按时提交的监理报告包括日报、周报和月报，没有“实时直播报告”这种形式。' },
            { id: 15007, chapter: 15, group: 'theory', text: '监理通知与回复的要求不包括？', options: ['A、简洁明了', 'B、包含全部必要观点', 'C、采用结构化形式', 'D、必须使用专业术语'], answer: 'D', explanation: '讲义中指出监理通知应简洁、完整、结构化，但未要求必须使用专业术语，重要的是让受众清晰理解。' },
            { id: 15008, chapter: 15, group: 'theory', text: '以下哪项不是创造良好人际交往条件的因素？', options: ['A、外表问题', 'B、态度的类似性', 'C、需求的互补性', 'D、职位的高低'], answer: 'D', explanation: '讲义中列举的影响人际交往条件的因素包括外表、态度类似性、需求互补性和时空接近性，未提及职位高低。' },
            { id: 15009, chapter: 15, group: 'theory', text: '对于突发性变更事件引起的进度问题，监理单位通常采取什么协调方式？', options: ['A、召开紧急事件协调会', 'B、发送监理月报', 'C、组织技术评审会', 'D、提交专题报告'], answer: 'A', explanation: '讲义中明确指出“对于因突发性变更事件引起的进度问题，监理单位会召开紧急事件协调会”。' },
            { id: 15010, chapter: 15, group: 'theory', text: '监理单位在什么时候会组织专家进行阶段成果评审？', options: ['A、承建单位完成关键阶段工作时', 'B、每月例行检查时', 'C、业主单位提出要求时', 'D、发现问题需要整改时'], answer: 'A', explanation: '讲义中明确“在承建单位完成关键阶段的工作时，监理将及时组织专家，会同业主单位对阶段成果进行评审”。' },
            { id: 15011, chapter: 15, group: 'theory', text: '以下哪项不属于日常监理文件？', options: ['A、监理日志', 'B、实施计划批复文件', 'C、进度款支付确认文件', 'D、承建单位财务报表'], answer: 'D', explanation: '讲义中列举的日常监理文件包括监理日志、实施计划批复、进度款支付确认等，承建单位财务报表不属于监理单位产生的文件。' },
            { id: 15012, chapter: 15, group: 'theory', text: '监理联系应采用的主要形式是？', options: ['A、口头通知', 'B、电话通知', 'C、书面函件', 'D、微信消息'], answer: 'C', explanation: '讲义中强调“监理单位与业主单位的联系均以书面函件为准”，只有在紧急情况下可先口头或电话通知，但事后要补书面通知。' },
            { id: 15013, chapter: 15, group: 'theory', text: '会议纪要的发放要求是？', options: ['A、经总监理工程师签认', 'B、发放到项目各方', 'C、有签收手续', 'D、以上都是'], answer: 'D', explanation: '讲义中明确指出会议纪要“经总监理工程师签认，发放到项目各方，并应有签收手续”，三个选项都是正确要求。' },
            { id: 15014, chapter: 15, group: 'theory', text: '以下哪项不是不定期监理工作报告的内容？', options: ['A、关于项目优化设计的建议', 'B、投资情况分析预测', 'C、监理月报', 'D、各阶段的测试报告和评价说明'], answer: 'C', explanation: '讲义中列举的不定期监理工作报告包括项目优化建议、投资分析、测试报告等，监理月报属于定期报告。' },
            { id: 15015, chapter: 15, group: 'theory', text: '系统外部关系协调中，具有合同因素的协调不包括？', options: ['A、业主单位与承建单位协调', 'B、业主单位与供应商协调', 'C、与社会团体主管部门协调', 'D、以上都不是'], answer: 'C', explanation: '讲义中将系统外部协调分为具有合同因素和非合同因素，与社会团体主管部门协调属于非合同因素协调。' },
            { id: 15016, chapter: 15, group: 'theory', text: '监理工程师在人际关系认知中应该？', options: ['A、排除第一印象的干扰', 'B、仅凭第一印象判断', 'C、忽视人际关系', 'D、避免与他人沟通'], answer: 'A', explanation: '讲义中明确指出要“排除第一印象的干扰”，这是把握人际关系认知规律的重要要求。' },
            { id: 15017, chapter: 15, group: 'theory', text: '监理通知在紧急情况下可以？', options: ['A、仅做口头通知不补书面材料', 'B、先口头或电话通知，事后补书面通知', 'C、不予处理', 'D、直接上报上级部门'], answer: 'B', explanation: '讲义中规定“在不做出紧急监理可能导致人身或项目事故的情况下，可以先口头或电话通知，事后在约定时间内补做书面通知”。' },
            { id: 15018, chapter: 15, group: 'theory', text: '以下哪项不是确保会议成功的措施？', options: ['A、会前的准备措施', 'B、会议过程把握的原则', 'C、会议结果的落实原则', 'D、尽可能延长会议时间'], answer: 'D', explanation: '讲义中提出了确保会议成功的三项措施：会前准备、过程把握和结果落实，未提及延长会议时间。' },
            { id: 15019, chapter: 15, group: 'theory', text: '监理在组织协调中的科学原则要求？', options: ['A、凡事要有证据', 'B、尽量用数据说话', 'C、用科学的方法', 'D、以上都是'], answer: 'D', explanation: '讲义中指出科学原则要求“用科学的方法，凡事要有证据，判断问题时尽量用数据说话”，三个选项都是科学原则的体现。' },
            { id: 15020, chapter: 15, group: 'theory', text: '在人际关系中，影响人际关系稳定性和亲密性的主要调节器是？', options: ['A、人与人之间的喜爱', 'B、职位高低', 'C、收入水平', 'D、工作年限'], answer: 'A', explanation: '讲义中明确指出“人与人之间的喜爱是人际关系稳定性、亲密性的主要调节器”。' },
            { id: 15021, chapter: 15, group: 'theory', text: '通过经常开一些工作例会、业务碰头会，主要可以实现哪种类型的协调？', options: ['A、系统内部的协调', 'B、系统外部的协调', 'C、具有合同因素的协调', 'D、非合同因素的协调'], answer: 'A', explanation: '讲义中明确指出，系统内部的协调“可以通过经常开一些工作例会、业务碰头会来实现”。' },
            { id: 15022, chapter: 15, group: 'theory', text: '系统内部的协调主要目标是什么？', options: ['A、实现内部资源的合理配置', 'B、完成与供应商的合同签订', 'C、处理与社会团体的关系', 'D、遵守政府颁布的法律法规'], answer: 'A', explanation: '讲义中在“系统内部的协调”部分明确说明，其目标是“实现内部资源的合理配置”。' },
            { id: 15023, chapter: 15, group: 'theory', text: '以下哪项属于系统外部协调中“具有合同因素的协调”？', options: ['A、业主单位与承建单位协调', 'B、与社会团体主管部门协调', 'C、与服务部门协调', 'D、与传媒协调'], answer: 'A', explanation: '讲义中图15-1明确将“具有合同因素的协调”分为业主单位与承建单位协调、业主单位与供应商协调。' },
            { id: 15024, chapter: 15, group: 'theory', text: '“监理工程师在不断提高个人的专业技能并运用到监理实践活动中”是哪个原则的体现？', options: ['A、公平公正独立原则', 'B、守法原则', 'C、诚信原则', 'D、科学原则'], answer: 'D', explanation: '讲义中在“科学原则”的阐释下明确指出“监理工程师在不断提高个人的专业技能并运用到监理实践活动中”。' },
            { id: 15025, chapter: 15, group: 'theory', text: '“监理只在核定的业务范围内开展相应的监理工作”体现了哪项组织协调基本原则？', options: ['A、公平公正独立原则', 'B、守法原则', 'C、诚信原则', 'D、科学原则'], answer: 'B', explanation: '讲义中“守法原则”的第一点就是“监理只在核定的业务范围内开展相应的监理工作”。' },
            { id: 15026, chapter: 15, group: 'theory', text: '“自觉遵守业主单位所在地政府颁布的法律、法规要求”是哪项原则的要求？', options: ['A、公平公正独立原则', 'B、守法原则', 'C、诚信原则', 'D、科学原则'], answer: 'B', explanation: '讲义中“守法原则”的第三点明确要求“自觉遵守业主单位所在地政府颁布的法律、法规要求”。' },
            { id: 15027, chapter: 15, group: 'theory', text: '监理工程师在人际交往中，遇到与自己态度类似的人容易产生好感，这主要受哪种因素影响？', options: ['A、外表问题', 'B、态度的类似性', 'C、需求的互补性', 'D、时空上的接近'], answer: 'B', explanation: '讲义中在“创造良好的人际交往条件”部分指出，“态度的类似性”是影响因素之一。' },
            { id: 15028, chapter: 15, group: 'theory', text: '“老乡见老乡，两眼泪汪汪”形象地说明了哪种因素对人际交往的影响？', options: ['A、外表问题', 'B、态度的类似性', 'C、需求的互补性', 'D、时空上的接近'], answer: 'D', explanation: '讲义中在“创造良好的人际交往条件”部分，将“时空上的接近”举例为“老乡见老乡，两眼泪汪汪”。' },
            { id: 15029, chapter: 15, group: 'theory', text: '以下哪项通常不是项目监理例会的参加人员？', options: ['A、总监理工程师', 'B、承建单位项目经理', 'C、业主单位驻现场代表', 'D、设备供应商代表'], answer: 'D', explanation: '讲义中明确列出了项目监理例会的参加单位及人员，包括监理、承建、业主单位代表，并可邀请设计、分包等单位，但未明确提及设备供应商代表。' },
            { id: 15030, chapter: 15, group: 'theory', text: '项目监理例会的主要议题“检查项目进度计划完成情况”后，紧接着应进行哪项工作？', options: ['A、确定下一阶段进度目标', 'B、审查承建单位提交的文档', 'C、讨论分包单位的管理问题', 'D、解决项目变更事宜'], answer: 'A', explanation: '讲义中在列举监理例会主要议题时，第一点就是“检查项目进度计划完成情况，确定下一阶段进度目标”。' },
            { id: 15031, chapter: 15, group: 'theory', text: '专题会议通常不包括以下哪种类型？', options: ['A、技术讨论会', 'B、现场（项目组织）协调会', 'C、监理月报评审会', 'D、紧急事件协调会'], answer: 'C', explanation: '讲义中明确专题会议通常包括技术讨论会、现场协调会、紧急事件协调会和技术评审会等。监理月报是定期报告，其评审不属于专题会议常规类型。' },
            { id: 15032, chapter: 15, group: 'theory', text: '关于会议纪要，以下哪项描述是正确的？', options: ['A、由任意参会人员记录即可', 'B、仅需发给监理单位内部存档', 'C、应在会后24小时内形成', 'D、无需总监理工程师签认'], answer: 'C', explanation: '讲义中在“会议结果的落实原则”中强调“在会后24小时之内形成会议纪要”，并且纪要需经总监理工程师签认后发放各方。' },
            { id: 15033, chapter: 15, group: 'theory', text: '监理单位向业主单位提交的定期报告不包括以下哪项？', options: ['A、监理日报', 'B、监理周报', 'C、监理月报', 'D、项目竣工决算报告'], answer: 'D', explanation: '讲义中指出监理单位按时提交监理日报、周报和月报。项目竣工决算报告不属于定期的监理工作报告。' },
            { id: 15034, chapter: 15, group: 'theory', text: '以下哪项属于监理单位向业主单位提交的“不定期监理工作报告”？', options: ['A、关于项目优化设计的建议', 'B、监理周报', 'C、监理月报', 'D、监理日志'], answer: 'A', explanation: '讲义中明确列举了不定期监理工作报告的内容，第一项就是“关于项目优化设计、项目变更的建议”。' },
            { id: 15035, chapter: 15, group: 'theory', text: '监理通知与回复的要求“用一定的结构形式，把观点清晰地传递给受众”是指哪项要求？', options: ['A、简洁', 'B、完整', 'C、结构化', 'D、以上都不是'], answer: 'C', explanation: '讲义中对监理通知与回复的三项要求中，“结构化”就是指“用一定的结构形式，把观点清晰地传递给受众”。' },
            { id: 15036, chapter: 15, group: 'theory', text: '在日常监理文件中，“实施进度调整批复文件”属于以下哪类文档？', options: ['A、监理日志', 'B、监理实施类文档', 'C、监理回复（批复）类文档', 'D、监理报告'], answer: 'B', explanation: '讲义中将“实施进度调整批复文件”明确列为“日常监理文件”下的“监理实施类文档”。' },
            { id: 15037, chapter: 15, group: 'theory', text: '在项目监理例会上，关于“分包单位的管理和协调问题”的讨论属于会议哪个方面的议题？', options: ['A、检查与计划', 'B、管理与协调', 'C、支付与财务', 'D、文档与变更'], answer: 'B', explanation: '讲义中将“分包单位的管理和协调问题”明确列为监理例会的主要议题之一，属于管理与协调范畴。' },
            { id: 15038, chapter: 15, group: 'theory', text: '“监理联系单、监理通知单、监理回复或批复”的主要作用是？', options: ['A、替代正式的会议纪要', 'B、让信息在各单位内部人员之间流动，协调思想与行动', 'C、作为项目竣工的依据', 'D、用于向政府主管部门汇报'], answer: 'B', explanation: '讲义中明确指出，这些日常监理文件的作用是“让信息在各单位内部人员之间流动，协调大家的思想与行动”。' },
            { id: 15039, chapter: 15, group: 'theory', text: '根据讲义，人与人之间的喜爱是调节什么的“主要调节器”？', options: ['A、项目进度的快慢', 'B、投资控制的严格程度', 'C、人际关系稳定性和亲密性', 'D、合同条款的履行情况'], answer: 'C', explanation: '讲义中在“把握人际关系认知的规律”部分明确指出：“人与人之间的喜爱是人际关系稳定性、亲密性的主要调节器。”' },
            { id: 15040, chapter: 15, group: 'theory', text: '“需求的互补性”作为人际交往条件，其典型例子是？', options: ['A、遇见自己的同志', 'B、老外要学中文，你要学英文', 'C、老乡见老乡', 'D、以上都不是'], answer: 'B', explanation: '讲义中在解释“需求的互补性”时，举例“老外要学中文，你要学英文”，说明了因需求互补而促进交往的情况。' }
        ];

        // ★★★ 第16节 项目管理基础（44题）★★★
        const CHAPTER_16 = [
            { id: 16001, chapter: 16, group: 'theory', text: '以下哪种情况不能宣告项目结束？', options: ['A、达成项目目标', 'B、项目资金耗尽', 'C、项目需求发生微小变化', 'D、无法获得所需的人力或物力资源'], answer: 'C', explanation: '讲义中明确项目可宣告结束的情况包括：达成目标、无法达成目标、资金耗尽、需求不复存在、无法获得资源。需求发生微小变化通常通过变更管理处理，不足以直接结束项目。' },
            { id: 16002, chapter: 16, group: 'theory', text: '项目创造的有形业务价值不包括以下哪项？', options: ['A、货币资产', 'B、固定资产', 'C、市场份额', 'D、品牌认知度'], answer: 'D', explanation: '讲义中指出有形效益包括货币资产、固定资产、市场份额等，而品牌认知度属于无形效益。' },
            { id: 16003, chapter: 16, group: 'theory', text: '项目管理办公室(PMO)的哪种类型对项目的控制程度最高？', options: ['A、支持型', 'B、控制型', 'C、指令型', 'D、协调型'], answer: 'C', explanation: '讲义中明确将PMO分为支持型（控制程度低）、控制型（控制程度中等）、指令型（控制程度高）。' },
            { id: 16004, chapter: 16, group: 'theory', text: '在通用项目生命周期中，成本与人力投入水平通常在哪个阶段达到最高？', options: ['A、启动项目', 'B、组织与准备', 'C、执行项目工作', 'D、结束项目'], answer: 'C', explanation: '讲义中图16-2显示，成本与人力投入在工作执行期间达到最高，并在项目快要结束时迅速回落。' },
            { id: 16005, chapter: 16, group: 'theory', text: '关于项目风险与不确定性的变化规律，以下描述正确的是？', options: ['A、在项目结束时最大', 'B、在项目开始时最大', 'C、在项目中期保持稳定', 'D、与项目时间无关'], answer: 'B', explanation: '讲义中图16-3明确显示，风险与不确定性在项目开始时最大，并随项目进展逐步降低。' },
            { id: 16006, chapter: 16, group: 'theory', text: '以下哪种生命周期类型又称为“瀑布型生命周期”？', options: ['A、预测型生命周期', 'B、迭代型生命周期', 'C、增量型生命周期', 'D、适应型生命周期'], answer: 'A', explanation: '讲义中明确指出“预测型生命周期：又称为瀑布型生命周期，适用于已经充分了解并明确确定需求的项目”。' },
            { id: 16007, chapter: 16, group: 'theory', text: '在迭代型生命周期中，通常会定期修改的是？', options: ['A、项目范围', 'B、时间及成本', 'C、产品质量', 'D、项目章程'], answer: 'B', explanation: '讲义中指出在迭代型生命周期中“项目范围通常在早期确定，但时间及成本会随着对产品理解的不断深入而定期修改”。' },
            { id: 16008, chapter: 16, group: 'theory', text: '适应型生命周期最适合以下哪种项目？', options: ['A、需求明确且稳定', 'B、需求不确定且不断发展', 'C、预算严格固定', 'D、技术方案成熟'], answer: 'B', explanation: '讲义中明确说明适应型生命周期“适合于需求不确定，不断发展变化的项目”。' },
            { id: 16009, chapter: 16, group: 'theory', text: '项目管理过程中，“授权一个项目或阶段的开始”属于哪个过程组？', options: ['A、启动过程组', 'B、规划过程组', 'C、执行过程组', 'D、监控过程组'], answer: 'A', explanation: '讲义中明确将“授权一个项目或阶段的开始”定义为启动过程组的工作。' },
            { id: 16010, chapter: 16, group: 'theory', text: '在适应型项目中，规划过程组的一个重要特点是？', options: ['A、由项目经理单独完成', 'B、避免团队成员参与', 'C、让尽可能多的团队成员参与', 'D、完全按照初始计划执行'], answer: 'C', explanation: '讲义中强调适应型项目要“让尽可能多的团队成员参与到规划过程，降低不确定性”。' },
            { id: 16011, chapter: 16, group: 'theory', text: '“制定项目章程”过程属于哪个知识领域？', options: ['A、项目范围管理', 'B、项目整合管理', 'C、项目干系人管理', 'D、项目沟通管理'], answer: 'B', explanation: '讲义中表16-4明确显示，“制定项目章程”过程属于项目整合管理知识领域，且在启动过程组。' },
            { id: 16012, chapter: 16, group: 'theory', text: '创建WBS过程属于哪个知识领域和过程组？', options: ['A、项目范围管理-规划过程组', 'B、项目进度管理-执行过程组', 'C、项目成本管理-监控过程组', 'D、项目质量管理-规划过程组'], answer: 'A', explanation: '讲义中表16-4显示，“创建WBS”属于项目范围管理知识领域的规划过程组。' },
            { id: 16013, chapter: 16, group: 'theory', text: '控制质量过程属于哪个过程组？', options: ['A、启动过程组', 'B、规划过程组', 'C、执行过程组', 'D、监控过程组'], answer: 'D', explanation: '讲义中表16-4明确将“控制质量”列为监控过程组的工作，属于项目质量管理知识领域。' },
            { id: 16014, chapter: 16, group: 'theory', text: '在项目资源管理中，“建设团队”过程属于哪个过程组？', options: ['A、启动过程组', 'B、规划过程组', 'C、执行过程组', 'D、监控过程组'], answer: 'C', explanation: '讲义中表16-4显示，“建设团队”属于项目资源管理知识领域的执行过程组。' },
            { id: 16015, chapter: 16, group: 'theory', text: '识别干系人过程属于哪个知识领域和过程组？', options: ['A、项目沟通管理-规划过程组', 'B、项目干系人管理-启动过程组', 'C、项目整合管理-启动过程组', 'D、项目风险管理-监控过程组'], answer: 'B', explanation: '讲义中表16-4明确显示，“识别干系人”属于项目干系人管理知识领域的启动过程组。' },
            { id: 16016, chapter: 16, group: 'theory', text: '关于业主单位在项目管理中的角色，以下描述正确的是？', options: ['A、负责项目的具体实施工作', 'B、重点参与立项管理与验收管理', 'C、负责编制详细的技术方案', 'D、负责项目的日常运维工作'], answer: 'B', explanation: '讲义中明确指出“业主单位重点参与实施项目的立项管理与验收管理工作”。' },
            { id: 16017, chapter: 16, group: 'theory', text: '监理单位在信息系统工程项目中重点涉及的项目管理工作通常被概括为？', options: ['A、三控两管一协调', 'B、四控三管一协调', 'C、三控一管两协调', 'D、四控两管一协调'], answer: 'A', explanation: '讲义中明确将监理工作概括为“三控（进度、成本、质量）、两管（合同、文档）、一协调（沟通与协调）”。' },
            { id: 16018, chapter: 16, group: 'theory', text: '在适应型项目中，收尾过程组的一个重要特点是？', options: ['A、按照固定顺序完成所有工作', 'B、首先完成最具业务价值的工作', 'C、避免进行优先级排序', 'D、只关注技术难点的解决'], answer: 'B', explanation: '讲义中强调适应型项目要“对工作进行优先级排序，以便首先完成最具业务价值的工作”。' },
            { id: 16019, chapter: 16, group: 'theory', text: '关于项目治理框架，以下描述错误的是？', options: ['A、包括规则、政策、程序', 'B、包括规范、关系、系统', 'C、是在组织内行使职权的框架', 'D、仅适用于项目经理个人'], answer: 'D', explanation: '讲义中明确治理框架是在组织内行使职权的框架，包含规则、政策、程序、规范、关系、系统和过程，适用于整个组织而非个人。' },
            { id: 16020, chapter: 16, group: 'theory', text: '在增量型生命周期中，产出可交付成果的方式是？', options: ['A、一次性交付完整产品', 'B、通过一系列迭代渐进增加功能', 'C、完全依赖初始需求分析', 'D、避免任何形式的迭代'], answer: 'B', explanation: '讲义中指出增量型生命周期是通过“渐进增加产品功能的一系列迭代来产出可交付成果”。' },
            { id: 16021, chapter: 16, group: 'theory', text: '项目驱动变更的含义是指？', options: ['A、项目本身经常变更', 'B、通过项目实现组织目标状态', 'C、变更会破坏项目目标', 'D、变更是项目的副作用'], answer: 'B', explanation: '讲义中明确“通过成功完成一个或一系列项目，组织可以实现将来状态并达成特定的目标”，这就是项目驱动变更的含义。' },
            { id: 16022, chapter: 16, group: 'theory', text: '在项目管理过程组中，“满足项目要求”主要是哪个过程组的任务？', options: ['A、启动过程组', 'B、规划过程组', 'C、执行过程组', 'D、收尾过程组'], answer: 'C', explanation: '讲义中将“完成项目管理计划中确定的工作，以满足项目要求”定义为执行过程组的任务。' },
            { id: 16023, chapter: 16, group: 'theory', text: '关于统一领导原则，以下描述正确的是？', options: ['A、一个项目可以有多个领导', 'B、对同一组活动只能有一个领导', 'C、领导可以频繁更换', 'D、不需要明确的领导'], answer: 'B', explanation: '讲义中在管理要素部分明确说明“统一领导原则(例如对服务于同一目标的一组活动，只能有一份计划或一个领导)”。' },
            { id: 16024, chapter: 16, group: 'theory', text: '在项目沟通管理知识领域中，“规划沟通管理”过程属于哪个过程组？', options: ['A、启动过程组', 'B、规划过程组', 'C、执行过程组', 'D、监控过程组'], answer: 'B', explanation: '讲义中表16-4明确显示，“规划沟通管理”属于项目沟通管理知识领域的规划过程组。' },
            { id: 16025, chapter: 16, group: 'theory', text: '监理单位的评估与验收工作通常可以融入哪个框架中？', options: ['A、三控两管一协调', 'B、仅质量控制', 'C、仅进度控制', 'D、仅成本控制'], answer: 'A', explanation: '讲义中明确指出评估与验收工作“可融入‘三控、两管、一协调’中”。' },
            { id: 16026, chapter: 16, group: 'theory', text: '项目管理办公室(PMO)中，担当顾问角色且对项目控制程度很低的是哪种类型？', options: ['A、支持型', 'B、控制型', 'C、指令型', 'D、主导型'], answer: 'A', explanation: '讲义中明确将PMO分为三种类型：支持型（控制程度低，担当顾问）、控制型（控制程度中等）、指令型（控制程度高）。' },
            { id: 16027, chapter: 16, group: 'theory', text: '以下哪项不属于讲义中提到的“管理要素”？', options: ['A、基于专业技能开展工作的部门', 'B、组织授予的工作职权', 'C、支付合理的薪酬', 'D、项目具体的编码规范'], answer: 'D', explanation: '讲义中列出的管理要素包括部门、工作职权、工作职责、统一领导原则、支付合理薪酬，未涉及具体的项目编码规范。' },
            { id: 16028, chapter: 16, group: 'theory', text: '在预测型生命周期中，项目范围通常在哪个阶段被充分了解并明确确定？', options: ['A、项目开始时', 'B、项目中期', 'C、项目结束时', 'D、各个阶段逐步明确'], answer: 'A', explanation: '讲义中指出预测型生命周期“适用于已经充分了解并明确确定需求的项目”，这意味着在项目开始时需求就已明确。' },
            { id: 16029, chapter: 16, group: 'theory', text: '关于适应型项目中的过程组关系，以下描述错误的是？', options: ['A、可以分解为一系列按顺序进行的迭代期', 'B、工作一旦开始计划就需根据新情况而改变', 'C、项目管理计划的所有要素需要不断调整', 'D、必须严格按照最初的基准计划执行'], answer: 'D', explanation: '讲义强调适应型项目需要“不断调整和改进项目管理计划的所有要素”，而不是严格按最初计划执行。' },
            { id: 16030, chapter: 16, group: 'theory', text: '在项目整合管理知识领域，“制订项目管理计划”过程属于哪个过程组？', options: ['A、启动过程组', 'B、规划过程组', 'C、执行过程组', 'D、监控过程组'], answer: 'B', explanation: '讲义中表16-4明确显示，“制订项目管理计划”属于项目整合管理知识领域的规划过程组。' },
            { id: 16031, chapter: 16, group: 'theory', text: '收集需求过程属于哪个知识领域？', options: ['A、项目范围管理', 'B、项目进度管理', 'C、项目成本管理', 'D、项目质量管理'], answer: 'A', explanation: '讲义中表16-4显示，“收集需求”属于项目范围管理知识领域的规划过程组。' },
            { id: 16032, chapter: 16, group: 'theory', text: '在项目进度管理知识领域中，“定义活动”过程属于哪个过程组？', options: ['A、启动过程组', 'B、规划过程组', 'C、执行过程组', 'D、收尾过程组'], answer: 'B', explanation: '讲义中表16-4明确将“定义活动”列为项目进度管理知识领域的规划过程组工作。' },
            { id: 16033, chapter: 16, group: 'theory', text: '项目成本管理的哪个过程属于监控过程组？', options: ['A、规划成本管理', 'B、估算成本', 'C、制定预算', 'D、控制成本'], answer: 'D', explanation: '讲义中表16-4显示，在项目成本管理知识领域中，“控制成本”过程属于监控过程组。' },
            { id: 16034, chapter: 16, group: 'theory', text: '关于项目资源管理，“估算活动资源”过程属于哪个过程组？', options: ['A、启动过程组', 'B、规划过程组', 'C、执行过程组', 'D、监控过程组'], answer: 'B', explanation: '讲义中表16-4明确将“估算活动资源”列为项目资源管理知识领域的规划过程组。' },
            { id: 16035, chapter: 16, group: 'theory', text: '在项目风险管理中，“实施风险应对”过程属于哪个过程组？', options: ['A、规划过程组', 'B、执行过程组', 'C、监控过程组', 'D、收尾过程组'], answer: 'B', explanation: '讲义中表16-4显示，“实施风险应对”属于项目风险管理知识领域的执行过程组。' },
            { id: 16036, chapter: 16, group: 'theory', text: '关于项目采购管理，“规划采购管理”过程属于哪个过程组？', options: ['A、启动过程组', 'B、规划过程组', 'C、执行过程组', 'D、监控过程组'], answer: 'B', explanation: '讲义中表16-4明确将“规划采购管理”列为项目采购管理知识领域的规划过程组。' },
            { id: 16037, chapter: 16, group: 'theory', text: '在适应型项目中，监控过程组的一个重要工作方法是？', options: ['A、严格按原始计划检查', 'B、通过维护未完成工作项的清单进行跟踪', 'C、避免任何形式的变更', 'D、仅关注最终交付物'], answer: 'B', explanation: '讲义中指出适应型项目的监控过程组要“通过维护未完成工作项的清单，对进展和绩效进行跟踪、审查和调整”。' },
            { id: 16038, chapter: 16, group: 'theory', text: '关于增量型生命周期的描述，以下正确的是？', options: ['A、一次性交付完整产品', 'B、通过一系列迭代渐进增加功能', 'C、需求必须在开始时完全确定', 'D、不允许任何范围变更'], answer: 'B', explanation: '讲义中明确说明增量型生命周期是通过“渐进增加产品功能的一系列迭代来产出可交付成果”。' },
            { id: 16039, chapter: 16, group: 'theory', text: '在项目干系人管理知识领域中，“管理干系人参与”过程属于哪个过程组？', options: ['A、启动过程组', 'B、规划过程组', 'C、执行过程组', 'D、监控过程组'], answer: 'C', explanation: '讲义中表16-4显示，“管理干系人参与”属于项目干系人管理知识领域的执行过程组。' },
            { id: 16040, chapter: 16, group: 'theory', text: '关于项目临时性的描述，以下错误的是？', options: ['A、项目有明确的起点和终点', 'B、项目目标达成后可宣告结束', 'C、项目可以无限期进行', 'D、项目需求不复存在时可宣告结束'], answer: 'C', explanation: '讲义强调项目的临时性特征，指出项目有明确的起点和终点，不会无限期进行。' },
            { id: 16041, chapter: 16, group: 'theory', text: '在项目质量管理知识领域中，“规划质量管理”过程属于哪个过程组？', options: ['A、启动过程组', 'B、规划过程组', 'C、执行过程组', 'D、监控过程组'], answer: 'B', explanation: '讲义中表16-4明确将“规划质量管理”列为项目质量管理知识领域的规划过程组。' },
            { id: 16042, chapter: 16, group: 'theory', text: '监督风险过程属于哪个过程组？', options: ['A、规划过程组', 'B、执行过程组', 'C、监控过程组', 'D、收尾过程组'], answer: 'C', explanation: '讲义中表16-4显示，“监督风险”属于项目风险管理知识领域的监控过程组。' },
            { id: 16043, chapter: 16, group: 'theory', text: '在项目沟通管理知识领域中，“监督沟通”过程属于哪个过程组？', options: ['A、启动过程组', 'B、规划过程组', 'C、执行过程组', 'D、监控过程组'], answer: 'D', explanation: '讲义中表16-4明确将“监督沟通”列为项目沟通管理知识领域的监控过程组。' },
            { id: 16044, chapter: 16, group: 'theory', text: '关于承建单位在项目管理中的角色，以下描述正确的是？', options: ['A、重点参与立项阶段的立项审批', 'B、负责项目管理过程的大部分要素实施', 'C、不参与项目验收工作', 'D、只负责技术方案设计'], answer: 'B', explanation: '讲义中明确指出“除立项阶段的立项准备、立项申请、立项审批之外，项目管理过程的其他要素都是承建单位要重点实施的”。' }
        ];
        // ★★★ 第17节 变更控制（44题）★★★
        const CHAPTER_17 = [
            { id: 17001, chapter: 17, group: 'theory', text: '根据变更控制原则，实施变更的根本原因是什么？', options: ['A、引入新的收益或保护现有收益', 'B、满足监理单位要求', 'C、符合技术发展趋势', 'D、适应承建单位资源变化'], answer: 'A', explanation: '讲义中明确指出“实施变更的原因归根结底只有两个：引入新的收益或保护现有收益”。' },
            { id: 17002, chapter: 17, group: 'theory', text: '以下哪种变更属于主动变更？', options: ['A、为适应环境变化而变更', 'B、为修复系统错误而变更', 'C、为减少投资而改进方案', 'D、为应对范围蔓延而变更'], answer: 'C', explanation: '讲义中定义“主动变更：主动发起的变更，常用于提高项目收益，包括减少投资、改进方案等”，其他选项属于被动变更。' },
            { id: 17003, chapter: 17, group: 'theory', text: '根据变更的性质划分，不包括以下哪类变更？', options: ['A、重大变更', 'B、重要变更', 'C、一般变更', 'D、紧急变更'], answer: 'D', explanation: '讲义中明确“根据变更的性质划分：分为重大变更、重要变更和一般变更”，而紧急变更是根据迫切性划分的。' },
            { id: 17004, chapter: 17, group: 'theory', text: '变更控制的基本原则要求任何变更都要得到哪三方的书面确认？', options: ['A、业主、承建、设计单位', 'B、业主、承建、监理单位', 'C、承建、监理、设计单位', 'D、业主、监理、供应商'], answer: 'B', explanation: '讲义中强调“任何变更都要得到三方的书面确认”，结合上下文，三方指的是业主单位、承建单位和监理单位。' },
            { id: 17005, chapter: 17, group: 'theory', text: '变更初审的主要目的不包括以下哪项？', options: ['A、确认变更在合同约定期限内提交', 'B、明确界定变更目标', 'C、直接批准变更方案', 'D、确认变更的必要性'], answer: 'C', explanation: '讲义中变更初审的目的包括确认期限、界定目标、确认必要性，但不包括直接批准方案，批准需要后续评估和协商。' },
            { id: 17006, chapter: 17, group: 'theory', text: '在变更分析与评估阶段，不需要评估以下哪项内容？', options: ['A、变更对项目的整体影响', 'B、变更方案的可行性', 'C、变更申请人的职位级别', 'D、变更工作量和费用'], answer: 'C', explanation: '讲义中明确变更分析与评估包括分析整体影响、评估合理性、可行性、工作量、费用和工期，不涉及申请人职位级别。' },
            { id: 17007, chapter: 17, group: 'theory', text: '关于变更控制程序，以下描述正确的是？', options: ['A、变更控制委员会负责执行变更', 'B、变更申请可以口头提出', 'C、变更通过评审后需要更新项目基准', 'D、变更实施不需要监控'], answer: 'C', explanation: '讲义中明确指出“项目基准是变更的依据，变更通过评审后，都需要更新项目基准”。' },
            { id: 17008, chapter: 17, group: 'theory', text: '在变更控制的数据分析技术中，用于评估变更申请并决定接受、否决或修改的是？', options: ['A、成本效益分析', 'B、备选方案分析', 'C、多标准决策分析', 'D、独断型决策制定'], answer: 'B', explanation: '讲义中明确“备选方案分析：用于评估变更申请，并决定哪些可接受、应否决或需修改”。' },
            { id: 17009, chapter: 17, group: 'theory', text: '需求变更控制中，在项目验收阶段监理工程师应确保什么？', options: ['A、需求变更反映在验收方案中', 'B、需求变更全部被拒绝', 'C、按照最初需求验收', 'D、承建单位承担所有变更成本'], answer: 'A', explanation: '讲义中明确在验收阶段“监理工程师应确保需求变更的内容反映在验收方案中”。' },
            { id: 17010, chapter: 17, group: 'theory', text: '以下哪种情况造成的项目延期，监理单位不应受理？', options: ['A、经批准的工程量变化', 'B、非承建单位责任导致不能开工', 'C、承建单位资源不足导致延误', 'D、业主单位同意的工期顺延'], answer: 'C', explanation: '讲义中列出了应受理的延期情形，包括非承建单位责任、批准的工作量变化、不可抗力、业主同意顺延等，承建单位自身原因导致的延误不应受理。' },
            { id: 17011, chapter: 17, group: 'theory', text: '总监理工程师在什么情况下需要签发项目暂停令？', options: ['A、承建单位进度正常时', 'B、发生必须暂停实施的紧急事件时', 'C、业主单位提出优化建议时', 'D、监理单位人员变动时'], answer: 'B', explanation: '讲义中明确在“发生必须暂停实施的紧急事件时”总监理工程师要签发暂停令。' },
            { id: 17012, chapter: 17, group: 'theory', text: '项目复工的处理中，如果暂停是由于承建单位原因，正确的做法是？', options: ['A、监理工程师直接签发复工令', 'B、承建单位填写复工申请表报批', 'C、业主单位口头通知复工', 'D、无需任何手续直接复工'], answer: 'B', explanation: '讲义中明确“如项目暂停是由于承建单位原因，承建单位在具备复工条件时，应填写复工申请表报监理单位审批”。' },
            { id: 17013, chapter: 17, group: 'theory', text: '关于投资变更控制，以下说法正确的是？', options: ['A、成本大量节余一定是好事', 'B、只需关注成本超支情况', 'C、按照变更程序处理成本变更', 'D、成本偏差不需要查明原因'], answer: 'C', explanation: '讲义中强调“确保按照约定的变更控制程序处理成本变更”，并指出大量节余未必是好事，需要查明原因。' },
            { id: 17014, chapter: 17, group: 'theory', text: '合同变更的条件不包括以下哪项？', options: ['A、双方当事人协商同意', 'B、一方当事人单方面决定', 'C、由于不可抗力致使合同不能履行', 'D、另一方在约定期限内未履行合同'], answer: 'B', explanation: '讲义中明确合同变更需要双方当事人协商同意，不能单方面决定。' },
            { id: 17015, chapter: 17, group: 'theory', text: '合同变更的一般程序要求，变更建议与答复必须在什么期限内？', options: ['A、双方协议或法定期限', 'B、任意时间都可以', 'C、项目结束后', 'D、仅在工作日时间内'], answer: 'A', explanation: '讲义中明确“变更合同的建议与答复，必须在双方协议的期限之内，或者在法律或法令规定的期限之内”。' },
            { id: 17016, chapter: 17, group: 'theory', text: '变更受理的控制要点要求，所有变更请求必须以什么形式记录？', options: ['A、口头形式', 'B、书面形式', 'C、邮件形式', 'D、会议纪要形式'], answer: 'B', explanation: '讲义中强调“所有变更请求都必须以书面形式进行记录”。' },
            { id: 17017, chapter: 17, group: 'theory', text: '谁有权主持审查和处理工程变更？', options: ['A、任何监理工程师', 'B、只有业主单位代表', 'C、总监理工程师或其授权代表', 'D、只有承建单位项目经理'], answer: 'C', explanation: '讲义中明确“应由总监理工程师主持审查和处理工程变更，总监理工程师代表获得总监理工程师授权后，也可以主持审查和处理工程变更”。' },
            { id: 17018, chapter: 17, group: 'theory', text: '变更处理的控制要点不包括以下哪项？', options: ['A、评估变更自身和项目影响', 'B、满足合同中规定的时限', 'C、允许承建单位随意变更', 'D、严格控制变更'], answer: 'C', explanation: '讲义中强调“承建单位未得到业主和监理单位同意，不允许对工程随意变更”，C选项与此相悖。' },
            { id: 17019, chapter: 17, group: 'theory', text: '变更实施的控制要点要求，承建单位在什么时候不得实施变更？', options: ['A、变更文件签署前', 'B、变更想法产生时', 'C、变更评估过程中', 'D、变更费用确定前'], answer: 'A', explanation: '讲义中明确“监理单位应要求承建单位在变更文件签署前不得实施工程变更”。' },
            { id: 17020, chapter: 17, group: 'theory', text: '如果产生变更费用，不能使用以下哪种资金支付？', options: ['A、变更预算', 'B、业主增加的投资预算', 'C、风险预留资金', 'D、削减其他部分的预算'], answer: 'C', explanation: '讲义中明确“如果产生变更费用，不能使用风险预留资金支付”，并给出了其他可行的支付办法。' },
            { id: 17021, chapter: 17, group: 'theory', text: '变更控制委员会的主要职责不包括？', options: ['A、审查变更申请', 'B、执行具体的变更工作', 'C、批准或驳回变更', 'D、传达变更处理决定'], answer: 'B', explanation: '讲义中明确变更控制委员会负责“审查、评价、批准或驳回变更，并传达变更处理决定”，不负责具体执行工作。' },
            { id: 17022, chapter: 17, group: 'theory', text: '在变更决策技术中，由一个人负责为整个集体制定决策的是？', options: ['A、投票', 'B、独断型决策制定', 'C、多标准决策分析', 'D、专家判断'], answer: 'B', explanation: '讲义中明确“独断型决策制定：由一个人负责为整个集体制定决策”。' },
            { id: 17023, chapter: 17, group: 'theory', text: '需求变更控制中，在项目实施阶段监理工程师应确保什么？', options: ['A、按照原设计不变更', 'B、需求变更及时反映在设计中', 'C、拒绝所有需求变更', 'D、仅承建单位同意即可变更'], answer: 'B', explanation: '讲义中明确在实施阶段“需求变更的内容也应及时反映在设计和实施方案中”。' },
            { id: 17024, chapter: 17, group: 'theory', text: '关于项目延期的处理程序，以下正确的是？', options: ['A、延期事件发生后立即批准', 'B、承建单位不需提交延期报告', 'C、总监理工程师需分析研究提出建议', 'D、不需要业主单位协商'], answer: 'C', explanation: '讲义中明确“项目延期事件发生后，总监理工程师应对该事件进行分析、研究，对减少损失提出建议”。' },
            { id: 17025, chapter: 17, group: 'theory', text: '变更效果评估的主要内容不包括？', options: ['A、评估目的是否达成', 'B、评估变更方案与实施过程的差距', 'C、评估申请人的工作表现', 'D、评估变更的可能影响'], answer: 'C', explanation: '讲义中列出的变更效果评估内容包括评估目的达成、方案与实施差距、可能影响，不涉及申请人的工作表现。' },
            { id: 17026, chapter: 17, group: 'theory', text: '在变更控制程序中，变更控制委员会(CCB)的主要职责是什么？', options: ['A、实施具体的变更工作', 'B、编写变更技术方案', 'C、审查、评价、批准或驳回变更', 'D、承担变更实施后的运维工作'], answer: 'C', explanation: '讲义中明确变更控制委员会“负责审查、评价、批准或驳回变更，并传达变更处理决定”。' },
            { id: 17027, chapter: 17, group: 'theory', text: '变更控制程序中，对变更信息的沟通过程主要采用什么方式？', options: ['A、仅使用口头沟通', 'B、仅使用非正式沟通', 'C、运用书面和口头的执行绩效报告', 'D、仅通过电子邮件沟通'], answer: 'C', explanation: '讲义中明确变更信息的沟通过程是“运用书面的和口头的执行绩效报告进行变更的确认和管理”。' },
            { id: 17028, chapter: 17, group: 'theory', text: '在变更控制系统中，“专家判断”指的是什么？', options: ['A、仅参考监理单位内部意见', 'B、仅听取业主单位意见', 'C、征求具备相关专业知识或培训的个人意见', 'D、完全依赖承建单位的技术方案'], answer: 'C', explanation: '讲义中明确“变更应考虑征求具备相关专业知识或接受过相关培训的个人的意见”。' },
            { id: 17029, chapter: 17, group: 'theory', text: '在数据分析技术中，“成本效益分析”主要用于什么目的？', options: ['A、确定变更申请是否值得投入相关成本', 'B、评估变更的技术可行性', 'C、决定变更的紧急程度', 'D、分析变更对进度的影响'], answer: 'A', explanation: '讲义中明确“成本效益分析：有助于确定变更申请是否值得投入相关成本”。' },
            { id: 17030, chapter: 17, group: 'theory', text: '在变更决策技术中，“多标准决策分析”借助什么工具？', options: ['A、简单的投票', 'B、个人的经验判断', 'C、决策矩阵进行系统分析', 'D、独断型决策制定'], answer: 'C', explanation: '讲义中明确“多标准决策分析：借助决策矩阵，根据一系列预定义的准则，用系统分析方法评估变更申请”。' },
            { id: 17031, chapter: 17, group: 'theory', text: '需求变更控制中，在项目招标阶段监理工程师的重点工作是什么？', options: ['A、实施具体的编码工作', 'B、进行需求确认和合同签订', 'C、直接修改设计方案', 'D、代替业主单位做决策'], answer: 'B', explanation: '讲义中明确在招标阶段“监理工程师应做好需求确认和合同签订工作”。' },
            { id: 17032, chapter: 17, group: 'theory', text: '对于项目延期的监理要点，当项目延期影响总体进度计划时，监理单位应该怎么做？', options: ['A、不予理会', 'B、要求承建单位修改总体进度计划', 'C、直接终止合同', 'D、单方面决定新的工期'], answer: 'B', explanation: '讲义中明确“项目延期影响项目总体进度计划时，应要求承建单位修改项目总体进度计划，经三方签认后，做工程备忘录”。' },
            { id: 17033, chapter: 17, group: 'theory', text: '在项目延期事件发生后，承建单位首先应该做什么？', options: ['A、立即停止所有工作', 'B、在合同约定期限内提交工程延期意向报告', 'C、单方面决定新的工期', 'D、不通知任何相关方直接延期'], answer: 'B', explanation: '讲义中明确“项目延期事件发生后，承建单位应在合同约定期限内提交工程延期意向报告”。' },
            { id: 17034, chapter: 17, group: 'theory', text: '当项目暂停是由于业主单位原因时，复工的正确处理方式是？', options: ['A、承建单位自行决定复工时间', 'B、监理工程师在原因消失后及时签发复工令', 'C、需要政府主管部门批准', 'D、必须重新招标'], answer: 'B', explanation: '讲义中明确“如项目暂停是由于业主单位原因...监理工程师应在暂停原因消失，具备复工条件时，及时签发复工令，指令承建单位复工”。' },
            { id: 17035, chapter: 17, group: 'theory', text: '在投资变更控制中，对于成本产生超出合理范围的正偏差（大量节余），应该采取什么态度？', options: ['A、一定是好事，不需要关注', 'B、未必是好事，需要查明原因', 'C、完全忽略', 'D、立即分配给团队成员'], answer: 'B', explanation: '讲义中明确“大量的成本节余未必是好事”，需要查明原因。' },
            { id: 17036, chapter: 17, group: 'theory', text: '合同变更的条件中，如果由于不可抗力致使合同全部义务不能履行，应该如何处理？', options: ['A、单方面终止合同', 'B、双方当事人仍需强制履行', 'C、可以变更或解除合同', 'D、仅承建单位承担责任'], answer: 'C', explanation: '讲义中将“由于不可抗力致使合同的全部义务不能履行”列为合同变更的条件之一。' },
            { id: 17037, chapter: 17, group: 'theory', text: '合同变更的一般程序中，对于涉及国家指令性项目的合同变更，有什么特殊要求？', options: ['A、无需任何审批', 'B、必须在变更前报请有关部门批准', 'C、仅需口头汇报', 'D、仅承建单位内部批准即可'], answer: 'B', explanation: '讲义中明确“合同变更涉及国家指令性项目时，必须在变更合同之前报请有关部门批准”。' },
            { id: 17038, chapter: 17, group: 'theory', text: '在变更受理的控制要点中，谁可以主持审查和处理工程变更？', options: ['A、任何项目成员', 'B、只有业主单位项目经理', 'C、总监理工程师或其授权代表', 'D、只有承建单位技术负责人'], answer: 'C', explanation: '讲义中明确“应由总监理工程师主持审查和处理工程变更，总监理工程师代表获得总监理工程师授权后，也可以主持审查和处理工程变更”。' },
            { id: 17039, chapter: 17, group: 'theory', text: '变更处理的控制要点强调，变更处理过程必须满足什么要求？', options: ['A、承建合同中规定的时限要求', 'B、监理单位的内部时限', 'C、业主单位的随意要求', 'D、承建单位单方面设定的时限'], answer: 'A', explanation: '讲义中明确“变更处理过程应满足承建合同中规定的时限要求”。' },
            { id: 17040, chapter: 17, group: 'theory', text: '在变更实施的控制要点中，如果变更费用不能使用风险预留资金，通常不能采用以下哪种方式？', options: ['A、使用变更预算', 'B、请求业主单位增加投资', 'C、适当削减其他部分范围', 'D、向承建单位罚款'], answer: 'D', explanation: '讲义中列出了变更费用的支付办法，包括使用变更预算、请求业主增加投资、削减其他部分预算，但未提及向承建单位罚款。' },
            { id: 17041, chapter: 17, group: 'theory', text: '根据变更的划分，如果某个变更需要立即处理否则会造成严重损失，这属于？', options: ['A、一般变更', 'B、重要变更', 'C、紧急变更', 'D、重大变更'], answer: 'C', explanation: '讲义中根据变更的迫切性划分为紧急变更和非紧急变更，紧急变更需要立即处理。' },
            { id: 17042, chapter: 17, group: 'theory', text: '在变更分析与评估阶段，评估变更方案的可行性时，主要评估什么？', options: ['A、仅评估技术可行性', 'B、评估技术、经济、操作等方面的可行性', 'C、仅评估经济可行性', 'D、仅评估操作可行性'], answer: 'B', explanation: '讲义中提到的变更分析与评估包括“评估变更方案的可行性、合理性”，这通常涉及技术、经济、操作等多方面可行性。' },
            { id: 17043, chapter: 17, group: 'theory', text: '变更初审阶段，对变更申请单位施加影响的主要目的是什么？', options: ['A、强制其撤回变更申请', 'B、确认变更的必要性', 'C、拖延变更处理时间', 'D、增加变更申请难度'], answer: 'B', explanation: '讲义中明确变更初审的目的包括“根据收集的变更信息，对变更申请单位施加影响，确认变更的必要性”。' },
            { id: 17044, chapter: 17, group: 'theory', text: '在变更控制原则中，“选择冲击最小的方案”意味着什么？', options: ['A、完全避免任何变更', 'B、在尽可能小的变动幅度内进行微调', 'C、只接受不增加成本的变更', 'D、只接受不延长工期的变更'], answer: 'B', explanation: '讲义中明确“力求在尽可能小的变动幅度内进行微调”，这就是选择冲击最小方案的具体体现。' },
            { id: 17045, chapter: 17, group: 'theory', text: '变更效果评估中，评估“变更方案与实施过程的差距”的主要目的是什么？', options: ['A、追究个人责任', 'B、推动问题的解决', 'C、证明变更的必要性', 'D、评估团队绩效'], answer: 'B', explanation: '讲义中明确变更效果评估要“评估变更方案与实施过程的差距，并推动解决”。' }
        ];

        // ★★★ 第18节 风险管理（46题）★★★
        const CHAPTER_18 = [
            { id: 18001, chapter: 18, group: 'theory', text: '以下哪项属于技术风险？', options: ['A、项目团队成员离职', 'B、客户提出修改需求', 'C、使用的技术不成熟', 'D、成本超出预算'], answer: 'C', explanation: '讲义中明确技术风险包括“技术不成熟、兼容性问题、技术选型错误等”，其他选项分别属于人力资源、需求变更和成本风险。' },
            { id: 18002, chapter: 18, group: 'theory', text: '风险规划的主要依据不包括以下哪项？', options: ['A、项目管理计划', 'B、组织过程资产', 'C、项目干系人', 'D、已完工的交付成果'], answer: 'D', explanation: '讲义中列出的风险规划依据包括项目管理计划、组织过程资产和项目干系人，已完工的交付成果不属于风险规划的依据。' },
            { id: 18003, chapter: 18, group: 'theory', text: '进行风险规划的常用形式是什么？', options: ['A、单独访谈', 'B、问卷调查', 'C、会议', 'D、现场观察'], answer: 'C', explanation: '讲义中明确“进行风险规划的常用形式是会议”。' },
            { id: 18004, chapter: 18, group: 'theory', text: '风险管理计划中不需要包含以下哪项内容？', options: ['A、方法论', 'B、角色与职责', 'C、具体的技术实现方案', 'D、预算'], answer: 'C', explanation: '讲义中列出的风险管理计划内容包括方法论、角色与职责、预算、沟通计划等，具体技术实现方案属于技术设计范畴，不在风险管理计划中。' },
